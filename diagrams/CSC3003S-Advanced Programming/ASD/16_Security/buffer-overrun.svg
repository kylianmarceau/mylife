<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 330" role="img"><title>Buffer overrun</title><defs><marker id="66b3ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66b3ff" stroke-width="1.5"/></marker><marker id="b89aff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#b89aff" stroke-width="1.5"/></marker><marker id="5ad4b5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5ad4b5" stroke-width="1.5"/></marker><marker id="ffc778" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ffc778" stroke-width="1.5"/></marker><marker id="ff939b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ff939b" stroke-width="1.5"/></marker><marker id="adb9cb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#adb9cb" stroke-width="1.5"/></marker><marker id="f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#f8fafc" stroke-width="1.5"/></marker></defs><text x="450.0" y="37.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">Memory safety: out-of-bounds and invalid buffer operations</text><line x1="120" y1="170" x2="700" y2="170" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)" marker-start="url(#adb9cb)"/><text x="410.0" y="159.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb">memory</text><rect x="260" y="185" width="300" height="50" rx="8" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="410.0" y="215.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc">intended buffer</text><path d="M250 260 C 230 300, 200 230, 210 200" fill="none" stroke="#ff939b" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#ff939b)"/><path d="M570 260 C 590 300, 620 230, 610 200" fill="none" stroke="#ff939b" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#ff939b)"/><text x="410.0" y="294.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ff939b">read or write past either end = out of bounds</text><text x="250.0" y="91.4" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ffc778">① read-only pointer</text><text x="250.0" y="107.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ffc778">used to write</text><text x="560.0" y="91.4" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ffc778">② overwrite of</text><text x="560.0" y="107.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ffc778">neighbouring data</text><line x1="260" y1="120" x2="320" y2="183" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#ffc778)"/><line x1="540" y1="120" x2="480" y2="183" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#ffc778)"/><text x="740.0" y="104.5" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ffc778">crash</text><text x="740.0" y="149.6" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ffc778">unexpected results</text><text x="740.0" y="194.6" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ff939b">execute arbitrary code</text><text x="740.0" y="239.6" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ff939b">read unauthorised data</text></svg>