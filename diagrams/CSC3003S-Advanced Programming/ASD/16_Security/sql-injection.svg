ke ''</text><text x="670.0" y="244.6" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#f8fafc">union select username, password</text><text x="670.0" y="260.8" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#f8fafc">from users -- '</text><text x="450.0" y="314.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5ad4b5">fix: parameterised queries (SELECT * FROM users WHERE username = ?) — never string-build SQL</text></svg>