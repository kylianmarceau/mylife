<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 330" role="img"><title>Test-driven development cycle</title><defs><marker id="66b3ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66b3ff" stroke-width="1.5"/></marker><marker id="b89aff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#b89aff" stroke-width="1.5"/></marker><marker id="5ad4b5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5ad4b5" stroke-width="1.5"/></marker><marker id="ffc778" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ffc778" stroke-width="1.5"/></marker><marker id="ff939b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ff939b" stroke-width="1.5"/></marker><marker id="adb9cb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#adb9cb" stroke-width="1.5"/></marker><marker id="f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#f8fafc" stroke-width="1.5"/></marker></defs><text x="450.0" y="37.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">Test-driven development: test first, then code</text><rect x="15" y="110" width="160" height="64" rx="8" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="95.0" y="138.4" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">1. Stub the code</text><text x="95.0" y="154.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">(no implementation)</text><rect x="193" y="110" width="160" height="64" rx="8" fill="#3f2a33" stroke="#ff939b" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="273.0" y="138.4" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">2. Write a test</text><text x="273.0" y="154.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">→ it fails</text><rect x="371" y="110" width="160" height="64" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="451.0" y="138.4" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">3. Implement until</text><text x="451.0" y="154.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">tests pass</text><rect x="549" y="110" width="160" height="64" rx="8" fill="#3f2a33" stroke="#ff939b" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="629.0" y="138.4" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">4. Add a new test</text><text x="629.0" y="154.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">before new code</text><rect x="727" y="110" width="160" height="64" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="807.0" y="138.4" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">5. Code until it</text><text x="807.0" y="154.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">passes</text><line x1="175" y1="142.0" x2="193" y2="142.0" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#ffc778)"/><line x1="353" y1="142.0" x2="371" y2="142.0" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#ffc778)"/><line x1="531" y1="142.0" x2="549" y2="142.0" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#ffc778)"/><line x1="709" y1="142.0" x2="727" y2="142.0" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#ffc778)"/><path d="M807 176 C 807 240, 629 240, 629 176" fill="none" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-dasharray="6 5" marker-end="url(#ffc778)"/><text x="719.0" y="259.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ffc778">repeat for each new piece of behaviour</text><text x="450.0" y="304.9" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#b89aff">6. Finally make the tests comprehensive (edge cases, full coverage)</text></svg>