<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 330" role="img"><title>Diminishing returns of AI scaling</title><defs><marker id="66b3ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66b3ff" stroke-width="1.5"/></marker><marker id="b89aff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#b89aff" stroke-width="1.5"/></marker><marker id="5ad4b5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5ad4b5" stroke-width="1.5"/></marker><marker id="ffc778" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ffc778" stroke-width="1.5"/></marker><marker id="ff939b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ff939b" stroke-width="1.5"/></marker><marker id="adb9cb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#adb9cb" stroke-width="1.5"/></marker><marker id="f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#f8fafc" stroke-width="1.5"/></marker></defs><text x="450.0" y="37.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">Scaling: smooth on a log–log plot, but diminishing returns</text><line x1="90" y1="290" x2="90" y2="70" stroke="#f8fafc" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#f8fafc)"/><line x1="90" y1="290" x2="820" y2="290" stroke="#f8fafc" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#f8fafc)"/><text x="450.0" y="322.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb">compute (log scale)</text><text x="80.0" y="176.4" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb">loss</text><text x="80.0" y="192.7" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb">(log)</text><line x1="100" y1="90" x2="800" y2="280" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-dasharray="6 5"/><text x="800.0" y="266.2" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#ffc778">power-law line</text><path d="M100 90 C 300 150, 500 210, 800 240" fill="none" stroke="#5ad4b5" stroke-width="2.6" vector-effect="non-scaling-stroke"/><text x="790.0" y="232.2" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#5ad4b5">observed frontier flattens</text><text x="300.0" y="116.4" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb">each 10× compute buys a smaller</text><text x="300.0" y="132.7" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb">improvement (Toby Ord, 'the scaling paradox')</text></svg>