rif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc">Plan</text><rect x="270" y="150" width="150" height="50" rx="8" fill="#302b46" stroke="#b89aff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="345.0" y="180.9" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc">Develop</text><rect x="480" y="150" width="150" height="50" rx="8" fill="#3d3326" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="555.0" y="180.9" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc">Test</text><rect x="690" y="150" width="150" height="50" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="765.0" y="180.9" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc">Release</text><line x1="210" y1="175.0" x2="270" y2="175.0" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)"/><line x1="420" y1="175.0" x2="480" y2="175.0" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)"/><line x1="630" y1="175.0" x2="690" y2="175.0" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)"/><path d="M660 148 C 600 60, 200 60, 135 148" fill="none" stroke="#ff939b" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#ff939b)"/><text x="400.0" y="83.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#ff939b">user feedback → next iteration</text><text x="450.0" y="254.9" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb">RAD variant: requirements → design → develop → deploy (test) → learning (reflect) → …</text><text x="450.0" y="284.9" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb">Prototyping variant: requirements → prototype → tests → requirements …</text></svg>