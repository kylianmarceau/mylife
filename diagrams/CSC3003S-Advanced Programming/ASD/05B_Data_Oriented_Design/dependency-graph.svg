<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 520" role="img"><title>Dependency graph for out-of-order execution</title><defs><marker id="66b3ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66b3ff" stroke-width="1.5"/></marker><marker id="b89aff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#b89aff" stroke-width="1.5"/></marker><marker id="5ad4b5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5ad4b5" stroke-width="1.5"/></marker><marker id="ffc778" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ffc778" stroke-width="1.5"/></marker><marker id="ff939b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ff939b" stroke-width="1.5"/></marker><marker id="adb9cb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#adb9cb" stroke-width="1.5"/></marker><marker id="f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#f8fafc" stroke-width="1.5"/></marker></defs><text x="450.0" y="37.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">Dependency graph: independent nodes can run in parallel</text><text x="200.0" y="458.3" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#adb9cb">load a; b = 2*a; c = a+3; d = a-4;</text><text x="200.0" y="474.6" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#adb9cb">e = c*d; f = c-d; g = e/f; h = g+5;</text><text x="200.0" y="490.8" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#adb9cb">i = h*6; j = h+7; k = i/j; l = b+k;</text><line x1="585.031991301323" y1="78.0596969915953" x2="486.7289508985213" y2="130.99210336233466" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)"/><line x1="591.5656380479338" y1="84.7601334161158" x2="569.4266398287798" y2="123.50338029963527" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)"/><line x1="613.9269426488237" y1="79.74885985417659" x2="684.4345935101383" y2="129.10421545709676" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)"/><line x1="560.0" y1="157.0" x2="560.0" y2="191.0" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)"/><line x1="684.7947377530014" y1="147.6026311234993" x2="576.9941166289984" y2="201.5029416855008" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)"/><line x1="575.2052622469986" y1="147.6026311234993" x2="683.0058833710016" y2="201.5029416855008" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)"/><line x1="700.0" y1="157.0" x2="700.0" y2="191.0" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)"/><line x1="572.0208152801713" y1="222.02081528017132" x2="616.5649711574556" y2="266.5649711574556" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)"/><line x1="687.9791847198287" y1="222.02081528017132" x2="643.4350288425444" y2="266.5649711574556" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)"/><line x1="630.0" y1="297.0" x2="630.0" y2="321.0" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)"/><line x1="617.9791847198287" y1="352.0208152801713" x2="583.4350288425444" y2="386.5649711574556" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)"/><line x1="642.0208152801713" y1="352.0208152801713" x2="676.5649711574556" y2="386.5649711574556" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)"/><line x1="582.0208152801713" y1="412.0208152801713" x2="616.5649711574556" y2="446.5649711574556" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)"/><line x1="677.9791847198287" y1="412.0208152801713" x2="643.4350288425444" y2="446.5649711574556" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)"/><line x1="470.0" y1="157.0" x2="470.0" y2="471.0" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)"/><line x1="613.2911728221166" y1="463.1329050958532" x2="488.67457155175214" y2="486.4985178340465" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#adb9cb)"/><circle cx="600" cy="70" r="16" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="600.0" y="75.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc">a</text><circle cx="470" cy="140" r="16" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="470.0" y="145.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc">b</text><circle cx="560" cy="140" r="16" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="560.0" y="145.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc">c</text><circle cx="700" cy="140" r="16" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="700.0" y="145.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc">d</text><circle cx="560" cy="210" r="16" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="560.0" y="215.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc">e</text><circle cx="700" cy="210" r="16" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="700.0" y="215.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc">f</text><circle cx="630" cy="280" r="16" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="630.0" y="285.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc">g</text><circle cx="630" cy="340" r="16" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="630.0" y="345.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc">h</text><circle cx="570" cy="400" r="16" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="570.0" y="405.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc">i</text><circle cx="690" cy="400" r="16" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="690.0" y="405.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc">j</text><circle cx="630" cy="460" r="16" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="630.0" y="465.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc">k</text><circle cx="470" cy="490" r="16" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="470.0" y="495.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc">l</text><text x="200.0" y="128.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#5ad4b5">teal pairs (c,d), (e,f), (i,j) do</text><text x="200.0" y="146.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#5ad4b5">not depend on each other, so a</text><text x="200.0" y="163.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#5ad4b5">superscalar CPU can execute them</text><text x="200.0" y="181.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#5ad4b5">at the same time</text></svg>