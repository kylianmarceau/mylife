kMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">(editor.SaveToFile)</text><line x1="540" y1="158.0" x2="650" y2="158.0" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#ffc778)"/><text x="450.0" y="269.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb">no OKButton/SaveButton subclasses: no duplicated code, loose UI–logic coupling (today: a lambda)</text></svg>