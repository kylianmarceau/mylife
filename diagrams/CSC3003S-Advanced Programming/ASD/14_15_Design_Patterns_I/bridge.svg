9cb" stroke-width="1.6"/><path d="M795 114 L808.4 117.7 L798.4 127.5 Z" fill="#1e1e1e" stroke="#adb9cb" stroke-width="1.6"/><text x="680.0" y="254.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#5ad4b5">shapes and colours vary independently: m + n classes</text><text x="450.0" y="309.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb">"Bridge separates abstraction from implementation" — e.g. GUI shapes over an OS display layer</text></svg>