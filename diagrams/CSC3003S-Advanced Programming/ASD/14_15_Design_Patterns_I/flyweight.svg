icle stores everything</text><rect x="120" y="80" width="200" height="127" rx="4" fill="#3f2a33" stroke="#ff939b" stroke-width="1.6" vector-effect="non-scaling-stroke"/><text x="220.0" y="101.5" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" font-weight="600">Particle</text><line x1="120" y1="114" x2="320" y2="114" stroke="#ff939b" stroke-width="1.2"/><text x="128.0" y="132.2" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#f8fafc">coords 8B</text><text x="128.0" y="149.2" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#f8fafc">vector 16B</text><text x="128.0" y="166.2" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#f8fafc">speed 4B</text><text x="128.0" y="183.2" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#f8fafc">color 4B</text><text x="128.0" y="200.2" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#f8fafc">sprite 20KB</text><text x="220.0" y="254.9" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#ff939b" font-weight="600">≈21 KB × 1 000 000 = 21 GB</text><text x="680.0" y="68.9" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#5ad4b5" font-weight="600">Flyweight split</text><rect x="500" y="80" width="170" height="93" rx="4" fill="#20344c" stroke="#66b3ff" stroke-width="1.6" vector-effect="non-scaling-stroke"/><text x="585.0" y="101.5" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFo