<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 400" role="img"><title>foldl builds thunks, foldl' collapses as it goes</title><defs><marker id="66b3ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66b3ff" stroke-width="1.5"/></marker><marker id="b89aff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#b89aff" stroke-width="1.5"/></marker><marker id="5ad4b5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5ad4b5" stroke-width="1.5"/></marker><marker id="ffc778" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ffc778" stroke-width="1.5"/></marker><marker id="ff939b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ff939b" stroke-width="1.5"/></marker><marker id="adb9cb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#adb9cb" stroke-width="1.5"/></marker><marker id="f8fafc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#f8fafc" stroke-width="1.5"/></marker></defs><text x="450.0" y="37.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">foldl (+) 0 [1..n]  versus  foldl' (+) 0 [1..n]</text><text x="225.0" y="78.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#ff939b" font-weight="600">foldl: lazy accumulator</text><text x="675.0" y="78.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#5ad4b5" font-weight="600">foldl': accumulator forced by seq</text><rect x="140.0" y="95" width="170" height="38" rx="8" fill="#3f2a33" stroke="#ff939b" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="225.0" y="118.9" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f8fafc">0 + 1</text><rect x="117.5" y="145" width="215" height="38" rx="8" fill="#3f2a33" stroke="#ff939b" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="225.0" y="168.9" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f8fafc">(0 + 1) + 2</text><rect x="95.0" y="195" width="260" height="38" rx="8" fill="#3f2a33" stroke="#ff939b" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="225.0" y="218.9" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f8fafc">((0 + 1) + 2) + 3</text><rect x="72.5" y="245" width="305" height="38" rx="8" fill="#3f2a33" stroke="#ff939b" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="225.0" y="268.9" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f8fafc">(((0+1)+2)+3) + 4</text><rect x="50.0" y="295" width="350" height="38" rx="8" fill="#3f2a33" stroke="#ff939b" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="225.0" y="318.9" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f8fafc">… ~n nested thunks</text><text x="225.0" y="369.9" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#ff939b">nothing reduces until the end → huge memory, stack overflow</text><rect x="575" y="95" width="200" height="38" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="675.0" y="118.9" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f8fafc">acc = 1</text><rect x="575" y="145" width="200" height="38" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="675.0" y="168.9" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f8fafc">acc = 3</text><line x1="675" y1="133" x2="675" y2="145" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#5ad4b5)"/><rect x="575" y="195" width="200" height="38" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="675.0" y="218.9" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f8fafc">acc = 6</text><line x1="675" y1="183" x2="675" y2="195" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#5ad4b5)"/><rect x="575" y="245" width="200" height="38" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="675.0" y="268.9" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f8fafc">acc = 10</text><line x1="675" y1="233" x2="675" y2="245" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#5ad4b5)"/><rect x="575" y="295" width="200" height="38" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="675.0" y="318.9" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f8fafc">…  acc stays one number</text><line x1="675" y1="283" x2="675" y2="295" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#5ad4b5)"/><text x="675.0" y="369.9" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#5ad4b5">each step evaluated immediately → constant space</text></svg>