="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb">Connections are symmetric by default; "North of the Walkway is west of Psycho Cell" rewires one asymmetrically</text></svg>