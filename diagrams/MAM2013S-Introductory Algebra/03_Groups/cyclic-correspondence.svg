<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 780 315" role="img"><title>Finite and infinite cyclic group correspondences</title>
<defs>
<marker id="a66b3ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.5"/></marker>
<marker id="ab89aff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.5"/></marker>
<marker id="a5ad4b5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.5"/></marker>
<marker id="affc778" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.5"/></marker>
<marker id="af8fafc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.5"/></marker>
<marker id="aadb9cb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.5"/></marker>
</defs>
<text x="390" y="35" fill="#b89aff" font-family="Arial" font-size="21" text-anchor="middle">Finite cyclic group</text>
<text x="100.0" y="70" fill="#f8fafc" font-family="Arial" font-size="22" text-anchor="middle">a⁰</text>
<line x1="100.0" y1="80" x2="100.0" y2="110" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<polyline points="104.0,101.0 100.0,110 96.0,101.0" fill="none" stroke="#66b3ff" stroke-width="1.8"/>
<text x="100.0" y="139" fill="#5ad4b5" font-family="Arial" font-size="22" text-anchor="middle">0̅</text>
<text x="245.0" y="70" fill="#f8fafc" font-family="Arial" font-size="22" text-anchor="middle">a¹</text>
<line x1="245.0" y1="80" x2="245.0" y2="110" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<polyline points="249.0,101.0 245.0,110 241.0,101.0" fill="none" stroke="#66b3ff" stroke-width="1.8"/>
<text x="245.0" y="139" fill="#5ad4b5" font-family="Arial" font-size="22" text-anchor="middle">1̅</text>
<text x="390.0" y="70" fill="#f8fafc" font-family="Arial" font-size="22" text-anchor="middle">a²</text>
<line x1="390.0" y1="80" x2="390.0" y2="110" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<polyline points="394.0,101.0 390.0,110 386.0,101.0" fill="none" stroke="#66b3ff" stroke-width="1.8"/>
<text x="390.0" y="139" fill="#5ad4b5" font-family="Arial" font-size="22" text-anchor="middle">2̅</text>
<text x="535.0" y="70" fill="#f8fafc" font-family="Arial" font-size="22" text-anchor="middle">…</text>
<line x1="535.0" y1="80" x2="535.0" y2="110" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<polyline points="539.0,101.0 535.0,110 531.0,101.0" fill="none" stroke="#66b3ff" stroke-width="1.8"/>
<text x="535.0" y="139" fill="#5ad4b5" font-family="Arial" font-size="22" text-anchor="middle">…</text>
<text x="680.0" y="70" fill="#f8fafc" font-family="Arial" font-size="22" text-anchor="middle">aⁿ⁻¹</text>
<line x1="680.0" y1="80" x2="680.0" y2="110" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<polyline points="684.0,101.0 680.0,110 676.0,101.0" fill="none" stroke="#66b3ff" stroke-width="1.8"/>
<text x="680.0" y="139" fill="#5ad4b5" font-family="Arial" font-size="22" text-anchor="middle">n̅−̅1̅</text>
<text x="390" y="190" fill="#b89aff" font-family="Arial" font-size="21" text-anchor="middle">Infinite cyclic group</text>
<text x="100.0" y="225" fill="#f8fafc" font-family="Arial" font-size="22" text-anchor="middle">…</text>
<line x1="100.0" y1="235" x2="100.0" y2="265" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<polyline points="104.0,256.0 100.0,265 96.0,256.0" fill="none" stroke="#66b3ff" stroke-width="1.8"/>
<text x="100.0" y="294" fill="#5ad4b5" font-family="Arial" font-size="22" text-anchor="middle">…</text>
<text x="196.66666666666669" y="225" fill="#f8fafc" font-family="Arial" font-size="22" text-anchor="middle">a⁻²</text>
<line x1="196.66666666666669" y1="235" x2="196.66666666666669" y2="265" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<polyline points="200.66666666666669,256.0 196.66666666666669,265 192.66666666666669,256.0" fill="none" stroke="#66b3ff" stroke-width="1.8"/>
<text x="196.66666666666669" y="294" fill="#5ad4b5" font-family="Arial" font-size="22" text-anchor="middle">−2</text>
<text x="293.33333333333337" y="225" fill="#f8fafc" font-family="Arial" font-size="22" text-anchor="middle">a⁻¹</text>
<line x1="293.33333333333337" y1="235" x2="293.33333333333337" y2="265" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<polyline points="297.33333333333337,256.0 293.33333333333337,265 289.33333333333337,256.0" fill="none" stroke="#66b3ff" stroke-width="1.8"/>
<text x="293.33333333333337" y="294" fill="#5ad4b5" font-family="Arial" font-size="22" text-anchor="middle">−1</text>
<text x="390.0" y="225" fill="#f8fafc" font-family="Arial" font-size="22" text-anchor="middle">a⁰</text>
<line x1="390.0" y1="235" x2="390.0" y2="265" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<polyline points="394.0,256.0 390.0,265 386.0,256.0" fill="none" stroke="#66b3ff" stroke-width="1.8"/>
<text x="390.0" y="294" fill="#5ad4b5" font-family="Arial" font-size="22" text-anchor="middle">0</text>
<text x="486.6666666666667" y="225" fill="#f8fafc" font-family="Arial" font-size="22" text-anchor="middle">a¹</text>
<line x1="486.6666666666667" y1="235" x2="486.6666666666667" y2="265" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<polyline points="490.6666666666667,256.0 486.6666666666667,265 482.6666666666667,256.0" fill="none" stroke="#66b3ff" stroke-width="1.8"/>
<text x="486.6666666666667" y="294" fill="#5ad4b5" font-family="Arial" font-size="22" text-anchor="middle">1</text>
<text x="583.3333333333333" y="225" fill="#f8fafc" font-family="Arial" font-size="22" text-anchor="middle">a²</text>
<line x1="583.3333333333333" y1="235" x2="583.3333333333333" y2="265" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<polyline points="587.3333333333333,256.0 583.3333333333333,265 579.3333333333333,256.0" fill="none" stroke="#66b3ff" stroke-width="1.8"/>
<text x="583.3333333333333" y="294" fill="#5ad4b5" font-family="Arial" font-size="22" text-anchor="middle">2</text>
<text x="680.0" y="225" fill="#f8fafc" font-family="Arial" font-size="22" text-anchor="middle">…</text>
<line x1="680.0" y1="235" x2="680.0" y2="265" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<polyline points="684.0,256.0 680.0,265 676.0,256.0" fill="none" stroke="#66b3ff" stroke-width="1.8"/>
<text x="680.0" y="294" fill="#5ad4b5" font-family="Arial" font-size="22" text-anchor="middle">…</text>
</svg>