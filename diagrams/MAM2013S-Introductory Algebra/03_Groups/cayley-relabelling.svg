<text x="195" y="35" fill="#b89aff" font-family="Arial" font-size="22" text-anchor="middle">Original group</text>
<line x1="100" y1="85" x2="295" y2="85" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<line x1="170" y1="60" x2="170" y2="175" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<text x="230" y="72" fill="#66b3ff" font-family="Arial" font-size="21" text-anchor="middle">b</text>
