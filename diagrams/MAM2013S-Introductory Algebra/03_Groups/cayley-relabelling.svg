<text x="390" y="91" fill="#ffc778" font-family="Arial" font-size="19" text-anchor="middle">Relabel</text>
<text x="590" y="201" fill="#adb9cb" font-family="Arial" font-size="20" text-anchor="middle">φ(ab) = φ(a)φ(b)</text>
