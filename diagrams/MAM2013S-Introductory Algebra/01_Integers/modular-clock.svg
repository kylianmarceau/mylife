<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 660 330" role="img" aria-labelledby="title desc">
<title id="title">Twelve-hour modular clock at three o'clock</title>
<desc id="desc">A clock labelled one to twelve has its minute hand pointing to twelve and its hour hand pointing to three. Twelve represents the zero residue modulo twelve. A whole turn returns to the same position.</desc>
<circle cx="330" cy="165" r="145" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<g fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" text-anchor="middle">
<text x="390" y="69">1</text>
<text x="434" y="113">2</text>
<text x="450" y="173" fill="#5ad4b5" font-weight="600">3</text>
<text x="434" y="233">4</text>
<text x="390" y="277">5</text>
<text x="330" y="293">6</text>
<text x="270" y="277">7</text>
<text x="226" y="233">8</text>
<text x="210" y="173">9</text>
<text x="226" y="113">10</text>
<text x="270" y="69">11</text>
<text x="330" y="53">12</text>
</g>
<line x1="330" y1="165" x2="330" y2="79" stroke="#66b3ff" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<line x1="330" y1="165" x2="414" y2="165" stroke="#5ad4b5" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<circle cx="330" cy="165" r="5" fill="#f8fafc"/>
</svg>
