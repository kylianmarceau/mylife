<g data-from="F" data-to="C" data-label="" data-bidirectional="false"><path d="M221.193 409 L576.053 230" fill="none" stroke="#66b3ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-blue)"/></g>
