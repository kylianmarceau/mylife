<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 880 555" role="img" aria-labelledby="title desc">
<title id="title">Continuum crowds</title>
<desc id="desc">Shared spatial fields influence path choice for crowd agents. Nodes: Current position; Candidate goal paths; Compare length time and discomfort; Goal region; Feasible speed field; Discomfort field.</desc>
<defs>
