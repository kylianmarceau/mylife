<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 950 750" role="img" aria-labelledby="title desc">
<title id="title">Brooks&#x27; subsumption architecture</title>
<desc id="desc">Local motion and recovery modules jointly produce maze traversal without a symbolic full-maze plan. Nodes: Position and distance sensor information; Explore world; Combined behavior outputs; Object avoidance; Collision recovery; Actuators; Environment; Observed maze navigation.</desc>
<defs>
