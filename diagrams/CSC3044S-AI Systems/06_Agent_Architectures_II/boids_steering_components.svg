<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 765" role="img" aria-labelledby="title desc">
<title id="title">Boids: local steering and collective patterns</title>
<desc id="desc">The three distinct steering effects combine to change individual movement. Nodes: Visible local neighbors; Separation away from crowding; Alignment average heading; Cohesion average position; Combine steering; Update movement.</desc>
<defs>
