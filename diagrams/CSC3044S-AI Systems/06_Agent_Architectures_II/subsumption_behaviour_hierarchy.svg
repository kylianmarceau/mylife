<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 970 600" role="img" aria-labelledby="title desc">
<title id="title">Brooks&#x27; subsumption architecture</title>
<desc id="desc">Parallel task controllers can suppress or override lower-level signal paths according to the designed hierarchy. Nodes: Sensation stream; Behavior 1 primitive competence; Action stream; Behavior 2; Behavior 3.</desc>
