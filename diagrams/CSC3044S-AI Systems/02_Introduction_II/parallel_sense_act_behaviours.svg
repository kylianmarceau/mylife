<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 820 730" role="img" aria-labelledby="title desc">
<title id="title">Reactive stimulus-response architectures</title>
<desc id="desc">The example sense-act controller has concurrent behavior modules feeding action control. Nodes: Sense; Identify objects; Act; Monitor changes; Explore; Wander; Avoid objects; Environment.</desc>
