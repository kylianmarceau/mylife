<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 930 440" role="img" aria-labelledby="title desc">
<title id="title">Braitenberg vehicles and vacuum robots</title>
<desc id="desc">Same-side excitatory wiring turns away from a light; crossed wiring turns toward it. Nodes: Left light sensor; Left motor; Right light sensor; Right motor; Left light sensor; Right motor; Right light sensor; Left motor.</desc>
<defs>
