<text x="493" y="50" fill="#adb9cb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600" text-anchor="start">Vehicle 2b: crossed wiring</text>
<g data-from="L1" data-to="ML1" data-label="" data-bidirectional="false"><path d="M215 150 L265 150" fill="none" stroke="#66b3ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-blue)"/></g>
