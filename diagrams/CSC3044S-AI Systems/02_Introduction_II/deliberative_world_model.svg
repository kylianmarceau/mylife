<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 550" role="img" aria-labelledby="title desc">
<title id="title">Deliberation and representation</title>
<desc id="desc">A deliberative architecture combines observations, internal state, transition knowledge, and goals. Nodes: Sensors; Current world model; Predicted action effects; Action selection; Actuators; Previous internal state; How the world evolves and what actions do; Goals.</desc>
<defs>
