<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 930 580" role="img" aria-labelledby="title desc">
<title id="title">Computer-use agents and OSWorld</title>
<desc id="desc">OSWorld sets up a task, lets an agent interact with real applications, and checks the resulting state. Nodes: Task instruction and initial setup; Computer environment with real apps; Agent; Final state; Execution-based evaluator.</desc>
