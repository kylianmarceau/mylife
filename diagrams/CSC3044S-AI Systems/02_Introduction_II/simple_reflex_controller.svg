<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 810 550" role="img" aria-labelledby="title desc">
<title id="title">Reactive stimulus-response architectures</title>
<desc id="desc">A simple-reflex architecture chooses an action from current sensed conditions and rules. Nodes: Environment; Sensors; Current observed state; Choose action; Actuators; Condition-action rules.</desc>
<defs>
