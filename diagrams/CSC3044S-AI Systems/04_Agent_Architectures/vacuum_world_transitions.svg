<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 950 640" role="img" aria-labelledby="title desc">
<title id="title">Vacuum world: facts, rules, and execution</title>
<desc id="desc">The vacuum-world transition sketch branches into northward and eastward actions. Only suction at a dirty cell changes the dirt set. Nodes: At 0,0 facing north two dirty cells; At 0,1 facing north; At 0,2 facing north; At 0,2 dirt at 1,2 remains; At 0,0 facing east; At 1,0 facing east; At 2,0 facing east; At 2,0 facing south.</desc>
