<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 1000" role="img" aria-labelledby="title desc">
<title id="title">Hybrid control and layer organization</title>
<desc id="desc">Parallel access defines horizontal layering; the vertical variant sends information upward and action control back downward. Nodes: Sensor input; Layer 1; Action output; Layer 2; Layer 3; Sensor input; Layer 1; Layer 2; Layer 3; Action output.</desc>
