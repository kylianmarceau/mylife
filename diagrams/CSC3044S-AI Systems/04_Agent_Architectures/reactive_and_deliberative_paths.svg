<title id="title">Architecture as modules and interactions</title>
<desc id="desc">Reactive control offers a direct path; deliberative control inserts a world model, planner, and executor. Nodes: Sensors; Stimulus-response behaviors; Effectors; World model; Planner; Plan executor.</desc>
