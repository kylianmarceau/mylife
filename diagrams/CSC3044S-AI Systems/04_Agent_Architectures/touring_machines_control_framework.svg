<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 730" role="img" aria-labelledby="title desc">
<title id="title">TouringMachines and warehouse robots</title>
<desc id="desc">TouringMachines coordinates three layers inside a common control framework. Nodes: Sensory input; Perception system; Modeling layer M; Planning layer P; Reactive layer R; Action subsystem; Action output.</desc>
