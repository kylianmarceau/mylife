<title id="title">Context, prompt design, and improvement</title>
<desc id="desc">Textual feedback plays an optimization role analogous to gradients, while revision targets prompts or intermediate text. Nodes: Prompt and query; LLM or tool workflow; Intermediate and final outputs; Evaluation instructions and loss; Textual feedback; Revise prompt.</desc>
