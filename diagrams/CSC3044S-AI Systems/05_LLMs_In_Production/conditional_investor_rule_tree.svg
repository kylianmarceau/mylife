<g data-node="I" aria-label="Is individual investor"><path d="M450 45.0 L575.0 100 L450 155.0 L325.0 100 Z" fill="#302b46" stroke="#b89aff" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<text x="450" y="94.5" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="500" text-anchor="middle">Is individual</text>
