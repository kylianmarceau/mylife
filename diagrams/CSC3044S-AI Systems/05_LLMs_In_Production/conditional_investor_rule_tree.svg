<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 610" role="img" aria-labelledby="title desc">
<title id="title">Client onboarding: document fields and conditional rules</title>
<desc id="desc">Parent conditions scope child checks, and presence precedes comparing the name with a database record. Nodes: Is individual investor; Check name present; Check name matches database lookup; Check ID present.</desc>
<defs>
