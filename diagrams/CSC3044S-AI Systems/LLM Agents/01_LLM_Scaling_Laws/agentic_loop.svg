<svg width="100%" viewBox="0 0 900 330" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Claude Code agentic loop</title>
<desc>A prompt enters an agentic loop of gather context, take action and verify results, which repeats until done; the user can interrupt, steer or add context.</desc>
<defs>
<marker id="arrow-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="20.0" y="92.0" width="120.0" height="56.0" rx="10" fill="#272f3b" stroke="#adb9cb" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="80.0" y="125.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="normal">Your prompt</text>
<rect x="170.0" y="30.0" width="580.0" height="190.0" rx="14" fill="none" stroke="#ffc778" stroke-width="1.4" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>
<text x="460.0" y="56.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ffc778" text-anchor="middle" font-weight="normal">agentic loop</text>
<rect x="190.0" y="92.0" width="160.0" height="56.0" rx="10" fill="#20344c" stroke="#66b3ff" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="270.0" y="125.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="bold">Gather context</text>
<rect x="380.0" y="92.0" width="160.0" height="56.0" rx="10" fill="#302b46" stroke="#b89aff" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="460.0" y="125.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="bold">Take action</text>
<rect x="570.0" y="92.0" width="160.0" height="56.0" rx="10" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="650.0" y="125.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="bold">Verify results</text>
<rect x="780.0" y="92.0" width="100.0" height="56.0" rx="10" fill="#272f3b" stroke="#adb9cb" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="830.0" y="125.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="normal">Done</text>
<line x1="140.0" y1="120.0" x2="186.0" y2="120.0" stroke="#f8fafc" stroke-width="1.6" marker-end="url(#arrow-white)" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<line x1="350.0" y1="120.0" x2="376.0" y2="120.0" stroke="#f8fafc" stroke-width="1.6" marker-end="url(#arrow-white)" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<line x1="540.0" y1="120.0" x2="566.0" y2="120.0" stroke="#f8fafc" stroke-width="1.6" marker-end="url(#arrow-white)" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<line x1="730.0" y1="120.0" x2="776.0" y2="120.0" stroke="#f8fafc" stroke-width="1.6" marker-end="url(#arrow-white)" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<path d="M650 148 L650 190 Q650 200 640 200 L280 200 Q270 200 270 190 L270 154" fill="none" stroke="#5ad4b5" stroke-width="2" marker-end="url(#arrow-teal)" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<text x="460.0" y="192.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5ad4b5" text-anchor="middle" font-weight="normal">repeat</text>
<rect x="40.0" y="250.0" width="250.0" height="56.0" rx="10" fill="#3f2a33" stroke="#ff939b" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="165.0" y="274.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle" font-weight="normal">You: interrupt, steer,</text>
<text x="165.0" y="292.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle" font-weight="normal">or add context</text>
<path d="M290 278 L520 278 L520 226" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-coral)" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
</svg>
