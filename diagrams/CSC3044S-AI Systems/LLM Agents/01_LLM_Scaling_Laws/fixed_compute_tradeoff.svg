<svg width="100%" viewBox="0 0 900 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Trade-off between model size and data under a fixed compute budget</title>
<desc>On log-log axes the iso-compute line slopes down: more parameters means fewer tokens; the balanced point gives roughly the lowest loss.</desc>
<defs>
