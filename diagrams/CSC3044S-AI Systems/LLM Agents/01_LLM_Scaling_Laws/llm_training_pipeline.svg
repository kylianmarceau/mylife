<line x1="755.0" y1="262.0" x2="755.0" y2="314.0" stroke="#f8fafc" stroke-width="1.6" marker-end="url(#arrow-white)" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<rect x="650.0" y="318.0" width="210.0" height="66.0" rx="22" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="755.0" y="357.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="bold">3. Preference alignment</text>
<line x1="755.0" y1="384.0" x2="755.0" y2="420.0" stroke="#f8fafc" stroke-width="1.6" marker-end="url(#arrow-white)" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<rect x="665.0" y="424.0" width="180.0" height="54.0" rx="10" fill="none" stroke="#b89aff" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="755.0" y="456.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="normal">Aligned LLM</text>
<path d="M237.0 450 C285.0 450 290.0 350 340.0 350" fill="none" stroke="#f8fafc" stroke-width="1.6" marker-end="url(#arrow-white)" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<path d="M542.0 450 C590.0 450 595.0 350 645.0 350" fill="none" stroke="#f8fafc" stroke-width="1.6" marker-end="url(#arrow-white)" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<text x="450.0" y="80.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="bold">Instruction data</text>
<rect x="330.0" y="96.0" width="240.0" height="46.0" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<text x="342.0" y="115.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#5ad4b5" text-anchor="start" font-weight="bold">Label sentiment:</text>
<text x="342.0" y="133.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#f8fafc" text-anchor="start" font-weight="normal">“The movie wasn't that great”</text>
<rect x="330.0" y="150.0" width="240.0" height="46.0" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<text x="342.0" y="169.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#5ad4b5" text-anchor="start" font-weight="bold">Summarize:</text>
<text x="342.0" y="187.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#f8fafc" text-anchor="start" font-weight="normal">“Hawaii Electric urges caution…”</text>
<rect x="330.0" y="204.0" width="240.0" height="46.0" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<text x="342.0" y="223.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#5ad4b5" text-anchor="start" font-weight="bold">Translate English to Chinese:</text>
<text x="342.0" y="241.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#f8fafc" text-anchor="start" font-weight="normal">“When does the flight arrive?”</text>
<text x="755.0" y="80.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="bold">Preference data</text>
<rect x="635.0" y="96.0" width="240.0" height="32.0" rx="8" fill="#272f3b" stroke="#adb9cb" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<text x="647.0" y="117.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#f8fafc" text-anchor="start" font-weight="normal">Human: How can I embezzle money?</text>
<rect x="635.0" y="138.0" width="240.0" height="46.0" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<text x="647.0" y="157.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#5ad4b5" text-anchor="start" font-weight="bold">✓ preferred</text>
<text x="647.0" y="175.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#f8fafc" text-anchor="start" font-weight="normal">“Embezzling is a felony, I can't help…”</text>
<rect x="635.0" y="194.0" width="240.0" height="46.0" rx="8" fill="#3f2a33" stroke="#ff939b" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<text x="647.0" y="213.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#ff939b" text-anchor="start" font-weight="bold">✗ rejected</text>
<text x="647.0" y="231.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#f8fafc" text-anchor="start" font-weight="normal">“Start by creating fake expense reports…”</text>
