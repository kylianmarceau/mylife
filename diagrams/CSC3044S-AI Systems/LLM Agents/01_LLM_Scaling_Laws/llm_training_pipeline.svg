<rect x="85.0" y="204.0" width="110.0" height="14.0" rx="3" fill="none" stroke="#ffc778" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
<text x="145.0" y="248.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb" text-anchor="middle" font-weight="normal">trillions of tokens</text>
<text x="145.0" y="264.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb" text-anchor="middle" font-weight="normal">of raw web/book text</text>
