<svg width="100%" viewBox="0 0 900 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Three stages of LLM training</title>
<desc>Pretraining on raw text gives a pretrained LLM, instruction tuning gives an instruction-tuned LLM, preference alignment gives an aligned LLM.</desc>
<defs>
