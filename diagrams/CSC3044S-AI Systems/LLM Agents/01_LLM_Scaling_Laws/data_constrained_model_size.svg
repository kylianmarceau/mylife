<svg width="100%" viewBox="0 0 900 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Choosing model size when data is fixed</title>
<desc>U-shaped loss curve over model size: too small lacks capacity, too big cannot use its capacity, the minimum is just right.</desc>
<defs>
<marker id="arrow-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="100.0" y="40.0" width="370.0" height="340.0" rx="0" fill="#20344c" fill-opacity="0.9" stroke="none" vector-effect="non-scaling-stroke"/>
<rect x="470.0" y="40.0" width="370.0" height="340.0" rx="0" fill="#3f2a33" fill-opacity="0.9" stroke="none" vector-effect="non-scaling-stroke"/>
<line x1="100.0" y1="380.0" x2="850.0" y2="380.0" stroke="#f8fafc" stroke-width="1.6" marker-end="url(#arrow-white)" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<line x1="100.0" y1="380.0" x2="100.0" y2="30.0" stroke="#f8fafc" stroke-width="1.6" marker-end="url(#arrow-white)" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<text x="470.0" y="424.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="normal">Model parameters N (log)</text>
<text x="70.0" y="210.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="normal" transform="rotate(-90 70.0 210.0)">Loss</text>
<line x1="100.0" y1="380.0" x2="100.0" y2="385.0" stroke="#adb9cb" stroke-width="1.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<text x="100.0" y="402.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb" text-anchor="middle" font-weight="normal">10<tspan dy="-6" font-size="10">9</tspan></text>
<line x1="333.4" y1="380.0" x2="333.4" y2="385.0" stroke="#adb9cb" stroke-width="1.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<text x="333.4" y="402.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb" text-anchor="middle" font-weight="normal">2×10<tspan dy="-6" font-size="10">9</tspan></text>
<line x1="470.0" y1="380.0" x2="470.0" y2="385.0" stroke="#adb9cb" stroke-width="1.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<text x="470.0" y="402.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb" text-anchor="middle" font-weight="normal">3×10<tspan dy="-6" font-size="10">9</tspan></text>
<line x1="566.9" y1="380.0" x2="566.9" y2="385.0" stroke="#adb9cb" stroke-width="1.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<text x="566.9" y="402.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb" text-anchor="middle" font-weight="normal">4×10<tspan dy="-6" font-size="10">9</tspan></text>
<line x1="703.4" y1="380.0" x2="703.4" y2="385.0" stroke="#adb9cb" stroke-width="1.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<text x="703.4" y="402.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb" text-anchor="middle" font-weight="normal">6×10<tspan dy="-6" font-size="10">9</tspan></text>
<path d="M100.0 67.4 L118.5 96.2 L137.0 123.5 L155.5 149.4 L174.0 173.8 L192.5 196.7 L211.0 218.1 L229.5 238.1 L248.0 256.6 L266.5 273.6 L285.0 289.1 L303.5 303.1 L322.0 315.7 L340.5 326.8 L359.0 336.4 L377.5 344.5 L396.0 351.2 L414.5 356.3 L433.0 360.0 L451.5 362.3 L470.0 363.0 L488.5 362.3 L507.0 360.1 L525.5 356.6 L544.0 351.6 L562.5 345.2 L581.0 337.3 L599.5 328.0 L618.0 317.3 L636.5 305.2 L655.0 291.6 L673.5 276.6 L692.0 260.2 L710.5 242.4 L729.0 223.1 L747.5 202.4 L766.0 180.3 L784.5 156.7 L803.0 131.7 L821.5 105.3 L840.0 77.5" fill="none" stroke="#f8fafc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<text x="130.0" y="70.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#66b3ff" text-anchor="start" font-weight="bold">Too small</text>
<text x="130.0" y="92.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="start" font-weight="normal">More tokens shown, but the model</text>
<text x="130.0" y="109.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="start" font-weight="normal">doesn't have enough capacity</text>
<text x="500.0" y="70.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#ff939b" text-anchor="start" font-weight="bold">Too big</text>
<text x="500.0" y="92.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="start" font-weight="normal">Fewer tokens shown, so the model can't</text>
<text x="500.0" y="109.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="start" font-weight="normal">fully use its expanded capacity</text>
<polygon points="470.0,352.0 472.9,359.0 480.5,359.6 474.7,364.5 476.5,371.9 470.0,367.9 463.5,371.9 465.3,364.5 459.5,359.6 467.1,359.0" fill="#5ad4b5" stroke="#f8fafc" stroke-width="1"/>
<line x1="470.0" y1="250.0" x2="470.0" y2="347.0" stroke="#5ad4b5" stroke-width="1.8" marker-end="url(#arrow-teal)" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<text x="460.0" y="214.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#5ad4b5" text-anchor="end" font-weight="bold">Just right</text>
<text x="460.0" y="232.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" font-weight="normal">enough tokens for the model</text>
<text x="460.0" y="247.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" font-weight="normal">to fully use its capacity</text>
<text x="100.0" y="448.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb" text-anchor="start" font-weight="normal">← ½× params, 2× tokens</text>
<text x="840.0" y="448.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb" text-anchor="end" font-weight="normal">2× params, ½× tokens →</text>
</svg>
