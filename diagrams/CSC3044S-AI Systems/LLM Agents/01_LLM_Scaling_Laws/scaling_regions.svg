<svg width="100%" viewBox="0 0 900 500" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Three regions of generalisation error versus training data size</title>
<desc>Error starts flat near best-guess error, falls linearly on log-log axes in the power-law region, then flattens at irreducible error.</desc>
<defs>
<marker id="arrow-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<line x1="110.0" y1="420.0" x2="860.0" y2="420.0" stroke="#f8fafc" stroke-width="1.6" marker-end="url(#arrow-white)" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<line x1="110.0" y1="420.0" x2="110.0" y2="60.0" stroke="#f8fafc" stroke-width="1.6" marker-end="url(#arrow-white)" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<text x="480.0" y="460.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="normal">Training data set size (log scale)</text>
<text x="80.0" y="250.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="normal" transform="rotate(-90 80.0 250.0)">Generalisation error (log scale)</text>
<line x1="300.0" y1="60.0" x2="300.0" y2="420.0" stroke="#adb9cb" stroke-width="1.2" stroke-dasharray="4 4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<line x1="690.0" y1="60.0" x2="690.0" y2="420.0" stroke="#adb9cb" stroke-width="1.2" stroke-dasharray="4 4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<text x="205.0" y="50.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb" text-anchor="middle" font-weight="bold">Small data region</text>
<text x="495.0" y="50.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#66b3ff" text-anchor="middle" font-weight="bold">Power-law region</text>
<text x="770.0" y="42.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb" text-anchor="middle" font-weight="bold">Irreducible error</text>
<text x="770.0" y="60.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb" text-anchor="middle" font-weight="bold">region</text>
<line x1="110.0" y1="120.0" x2="850.0" y2="120.0" stroke="#ffc778" stroke-width="1.4" stroke-dasharray="6 5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<text x="118.0" y="110.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#ffc778" text-anchor="start" font-weight="normal">Best guess error</text>
<line x1="110.0" y1="382.0" x2="850.0" y2="382.0" stroke="#ff939b" stroke-width="1.4" stroke-dasharray="6 5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<text x="846.0" y="402.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#ff939b" text-anchor="end" font-weight="normal">Irreducible error</text>
<rect x="306.0" y="128.0" width="378.0" height="246.0" rx="4" fill="none" stroke="#5ad4b5" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
<path d="M110 121 L250 124 C280 126 296 134 300 140 L650 350 C690 372 720 380 760 381 L850 381" fill="none" stroke="#66b3ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<text x="535.0" y="160.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#5ad4b5" text-anchor="middle" font-weight="bold">Scaling laws apply here</text>
<text x="535.0" y="178.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb" text-anchor="middle" font-weight="normal">(straight line on log-log axes)</text>
</svg>
