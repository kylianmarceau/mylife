<svg width="100%" viewBox="0 0 760 320" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Tool-calling loop</title>
<desc>Input goes to the LLM; the LLM may emit a tool call that goes to the tools, whose result returns to the LLM; when finished, the LLM produces the output.</desc>
<defs>
<marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
<rect x="40" y="60" width="140" height="44" rx="22" fill="#20344c" stroke="#66b3ff" stroke-width="2"/>
<text x="110" y="88" font-size="15" font-weight="600" fill="#f8fafc">INPUT</text>
<text x="110" y="128" font-size="12" fill="#adb9cb">tools + user prompt</text>
<rect x="300" y="46" width="160" height="72" rx="10" fill="#302b46" stroke="#b89aff" stroke-width="2.2"/>
<text x="380" y="90" font-size="24" font-weight="700" fill="#f8fafc">LLM</text>
<rect x="580" y="60" width="140" height="44" rx="22" fill="#1b3835" stroke="#5ad4b5" stroke-width="2"/>
<text x="650" y="88" font-size="15" font-weight="600" fill="#f8fafc">OUTPUT</text>
<text x="650" y="128" font-size="12" fill="#adb9cb">final response</text>
<line x1="180" y1="82" x2="292" y2="82" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke" marker-end="url(#ab)"/>
<line x1="460" y1="82" x2="572" y2="82" stroke="#5ad4b5" stroke-width="2" vector-effect="non-scaling-stroke" marker-end="url(#at)"/>
<rect x="330" y="236" width="100" height="40" rx="6" fill="#3d3326" stroke="#ffc778" stroke-width="2"/>
<text x="380" y="262" font-size="15" font-weight="600" fill="#f8fafc">TOOLS</text>
<path d="M440 118 C540 150 520 250 436 256" fill="none" stroke="#f8fafc" stroke-width="2" vector-effect="non-scaling-stroke" marker-end="url(#aw)"/>
<path d="M324 256 C240 250 220 150 320 124" fill="none" stroke="#ffc778" stroke-width="2" vector-effect="non-scaling-stroke" marker-end="url(#aa)"/>
<text x="525" y="186" font-size="13" fill="#f8fafc" text-anchor="start">&lt;tool_call&gt;</text>
<text x="525" y="204" font-size="12" fill="#adb9cb" text-anchor="start">harness parses,</text>
<text x="525" y="220" font-size="12" fill="#adb9cb" text-anchor="start">validates, executes</text>
<text x="235" y="186" font-size="13" fill="#ffc778" text-anchor="end">tool result</text>
<text x="235" y="204" font-size="12" fill="#adb9cb" text-anchor="end">appended as a</text>
<text x="235" y="220" font-size="12" fill="#adb9cb" text-anchor="end">tool message</text>
<text x="380" y="304" font-size="12" fill="#adb9cb">loop repeats until the model answers without a tool call</text>
</g>
</svg>
