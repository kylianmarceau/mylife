<svg width="100%" viewBox="0 0 960 440" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Weather tool call walkthrough</title>
<desc>Swimlanes for user, harness, model, and tool. Harness assembles the prompt, model generates a tool call, harness parses, validates, looks up and executes get_weather, appends the result, model generates again, and the user sees only the question and final answer.</desc>
<defs>
<marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
<g fill="none" stroke="#adb9cb" stroke-opacity="0.45" stroke-width="1.2">
<rect x="10" y="20" width="940" height="92" rx="10"/>
<rect x="10" y="124" width="940" height="100" rx="10"/>
<rect x="10" y="236" width="940" height="92" rx="10"/>
<rect x="10" y="340" width="940" height="88" rx="10"/>
</g>
<g font-size="13" font-weight="700" text-anchor="start">
<text x="24" y="70" fill="#adb9cb">USER</text>
<text x="24" y="178" fill="#ffc778">HARNESS</text>
<text x="24" y="286" fill="#66b3ff">MODEL</text>
<text x="24" y="390" fill="#5ad4b5">TOOL</text>
</g>
<rect x="110" y="40" width="340" height="52" rx="8" fill="#272f3b" stroke="#adb9cb" stroke-width="1.6"/>
<text x="280" y="71" font-size="13" fill="#f8fafc">What's the weather like in Cape Town tomorrow?</text>
<rect x="620" y="36" width="320" height="60" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8"/>
<text x="780" y="61" font-size="12.5" fill="#f8fafc">Tomorrow in Cape Town: partly cloudy,</text>
<text x="780" y="80" font-size="12.5" fill="#f8fafc">14–24 °C, 31 km/h wind, slight chance of rain.</text>
<g font-size="13">
<rect x="110" y="142" width="150" height="64" rx="8" fill="#3d3326" stroke="#ffc778" stroke-width="1.8"/>
<text x="185" y="168" fill="#f8fafc" font-weight="600">1 · Assemble prompt</text>
<text x="185" y="188" fill="#adb9cb" font-size="12">system + tools + user</text>
<rect x="280" y="254" width="150" height="58" rx="8" fill="#20344c" stroke="#66b3ff" stroke-width="1.8"/>
<text x="355" y="278" fill="#f8fafc" font-weight="600">2 · Generate</text>
<text x="355" y="298" fill="#adb9cb" font-size="12">&lt;tool_call&gt; get_weather</text>
<rect x="450" y="142" width="150" height="64" rx="8" fill="#3d3326" stroke="#ffc778" stroke-width="1.8"/>
<text x="525" y="168" fill="#f8fafc" font-weight="600">3 · Parse, validate,</text>
<text x="525" y="188" fill="#f8fafc" font-weight="600">look up, execute</text>
<rect x="620" y="142" width="150" height="64" rx="8" fill="#3d3326" stroke="#ffc778" stroke-width="1.8"/>
<text x="695" y="168" fill="#f8fafc" font-weight="600">4 · Append result</text>
<text x="695" y="188" fill="#adb9cb" font-size="12">as role tool, call again</text>
<rect x="790" y="254" width="150" height="58" rx="8" fill="#20344c" stroke="#66b3ff" stroke-width="1.8"/>
<text x="865" y="278" fill="#f8fafc" font-weight="600">5 · Generate again</text>
<text x="865" y="298" fill="#adb9cb" font-size="12">final answer</text>
<rect x="440" y="358" width="170" height="54" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8"/>
<text x="525" y="382" fill="#f8fafc" font-family="ui-monospace, Menlo, monospace" font-size="12">get_weather(city,</text>
<text x="525" y="400" fill="#f8fafc" font-family="ui-monospace, Menlo, monospace" font-size="12">date)</text>
</g>
<line x1="185" y1="92" x2="185" y2="136" stroke="#f8fafc" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#aw)"/>
<path d="M260 190 C300 200 330 220 345 248" fill="none" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#aa)"/>
<path d="M410 254 C430 230 445 215 458 210" fill="none" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#ab)"/>
<line x1="500" y1="206" x2="500" y2="352" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#aa)"/>
<line x1="550" y1="358" x2="550" y2="212" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#at)"/>
<text x="488" y="300" font-size="11" fill="#ffc778" text-anchor="end">execute</text>
<text x="560" y="300" font-size="11" fill="#5ad4b5" text-anchor="start">JSON result</text>
<line x1="600" y1="174" x2="614" y2="174" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#aa)"/>
<path d="M770 190 C800 200 820 220 840 248" fill="none" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#aa)"/>
<line x1="900" y1="254" x2="900" y2="102" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#at)"/>
</g>
</svg>
