<text x="482" y="325" fill="#f8fafc">.7</text><text x="518" y="325" fill="#f8fafc">-.3</text><text x="554" y="325" fill="#f8fafc">.2</text><text x="590" y="325" fill="#f8fafc">.5</text><text x="626" y="325" fill="#f8fafc">-.4</text><text x="662" y="325" fill="#f8fafc">.9</text>
