<svg width="100%" viewBox="0 0 900 400" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Text representation pathways</title>
<desc>An input document can be turned into a sparse bag-of-words count vector, a sparse TF-IDF vector, or a dense embedding vector from a pretrained model.</desc>
<defs>
