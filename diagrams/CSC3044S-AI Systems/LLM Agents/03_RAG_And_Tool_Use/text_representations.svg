<text x="572" y="122" font-size="13" fill="#66b3ff">Sparse count vector</text>
<text x="572" y="242" font-size="13" fill="#ffc778">Sparse TF-IDF vector</text>
<text x="572" y="362" font-size="13" fill="#5ad4b5">Dense embedding vector</text>
<g text-anchor="start" font-size="13">
<text x="706" y="76" fill="#f8fafc">Mostly zeros;</text>
<text x="706" y="94" fill="#adb9cb">which words occur</text>
<text x="706" y="196" fill="#f8fafc">Mostly zeros;</text>
<text x="706" y="214" fill="#adb9cb">rare words weighted up</text>
<text x="706" y="316" fill="#f8fafc">Every entry real-valued;</text>
