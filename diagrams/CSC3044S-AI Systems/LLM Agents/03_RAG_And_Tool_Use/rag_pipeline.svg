<line x1="160" y1="362" x2="227" y2="362" stroke="#f8fafc" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#aw)"/>
<line x1="345" y1="362" x2="412" y2="362" stroke="#f8fafc" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#aw)"/>
<line x1="530" y1="362" x2="592" y2="362" stroke="#f8fafc" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#aw)"/>
<line x1="655" y1="400" x2="655" y2="448" stroke="#ff939b" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#ac)"/>
<rect x="605" y="454" width="100" height="60" rx="12" fill="#302b46" stroke="#b89aff" stroke-width="2"/>
<text x="655" y="489" font-size="15" font-weight="600" fill="#f8fafc">LLM</text>
<text x="655" y="538" font-size="13" fill="#adb9cb">Generation</text>
