<line x1="705" y1="484" x2="752" y2="484" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#at)"/>
<path d="M105 370 V484 H597" fill="none" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#ab)"/>
