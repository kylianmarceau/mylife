<line x1="584" y1="138" x2="672" y2="138" stroke="#f8fafc" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#aw)"/>
<g font-size="13">
<text x="102" y="200" fill="#f8fafc">1. Parsing</text><text x="102" y="218" fill="#adb9cb">data loading</text>
<text x="310" y="200" fill="#f8fafc">2. Chunking</text><text x="310" y="218" fill="#adb9cb">data splitting</text>
<text x="520" y="200" fill="#f8fafc">3. Embedding</text><text x="520" y="218" fill="#adb9cb">data embedding</text>
<text x="735" y="200" fill="#f8fafc">4. Indexing</text><text x="735" y="218" fill="#adb9cb">data storing</text>
</g>
<rect x="20" y="262" width="860" height="296" rx="14" fill="none" stroke="#adb9cb" stroke-width="1.4" stroke-dasharray="4 5"/>
<text x="450" y="290" font-size="17" font-weight="600" fill="#f8fafc">Data retrieval &amp; generation</text>
<text x="450" y="310" font-size="13" fill="#adb9cb">online, for every query</text>
<text x="105" y="344" font-size="13" fill="#66b3ff">User query</text>
<rect x="50" y="354" width="110" height="16" rx="4" fill="#20344c" stroke="#66b3ff" stroke-width="1.8"/>
<text x="290" y="344" font-size="13" fill="#5ad4b5">Query embedding</text>
<rect x="235" y="354" width="110" height="16" rx="4" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8"/>
