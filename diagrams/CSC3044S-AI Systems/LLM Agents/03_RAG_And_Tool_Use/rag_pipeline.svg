<rect x="460" y="142" width="120" height="13" rx="3" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.6"/>
<rect x="460" y="161" width="120" height="13" rx="3" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.6"/>
<rect x="680" y="100" width="110" height="70" rx="12" fill="#3d3326" stroke="#ffc778" stroke-width="2"/>
