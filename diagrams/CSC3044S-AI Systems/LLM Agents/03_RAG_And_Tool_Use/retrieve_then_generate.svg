<svg width="100%" viewBox="0 0 940 350" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Retrieve then generate</title>
<desc>The user prompt goes to the retriever, which searches indexed documents built from a corpus; relevant documents and the original prompt enter prompt formulation inside the generator; the LLM answers with a citation.</desc>
<defs>
<marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
<text x="92" y="128" font-size="15" font-weight="600" fill="#f8fafc">User prompt</text>
<text x="92" y="152" font-size="14" fill="#66b3ff">When was the</text>
<text x="92" y="171" font-size="14" fill="#66b3ff">premiere of</text>
<text x="92" y="190" font-size="14" fill="#66b3ff" font-style="italic">The Magic Flute?</text>
<line x1="168" y1="166" x2="214" y2="166" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke" marker-end="url(#ab)"/>
<rect x="220" y="90" width="180" height="170" rx="12" fill="#20344c" stroke="#66b3ff" stroke-width="2"/>
<text x="310" y="116" font-size="16" font-weight="600" fill="#f8fafc">Retriever</text>
<rect x="238" y="130" width="144" height="112" rx="8" fill="#272f3b" stroke="#adb9cb" stroke-width="1.4"/>
<rect x="252" y="142" width="34" height="26" rx="2" fill="none" stroke="#adb9cb" stroke-width="1.2"/>
<rect x="294" y="142" width="34" height="26" rx="2" fill="none" stroke="#adb9cb" stroke-width="1.2"/>
<rect x="336" y="142" width="34" height="26" rx="2" fill="none" stroke="#adb9cb" stroke-width="1.2"/>
<rect x="252" y="176" width="34" height="26" rx="2" fill="none" stroke="#adb9cb" stroke-width="1.2"/>
<rect x="294" y="176" width="34" height="26" rx="2" fill="none" stroke="#adb9cb" stroke-width="1.2"/>
<rect x="336" y="176" width="34" height="26" rx="2" fill="none" stroke="#adb9cb" stroke-width="1.2"/>
<text x="310" y="228" font-size="13" fill="#f8fafc">Indexed docs</text>
<line x1="310" y1="306" x2="310" y2="266" stroke="#f8fafc" stroke-width="2" vector-effect="non-scaling-stroke" marker-end="url(#aw)"/>
<text x="310" y="324" font-size="14" font-weight="600" fill="#f8fafc">Corpus of documents</text>
<rect x="452" y="150" width="34" height="42" rx="3" fill="#3d3326" stroke="#ffc778" stroke-width="1.4"/>
<rect x="444" y="156" width="34" height="42" rx="3" fill="#3d3326" stroke="#ffc778" stroke-width="1.4"/>
<rect x="436" y="162" width="34" height="42" rx="3" fill="#3d3326" stroke="#ffc778" stroke-width="1.4"/>
<line x1="400" y1="218" x2="554" y2="218" stroke="#ffc778" stroke-width="2" vector-effect="non-scaling-stroke" marker-end="url(#aa)"/>
<text x="470" y="242" font-size="13" fill="#ffc778">Relevant docs</text>
<rect x="560" y="90" width="210" height="226" rx="12" fill="#302b46" stroke="#b89aff" stroke-width="2"/>
<text x="665" y="116" font-size="16" font-weight="600" fill="#f8fafc">Generator</text>
<rect x="574" y="152" width="96" height="88" rx="12" fill="#3f2a33" stroke="#ff939b" stroke-width="1.8"/>
<text x="622" y="192" font-size="13" fill="#f8fafc">Prompt</text>
<text x="622" y="210" font-size="13" fill="#f8fafc">formulation</text>
<rect x="692" y="176" width="64" height="40" rx="10" fill="#20344c" stroke="#66b3ff" stroke-width="1.8"/>
<text x="724" y="201" font-size="14" font-weight="600" fill="#f8fafc">LLM</text>
<line x1="670" y1="196" x2="686" y2="196" stroke="#f8fafc" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#aw)"/>
<rect x="606" y="260" width="120" height="40" rx="8" fill="#272f3b" stroke="#adb9cb" stroke-width="1.4"/>
<text x="666" y="277" font-size="12" fill="#f8fafc">Knowledge</text>
<text x="666" y="292" font-size="12" fill="#f8fafc">citation</text>
<line x1="756" y1="196" x2="796" y2="196" stroke="#5ad4b5" stroke-width="2" vector-effect="non-scaling-stroke" marker-end="url(#at)"/>
<text x="862" y="192" font-size="14" fill="#5ad4b5">1791, according</text>
<text x="862" y="211" font-size="14" fill="#5ad4b5" text-decoration="underline">to this page</text>
<path d="M190 166 V60 H615 V146" fill="none" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke" marker-end="url(#ab)"/>
</g>
