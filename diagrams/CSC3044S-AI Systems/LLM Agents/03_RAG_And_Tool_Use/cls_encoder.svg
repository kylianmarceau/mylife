</g>
<text x="429" y="256" font-size="13" fill="#ffc778">output embeddings = contextual word vectors</text>
<path d="M77 234 V286 H118" fill="none" stroke="#5ad4b5" stroke-width="2" vector-effect="non-scaling-stroke" marker-end="url(#at)"/>
