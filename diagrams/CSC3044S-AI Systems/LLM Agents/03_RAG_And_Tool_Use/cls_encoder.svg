<svg width="100%" viewBox="0 0 780 310" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Encoder-only model with a CLS token</title>
<desc>Input tokens [CLS] The cat sat on the mat [SEP] pass through Transformer layers; each token gets an output embedding, and the [CLS] output vector represents the whole sequence.</desc>
