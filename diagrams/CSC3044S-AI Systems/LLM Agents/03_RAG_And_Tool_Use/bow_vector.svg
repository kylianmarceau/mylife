<svg width="100%" viewBox="0 0 700 290" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Bag-of-words text vector</title>
<desc>The sentence "I like oranges, do you like oranges?" becomes a count vector over the vocabulary apples, do, I, like, oranges, you: 0, 1, 1, 2, 2, 1.</desc>
<defs>
<marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="150" font-size="16" fill="#f8fafc">"I like oranges, do you like oranges?"</text>
<line x1="330" y1="145" x2="420" y2="145" stroke="#f8fafc" stroke-width="2" vector-effect="non-scaling-stroke" marker-end="url(#aw)"/>
<text x="360" y="186" font-size="16" font-weight="600" fill="#ff939b" text-anchor="middle">BoW text vector</text>
<g text-anchor="middle" font-size="16" font-family="ui-monospace, Menlo, monospace">
<rect x="440" y="38" width="54" height="216" fill="#3f2a33" stroke="#ff939b" stroke-width="1.8"/>
<line x1="440" y1="74" x2="494" y2="74" stroke="#ff939b" stroke-width="1.2"/>
<line x1="440" y1="110" x2="494" y2="110" stroke="#ff939b" stroke-width="1.2"/>
<line x1="440" y1="146" x2="494" y2="146" stroke="#ff939b" stroke-width="1.2"/>
<line x1="440" y1="182" x2="494" y2="182" stroke="#ff939b" stroke-width="1.2"/>
<line x1="440" y1="218" x2="494" y2="218" stroke="#ff939b" stroke-width="1.2"/>
<text x="467" y="62" fill="#6b7686">0</text>
<text x="467" y="98" fill="#f8fafc">1</text>
<text x="467" y="134" fill="#f8fafc">1</text>
<text x="467" y="170" fill="#f8fafc">2</text>
<text x="467" y="206" fill="#f8fafc">2</text>
<text x="467" y="242" fill="#f8fafc">1</text>
</g>
<g font-size="15" fill="#adb9cb">
<text x="512" y="62">apples</text>
<text x="512" y="98">do</text>
<text x="512" y="134">I</text>
<text x="512" y="170">like</text>
<text x="512" y="206">oranges</text>
<text x="512" y="242">you</text>
</g>
<text x="512" y="24" font-size="12" fill="#adb9cb">vocabulary word</text>
<text x="467" y="24" font-size="12" fill="#adb9cb" text-anchor="middle">count</text>
</g>
</svg>
