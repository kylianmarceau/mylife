<svg width="100%" viewBox="0 0 620 400" role="img" xmlns="http://www.w3.org/2000/svg">
<title>o1 AIME accuracy at test time</title>
<desc>Scatter plot: pass@1 accuracy on AIME rises roughly linearly from about 20 to about 75 percent as test-time compute increases on a log scale.</desc>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="330" y="28" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">o1 AIME accuracy at test time</text>
    <line x1="90" y1="330" x2="580" y2="330" stroke="#f8fafc" stroke-width="1.6" marker-end="url(#ax)" vector-effect="non-scaling-stroke"/>
    <line x1="90" y1="330" x2="90" y2="40" stroke="#f8fafc" stroke-width="1.6" marker-end="url(#ax)" vector-effect="non-scaling-stroke"/>
    <g font-size="12" fill="#adb9cb" text-anchor="end">
      <text x="80" y="334">0</text>
      <text x="80" y="278">20</text>
      <text x="80" y="222">40</text>
      <text x="80" y="166">60</text>
      <text x="80" y="110">80</text>
      <text x="80" y="54">100</text>
    </g>
    <g stroke="#adb9cb" stroke-width="1.2">
      <line x1="86" y1="274" x2="90" y2="274"/>
      <line x1="86" y1="218" x2="90" y2="218"/>
      <line x1="86" y1="162" x2="90" y2="162"/>
      <line x1="86" y1="106" x2="90" y2="106"/>
      <line x1="86" y1="50" x2="90" y2="50"/>
    </g>
    <g fill="#66b3ff" stroke="#f8fafc" stroke-width="1">
      <circle cx="120" cy="271" r="6"/>
      <circle cx="175" cy="260" r="6"/>
      <circle cx="265" cy="226" r="6"/>
      <circle cx="335" cy="198" r="6"/>
      <circle cx="405" cy="168" r="6"/>
      <circle cx="500" cy="128" r="6"/>
      <circle cx="522" cy="120" r="6"/>
    </g>
    <text x="335" y="368" font-size="14" fill="#f8fafc" text-anchor="middle">test-time compute (log scale)</text>
    <text x="34" y="190" font-size="14" fill="#f8fafc" text-anchor="middle" transform="rotate(-90 34 190)">pass@1 accuracy (%)</text>
  </g>
</svg>
