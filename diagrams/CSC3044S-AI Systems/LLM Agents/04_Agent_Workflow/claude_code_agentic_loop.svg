<svg width="100%" viewBox="0 0 900 290" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Claude Code agentic loop</title>
<desc>Your prompt enters an agentic loop of gather context, take action and verify results, which repeats until Done. The user can interrupt, steer or add context into the loop.</desc>
  <defs>
    <marker id="kw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="kt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ka" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" font-size="14" fill="#f8fafc">
    <rect x="200" y="20" width="550" height="170" rx="10" fill="none" stroke="#adb9cb" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text x="475" y="44" font-size="13" fill="#adb9cb">agentic loop</text>
    <rect x="20" y="78" width="130" height="50" rx="8" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8"/>
    <text x="85" y="108">Your prompt</text>
    <rect x="225" y="78" width="140" height="50" rx="8" fill="#20344c" stroke="#66b3ff" stroke-width="2"/>
    <text x="295" y="108" font-weight="700">Gather context</text>
    <rect x="405" y="78" width="140" height="50" rx="8" fill="#302b46" stroke="#b89aff" stroke-width="2"/>
    <text x="475" y="108" font-weight="700">Take action</text>
    <rect x="585" y="78" width="140" height="50" rx="8" fill="#3d3326" stroke="#ffc778" stroke-width="2"/>
    <text x="655" y="108" font-weight="700">Verify results</text>
    <rect x="790" y="78" width="90" height="50" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="2"/>
    <text x="835" y="108" font-weight="700" fill="#5ad4b5">Done</text>
    <line x1="150" y1="103" x2="219" y2="103" stroke="#f8fafc" stroke-width="2" marker-end="url(#kw)" vector-effect="non-scaling-stroke"/>
    <line x1="365" y1="103" x2="399" y2="103" stroke="#f8fafc" stroke-width="2" marker-end="url(#kw)" vector-effect="non-scaling-stroke"/>
    <line x1="545" y1="103" x2="579" y2="103" stroke="#f8fafc" stroke-width="2" marker-end="url(#kw)" vector-effect="non-scaling-stroke"/>
    <line x1="725" y1="103" x2="784" y2="103" stroke="#f8fafc" stroke-width="2" marker-end="url(#kw)" vector-effect="non-scaling-stroke"/>
    <path d="M655 128 L655 160 Q655 166 649 166 L301 166 Q295 166 295 160 L295 134" fill="none" stroke="#5ad4b5" stroke-width="2.2" marker-end="url(#kt)" vector-effect="non-scaling-stroke"/>
    <text x="475" y="158" font-size="13" fill="#5ad4b5">repeat</text>
    <rect x="215" y="222" width="250" height="50" rx="8" fill="#3d3326" stroke="#ffc778" stroke-width="1.8"/>
    <text x="340" y="244" font-size="13">You: interrupt, steer,</text>
    <text x="340" y="262" font-size="13">or add context</text>
    <path d="M465 247 L560 247 L560 174" fill="none" stroke="#ffc778" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ka)" vector-effect="non-scaling-stroke"/>
  </g>
</svg>
