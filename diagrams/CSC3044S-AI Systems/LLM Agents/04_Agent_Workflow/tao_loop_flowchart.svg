<svg width="100%" viewBox="0 0 640 430" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Thought-Action-Observation loop with tool and answer</title>
<desc>A query enters a Thought decision. Thought either issues an Action to a Tool, whose Observation returns to Thought, or exits to the Answer.</desc>
  <defs>
    <marker id="fw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="fb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
    <rect x="270" y="20" width="100" height="44" rx="6" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8"/>
    <text x="320" y="48" font-size="16" font-weight="700" fill="#f8fafc">Query</text>
    <line x1="320" y1="64" x2="320" y2="112" stroke="#f8fafc" stroke-width="2" marker-end="url(#fw)" vector-effect="non-scaling-stroke"/>
    <polygon points="320,118 420,190 320,262 220,190" fill="#302b46" stroke="#b89aff" stroke-width="2.2"/>
    <text x="320" y="196" font-size="17" font-weight="700" fill="#f8fafc">Thought</text>
    <rect x="160" y="350" width="110" height="48" rx="10" fill="#3d3326" stroke="#ffc778" stroke-width="2"/>
    <text x="215" y="380" font-size="16" font-weight="700" fill="#f8fafc">Tool</text>
    <path d="M252 214 C 190 250, 160 300, 186 344" fill="none" stroke="#66b3ff" stroke-width="2.2" marker-end="url(#fb)" vector-effect="non-scaling-stroke"/>
    <text x="130" y="276" font-size="14" font-weight="700" fill="#66b3ff">Action</text>
    <path d="M240 348 C 262 310, 290 280, 304 256" fill="none" stroke="#ffc778" stroke-width="2.2" marker-end="url(#fa)" vector-effect="non-scaling-stroke"/>
    <text x="320" y="318" font-size="14" font-weight="700" fill="#ffc778" text-anchor="start">Observation</text>
    <rect x="470" y="300" width="110" height="48" rx="6" fill="#1b3835" stroke="#5ad4b5" stroke-width="2"/>
    <text x="525" y="330" font-size="16" font-weight="700" fill="#f8fafc">Answer</text>
    <path d="M385 216 L512 294" fill="none" stroke="#5ad4b5" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ft)" vector-effect="non-scaling-stroke"/>
    <text x="470" y="238" font-size="12" fill="#adb9cb" text-anchor="start">objective fulfilled</text>
  </g>
</svg>
