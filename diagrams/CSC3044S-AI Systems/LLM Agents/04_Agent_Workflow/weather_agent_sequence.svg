<svg width="100%" viewBox="0 0 900 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Weather agent: harness-managed Thought-Action-Observation sequence</title>
<desc>Sequence between user, harness, LLM and weather API: the LLM thinks and emits a JSON tool call, the harness calls the API, appends the observation, re-prompts the LLM, and returns the final answer to the user.</desc>
  <defs>
    <marker id="sw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="sv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="sb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="sa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="st" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" font-size="12.5" fill="#f8fafc">
    <rect x="50" y="16" width="120" height="40" rx="8" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8"/>
    <text x="110" y="41" font-size="15" font-weight="700">User</text>
    <rect x="270" y="16" width="140" height="40" rx="8" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8"/>
    <text x="340" y="41" font-size="15" font-weight="700">Harness</text>
    <rect x="510" y="16" width="120" height="40" rx="8" fill="#302b46" stroke="#b89aff" stroke-width="1.8"/>
    <text x="570" y="41" font-size="15" font-weight="700">LLM</text>
    <rect x="720" y="16" width="140" height="40" rx="8" fill="#3d3326" stroke="#ffc778" stroke-width="1.8"/>
    <text x="790" y="41" font-size="15" font-weight="700">Weather API</text>
    <g stroke="#adb9cb" stroke-width="1.2" stroke-dasharray="4 5">
      <line x1="110" y1="56" x2="110" y2="545"/>
      <line x1="340" y1="56" x2="340" y2="545"/>
      <line x1="570" y1="56" x2="570" y2="545"/>
      <line x1="790" y1="56" x2="790" y2="545"/>
    </g>
    <line x1="110" y1="95" x2="334" y2="95" stroke="#f8fafc" stroke-width="1.8" marker-end="url(#sw)"/>
    <text x="225" y="86">"What's the current weather in New York?"</text>
    <line x1="340" y1="145" x2="564" y2="145" stroke="#f8fafc" stroke-width="1.8" marker-end="url(#sw)"/>
    <text x="455" y="118">system prompt (tools, TAO</text>
    <text x="455" y="134">instructions) + user query</text>
    <rect x="590" y="160" width="290" height="44" rx="6" fill="#302b46" stroke="#b89aff" stroke-width="1.4"/>
    <text x="735" y="178" font-weight="700" fill="#b89aff">Thought</text>
    <text x="735" y="196" font-size="11.5">"I need to call the weather API first"</text>
    <line x1="570" y1="240" x2="346" y2="240" stroke="#66b3ff" stroke-width="1.8" marker-end="url(#sb)"/>
    <text x="455" y="222" fill="#66b3ff" font-weight="700">Action: JSON tool call</text>
    <text x="455" y="258" font-size="11" fill="#adb9cb">LLM stops generating</text>
    <line x1="340" y1="290" x2="784" y2="290" stroke="#66b3ff" stroke-width="1.8" marker-end="url(#sb)"/>
    <text x="680" y="281" fill="#66b3ff">get_weather(location = "New York")</text>
    <text x="230" y="285" font-size="11" fill="#adb9cb">parses call,</text>
    <text x="230" y="299" font-size="11" fill="#adb9cb">runs tool</text>
    <line x1="790" y1="340" x2="346" y2="340" stroke="#ffc778" stroke-width="1.8" marker-end="url(#sa)"/>
    <text x="620" y="331" fill="#ffc778" font-weight="700">Observation: partly cloudy, 15°C, 60% humidity</text>
    <line x1="340" y1="395" x2="564" y2="395" stroke="#ffc778" stroke-width="1.8" marker-end="url(#sa)"/>
    <text x="455" y="367">prompt + observation appended;</text>
    <text x="455" y="384">LLM prompted to generate again</text>
    <rect x="590" y="410" width="290" height="44" rx="6" fill="#302b46" stroke="#b89aff" stroke-width="1.4"/>
    <text x="735" y="428" font-weight="700" fill="#b89aff">Thought</text>
    <text x="735" y="446" font-size="11.5">"I have the weather data now"</text>
    <line x1="570" y1="480" x2="346" y2="480" stroke="#5ad4b5" stroke-width="1.8" marker-end="url(#st)"/>
    <text x="455" y="471" fill="#5ad4b5" font-weight="700">Final answer: ...</text>
    <line x1="340" y1="525" x2="116" y2="525" stroke="#5ad4b5" stroke-width="1.8" marker-end="url(#st)"/>
    <text x="225" y="516" fill="#5ad4b5">harness extracts final answer</text>
  </g>
</svg>
