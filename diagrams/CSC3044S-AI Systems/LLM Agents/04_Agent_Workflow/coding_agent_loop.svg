<svg width="100%" viewBox="0 0 900 290" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Coding agent loop</title>
<desc>Observe repo, plan, search or read files, edit or write patches, run tests. Passing tests lead to Done; otherwise inspect errors and repeat from search/read files, or from planning.</desc>
  <defs>
    <marker id="cw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="cc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ct" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" font-size="14" fill="#f8fafc">
    <rect x="612" y="12" width="120" height="50" rx="10" fill="#1b3835" stroke="#5ad4b5" stroke-width="2"/>
    <text x="672" y="42" font-weight="700" fill="#5ad4b5">Done</text>
    <rect x="20" y="100" width="120" height="60" rx="10" fill="#3d3326" stroke="#ffc778" stroke-width="2"/>
    <text x="80" y="126">Observe</text>
    <text x="80" y="144">repo</text>
    <rect x="168" y="100" width="120" height="60" rx="10" fill="#302b46" stroke="#b89aff" stroke-width="2"/>
    <text x="228" y="135">Plan</text>
    <rect x="316" y="100" width="120" height="60" rx="10" fill="#20344c" stroke="#66b3ff" stroke-width="2"/>
    <text x="376" y="126">Search/read</text>
    <text x="376" y="144">files</text>
    <rect x="464" y="100" width="120" height="60" rx="10" fill="#20344c" stroke="#66b3ff" stroke-width="2"/>
    <text x="524" y="126">Edit/write</text>
    <text x="524" y="144">patches</text>
    <rect x="612" y="100" width="120" height="60" rx="10" fill="#20344c" stroke="#66b3ff" stroke-width="2"/>
    <text x="672" y="126">Run</text>
    <text x="672" y="144">tests</text>
    <rect x="760" y="100" width="120" height="60" rx="10" fill="#3f2a33" stroke="#ff939b" stroke-width="2"/>
    <text x="820" y="126">Inspect</text>
    <text x="820" y="144">errors</text>
    <line x1="140" y1="130" x2="162" y2="130" stroke="#f8fafc" stroke-width="2" marker-end="url(#cw)" vector-effect="non-scaling-stroke"/>
    <line x1="288" y1="130" x2="310" y2="130" stroke="#f8fafc" stroke-width="2" marker-end="url(#cw)" vector-effect="non-scaling-stroke"/>
    <line x1="436" y1="130" x2="458" y2="130" stroke="#f8fafc" stroke-width="2" marker-end="url(#cw)" vector-effect="non-scaling-stroke"/>
    <line x1="584" y1="130" x2="606" y2="130" stroke="#f8fafc" stroke-width="2" marker-end="url(#cw)" vector-effect="non-scaling-stroke"/>
    <line x1="732" y1="130" x2="754" y2="130" stroke="#f8fafc" stroke-width="2" marker-end="url(#cw)" vector-effect="non-scaling-stroke"/>
    <line x1="672" y1="100" x2="672" y2="68" stroke="#5ad4b5" stroke-width="2" marker-end="url(#ct)" vector-effect="non-scaling-stroke"/>
    <text x="696" y="88" font-size="11" fill="#5ad4b5" text-anchor="start">pass</text>
    <path d="M820 160 L820 205 L376 205 L376 166" fill="none" stroke="#ff939b" stroke-width="2" marker-end="url(#cc)" vector-effect="non-scaling-stroke"/>
    <path d="M376 205 L228 205 L228 166" fill="none" stroke="#ff939b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#cc)" vector-effect="non-scaling-stroke"/>
    <text x="600" y="228" font-size="14" font-weight="700" fill="#ff939b">Repeat</text>
    <g font-size="12" text-anchor="start">
      <rect x="160" y="252" width="14" height="14" rx="3" fill="#302b46" stroke="#b89aff" stroke-width="1.5"/>
      <text x="182" y="264" fill="#adb9cb">Thought</text>
      <rect x="270" y="252" width="14" height="14" rx="3" fill="#20344c" stroke="#66b3ff" stroke-width="1.5"/>
      <text x="292" y="264" fill="#adb9cb">Action</text>
      <rect x="370" y="252" width="14" height="14" rx="3" fill="#3d3326" stroke="#ffc778" stroke-width="1.5"/>
      <text x="392" y="264" fill="#adb9cb">Observation</text>
      <rect x="500" y="252" width="14" height="14" rx="3" fill="#3f2a33" stroke="#ff939b" stroke-width="1.5"/>
      <text x="522" y="264" fill="#adb9cb">Observation of failure (errors)</text>
    </g>
  </g>
</svg>
