<svg width="100%" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
<title>LLM agent components</title>
<desc>An AI agent is built from an LLM, memory and tools; all three feed into the agent.</desc>
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
    <rect x="270" y="24" width="140" height="64" rx="12" fill="#302b46" stroke="#b89aff" stroke-width="2"/>
    <text x="340" y="52" font-size="18" font-weight="700" fill="#f8fafc">LLM</text>
    <text x="340" y="73" font-size="12" fill="#adb9cb">reasoning engine</text>
    <rect x="40" y="112" width="150" height="64" rx="12" fill="#20344c" stroke="#66b3ff" stroke-width="2"/>
    <text x="115" y="140" font-size="18" font-weight="700" fill="#f8fafc">Memory</text>
    <text x="115" y="161" font-size="12" fill="#adb9cb">context, state</text>
    <rect x="490" y="112" width="150" height="64" rx="12" fill="#3d3326" stroke="#ffc778" stroke-width="2"/>
    <text x="565" y="140" font-size="18" font-weight="700" fill="#f8fafc">Tools</text>
    <text x="565" y="161" font-size="12" fill="#adb9cb">APIs, search, code</text>
    <rect x="255" y="262" width="170" height="70" rx="12" fill="#1b3835" stroke="#5ad4b5" stroke-width="2.2"/>
    <text x="340" y="292" font-size="19" font-weight="700" fill="#f8fafc">AI Agent</text>
    <text x="340" y="314" font-size="12" fill="#adb9cb">acts in environment</text>
    <path d="M340 88 L340 254" fill="none" stroke="#f8fafc" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#aw)" vector-effect="non-scaling-stroke"/>
    <path d="M190 144 C 270 150, 315 190, 328 254" fill="none" stroke="#f8fafc" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#aw)" vector-effect="non-scaling-stroke"/>
    <path d="M490 144 C 410 150, 365 190, 352 254" fill="none" stroke="#f8fafc" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#aw)" vector-effect="non-scaling-stroke"/>
  </g>
</svg>
