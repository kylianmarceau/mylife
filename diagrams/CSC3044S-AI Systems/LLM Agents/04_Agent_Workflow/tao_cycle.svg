<svg width="100%" viewBox="0 0 820 250" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Thought-Action-Observation cycle</title>
<desc>Thought leads to Action, Action to Observation, and Observation either loops back to Thought or leads to the final Answer.</desc>
  <defs>
    <marker id="tw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
    <ellipse cx="110" cy="80" rx="80" ry="40" fill="#302b46" stroke="#b89aff" stroke-width="2.2"/>
    <text x="110" y="86" font-size="18" font-weight="700" fill="#f8fafc">Thought</text>
    <ellipse cx="320" cy="80" rx="80" ry="40" fill="#20344c" stroke="#66b3ff" stroke-width="2.2"/>
    <text x="320" y="86" font-size="18" font-weight="700" fill="#f8fafc">Action</text>
    <ellipse cx="530" cy="80" rx="90" ry="40" fill="#3d3326" stroke="#ffc778" stroke-width="2.2"/>
    <text x="530" y="86" font-size="18" font-weight="700" fill="#f8fafc">Observation</text>
    <ellipse cx="730" cy="80" rx="70" ry="40" fill="#1b3835" stroke="#5ad4b5" stroke-width="2.2"/>
    <text x="730" y="86" font-size="18" font-weight="700" fill="#f8fafc">Answer</text>
    <line x1="192" y1="80" x2="234" y2="80" stroke="#f8fafc" stroke-width="2" marker-end="url(#tw)" vector-effect="non-scaling-stroke"/>
    <line x1="402" y1="80" x2="434" y2="80" stroke="#f8fafc" stroke-width="2" marker-end="url(#tw)" vector-effect="non-scaling-stroke"/>
    <line x1="622" y1="80" x2="654" y2="80" stroke="#f8fafc" stroke-width="2" marker-end="url(#tw)" vector-effect="non-scaling-stroke"/>
    <path d="M520 122 C 470 230, 190 230, 118 126" fill="none" stroke="#ffc778" stroke-width="2" marker-end="url(#ta)" vector-effect="non-scaling-stroke"/>
    <text x="320" y="230" font-size="13" fill="#ffc778">observation fed back into the next thought</text>
  </g>
</svg>
