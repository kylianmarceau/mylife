<text x="655.0" y="166.10000000000002" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle">unit tests,</text>
<text x="655.0" y="183.00000000000003" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle">proof checkers,</text>
<text x="655.0" y="199.90000000000003" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle">majority voting</text>
<line x1="730" y1="170" x2="756" y2="170" stroke="#f8fafc" stroke-width="1.8" marker-end="url(#m-white)" vector-effect="non-scaling-stroke"/>
<rect x="758" y="152" width="134" height="36" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="825.0" y="174.025" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#f8fafc" text-anchor="middle">x = int(input())</text>
<text x="270" y="278.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#66b3ff" text-anchor="middle">Problem 1 (coverage): can we</text>
<text x="270" y="295.55" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#66b3ff" text-anchor="middle">generate a correct solution?</text>
<text x="670" y="278.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#b89aff" text-anchor="middle">Problem 2 (precision): can we identify</text>
<text x="670" y="295.55" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#b89aff" text-anchor="middle">a correct solution among the samples?</text>
