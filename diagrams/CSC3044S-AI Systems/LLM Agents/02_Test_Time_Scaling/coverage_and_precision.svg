<svg width="100%" viewBox="0 0 900 320" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Repeated sampling with a verifier</title>
<desc>Coverage asks whether any sample is correct; precision asks whether the verifier can pick the correct sample out.</desc>
