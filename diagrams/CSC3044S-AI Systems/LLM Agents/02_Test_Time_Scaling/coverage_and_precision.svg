<text x="455.0" y="228.375" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#f8fafc" text-anchor="middle">import requests …</text>
<line x1="540" y1="224" x2="576" y2="224" stroke="#f8fafc" stroke-width="1.8" marker-end="url(#m-white)" vector-effect="non-scaling-stroke"/>
