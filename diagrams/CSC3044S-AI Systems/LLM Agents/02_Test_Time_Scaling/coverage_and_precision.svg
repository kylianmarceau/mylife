<text x="270" y="34" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="600">Step 1: generate many candidate solutions</text>
<text x="700" y="34" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="600">Step 2: verifier picks a final answer</text>
<rect x="20" y="140" width="130" height="60" rx="8" fill="#3d3326" stroke="#ffc778" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="85.0" y="166.39999999999998" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#f8fafc" text-anchor="middle">Problem: read a</text>
<text x="85.0" y="181.99999999999997" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#f8fafc" text-anchor="middle">number from stdin …</text>
<line x1="150" y1="170" x2="186" y2="170" stroke="#f8fafc" stroke-width="1.8" marker-end="url(#m-white)" vector-effect="non-scaling-stroke"/>
