<svg width="100%" viewBox="0 0 900 470" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Self-consistency with majority voting</title>
<desc>A single greedy chain of thought gives $14; sampling several paths and majority voting over their answers gives $18.</desc>
<defs><marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="30" y="30" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb" text-anchor="start" font-weight="600">Chain-of-thought prompting (single greedy decode)</text>
<rect x="30" y="52" width="100" height="44" rx="8" fill="#272f3b" stroke="#adb9cb" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="80.0" y="78.9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle">Prompt</text>
<line x1="130" y1="74" x2="166" y2="74" stroke="#f8fafc" stroke-width="1.8" marker-end="url(#m-white)" vector-effect="non-scaling-stroke"/>
<rect x="170" y="52" width="110" height="44" rx="8" fill="#272f3b" stroke="#adb9cb" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="225.0" y="70.1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle">Language</text>
<text x="225.0" y="87.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle">model</text>
<line x1="280" y1="74" x2="316" y2="74" stroke="#f8fafc" stroke-width="1.8" marker-end="url(#m-white)" vector-effect="non-scaling-stroke"/>
<rect x="320" y="46" width="300" height="56" rx="8" fill="#3f2a33" stroke="#ff939b" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="470.0" y="70.1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle">Uses 3 + 4 = 7 eggs a day; sells</text>
<text x="470.0" y="87.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle">the "remainder": 7 × $2 = $14.</text>
<line x1="620" y1="74" x2="656" y2="74" stroke="#ff939b" stroke-width="1.8" marker-end="url(#m-coral)" vector-effect="non-scaling-stroke"/>
<rect x="660" y="54" width="130" height="40" rx="8" fill="#3f2a33" stroke="#ff939b" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="725.0" y="78.9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="600">Answer: $14</text>
<line x1="20" y1="126" x2="880" y2="126" stroke="#adb9cb" stroke-width="1.2" stroke-dasharray="6 6" vector-effect="non-scaling-stroke"/>
<text x="30" y="152" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb" text-anchor="start" font-weight="600">Self-consistency (same prompt N times, temperature &gt; 0)</text>
<rect x="30" y="276" width="100" height="50" rx="8" fill="#272f3b" stroke="#adb9cb" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="80.0" y="297.1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle">Prompt</text>
<text x="80.0" y="314.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle">× N</text>
<line x1="130" y1="301" x2="166" y2="301" stroke="#f8fafc" stroke-width="1.8" marker-end="url(#m-white)" vector-effect="non-scaling-stroke"/>
<rect x="170" y="279" width="110" height="44" rx="8" fill="#272f3b" stroke="#adb9cb" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="225.0" y="297.1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle">Language</text>
<text x="225.0" y="314.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle">model</text>
<rect x="312" y="166" width="316" height="264" rx="10" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>
<text x="470" y="450" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12.5" fill="#66b3ff" text-anchor="middle">sample a diverse set of reasoning paths</text>
<path d="M280,301 C300,301 300,204 316,204" fill="none" stroke="#f8fafc" stroke-width="1.6" marker-end="url(#m-white)" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<rect x="320" y="176" width="300" height="56" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="470.0" y="200.10000000000002" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle">16 − 3 − 4 = 9 eggs left, so she</text>
<text x="470.0" y="217.00000000000003" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle">makes $2 × 9 = $18 per day.</text>
<line x1="620" y1="204" x2="646" y2="204" stroke="#5ad4b5" stroke-width="1.8" marker-end="url(#m-teal)" vector-effect="non-scaling-stroke"/>
<rect x="650" y="186" width="70" height="36" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="685.0" y="208.9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="600">$18</text>
<path d="M720,204 C740,204 740,301 756,301" fill="none" stroke="#5ad4b5" stroke-width="1.6" marker-end="url(#m-teal)" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<path d="M280,301 C300,301 300,300 316,300" fill="none" stroke="#f8fafc" stroke-width="1.6" marker-end="url(#m-white)" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<rect x="320" y="272" width="300" height="56" rx="8" fill="#3f2a33" stroke="#ff939b" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="470.0" y="296.1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle">She sells the remainder for</text>
<text x="470.0" y="313.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle">$2 × (16 − 4 − 3) = $26 per day.</text>
<line x1="620" y1="300" x2="646" y2="300" stroke="#ff939b" stroke-width="1.8" marker-end="url(#m-coral)" vector-effect="non-scaling-stroke"/>
<rect x="650" y="282" width="70" height="36" rx="8" fill="#3f2a33" stroke="#ff939b" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="685.0" y="304.9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="600">$26</text>
<path d="M720,300 C740,300 740,301 756,301" fill="none" stroke="#ff939b" stroke-width="1.6" marker-end="url(#m-coral)" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<path d="M280,301 C300,301 300,396 316,396" fill="none" stroke="#f8fafc" stroke-width="1.6" marker-end="url(#m-white)" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<rect x="320" y="368" width="300" height="56" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="470.0" y="392.1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle">Eats 3 → 13 left; bakes 4 → 9 left;</text>
<text x="470.0" y="409.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle">9 eggs × $2 = $18.</text>
<line x1="620" y1="396" x2="646" y2="396" stroke="#5ad4b5" stroke-width="1.8" marker-end="url(#m-teal)" vector-effect="non-scaling-stroke"/>
<rect x="650" y="378" width="70" height="36" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="685.0" y="400.9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="600">$18</text>
<path d="M720,396 C740,396 740,301 756,301" fill="none" stroke="#5ad4b5" stroke-width="1.6" marker-end="url(#m-teal)" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<rect x="760" y="272" width="120" height="58" rx="8" fill="#3d3326" stroke="#ffc778" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="820.0" y="296.79999999999995" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="600">Majority</text>
<text x="820.0" y="314.99999999999994" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="600">vote</text>
<line x1="820" y1="330" x2="820" y2="372" stroke="#ffc778" stroke-width="1.8" marker-end="url(#m-amber)" vector-effect="non-scaling-stroke"/>
<rect x="760" y="376" width="120" height="44" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<text x="820.0" y="402.9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="600">Answer: $18</text>
<text x="820" y="252" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#ffc778" text-anchor="middle">marginalise out paths</text>
</svg>
