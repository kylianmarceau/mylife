<text x="600" y="34" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#66b3ff" text-anchor="middle" font-weight="600">Post-training phase</text>
