<svg width="100%" viewBox="0 0 900 370" role="img" xmlns="http://www.w3.org/2000/svg">
<title>LLM training pipeline</title>
<desc>Pretraining produces a pretrained LLM; post-training applies instruction tuning then preference alignment.</desc>
