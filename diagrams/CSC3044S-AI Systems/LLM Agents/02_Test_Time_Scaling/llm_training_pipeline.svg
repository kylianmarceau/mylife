<text x="750" y="154.875" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12.5" fill="#adb9cb" text-anchor="middle">assistant responses</text>
