<svg width="100%" viewBox="0 0 900 460" role="img" xmlns="http://www.w3.org/2000/svg">
<title>From one to three scaling laws</title>
<desc>Intelligence versus compute: pretraining scaling, then post-training scaling, then test-time scaling each push performance higher.</desc>
<defs><marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="90" y1="410" x2="860" y2="410" stroke="#f8fafc" stroke-width="1.8" marker-end="url(#m-white)" vector-effect="non-scaling-stroke"/>
<line x1="90" y1="410" x2="90" y2="30" stroke="#f8fafc" stroke-width="1.8" marker-end="url(#m-white)" vector-effect="non-scaling-stroke"/>
<text x="475" y="445" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle">Compute</text>
<text x="52" y="220" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" transform="rotate(-90 52 220)">"Intelligence"</text>
<text x="130" y="70" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#adb9cb" text-anchor="start" font-weight="600">From one to three scaling laws</text>
<path d="M95,402 L330,330" fill="none" stroke="#66b3ff" stroke-width="2.4" marker-end="url(#m-blue)" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<path d="M335,328 L560,262" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-dasharray="6 6" marker-end="url(#m-blue)" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<text x="350" y="352" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#66b3ff" text-anchor="start">Pre-training scaling</text>
<path d="M300,339 C330,300 360,268 420,240 L520,196" fill="none" stroke="#b89aff" stroke-width="2.4" marker-end="url(#m-violet)" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<path d="M525,194 L650,150" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-dasharray="6 6" marker-end="url(#m-violet)" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<text x="535" y="222" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#b89aff" text-anchor="start">Post-training scaling</text>
<path d="M420,240 C450,205 480,160 540,128 L620,92" fill="none" stroke="#5ad4b5" stroke-width="2.4" marker-end="url(#m-teal)" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<path d="M625,90 L730,52" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-dasharray="6 6" marker-end="url(#m-teal)" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<text x="640" y="116" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#5ad4b5" text-anchor="start">Test-time scaling</text>
<text x="640" y="136" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5ad4b5" text-anchor="start">"long thinking"</text>
</svg>
