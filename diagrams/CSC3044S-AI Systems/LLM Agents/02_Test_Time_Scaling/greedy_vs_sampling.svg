<svg width="100%" viewBox="0 0 900 335" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Greedy decoding versus sampling</title>
<desc>The same next-token distribution: greedy always selects the most probable token, sampling can draw any token.</desc>
