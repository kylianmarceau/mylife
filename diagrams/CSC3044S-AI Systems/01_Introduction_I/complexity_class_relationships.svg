<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 425" role="img" aria-labelledby="title desc">
<title id="title">Complexity classes: membership and hardness</title>
<desc id="desc">P is a subset of NP. NP-complete is a subset of both NP and NP-hard. Colours distinguish solving, verification and hardness; separate boxes show relationships and do not imply disjoint classes. Whether P equals NP is unresolved.</desc>
