<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
<title id="title">Perception and action across an agent boundary</title>
<desc id="desc">The environment supplies percepts to sensors inside the agent. Sensors feed the decision procedure and then actuators. Actions return to the environment. The boundary groups the three agent components.</desc>
