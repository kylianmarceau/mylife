<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 880 930" role="img" aria-labelledby="title desc">
<title id="title">Legal-Document Review As A Search-Assistance Task</title>
<desc id="desc">The document-analysis pipeline helps reviewers find relevant evidence. The human verifies findings and their source locations before accepting the assessment. Nodes: High-volume unstructured documents; OCR and layout extraction; Contextual clause analysis; Structured findings with clause and page references; Human legal review; Accepted document assessment.</desc>
<defs>
