<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 985 580" role="img" aria-labelledby="title desc">
<title id="title">Extend to dribbling and ball interception</title>
<desc id="desc">The expanded action network adds dribble while preserving the four input features. Nodes: Same four geometric inputs; Hidden computation; Pass score; Dribble score; Shoot score; Select highest activation.</desc>
<defs>
