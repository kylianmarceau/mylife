<g data-from="H" data-to="S" data-label="" data-bidirectional="false"><path d="M404.05 326 L536.825 439" fill="none" stroke="#b89aff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-violet)"/></g>
