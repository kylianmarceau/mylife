<g data-from="S" data-to="A" data-label="" data-bidirectional="false"><path d="M639.325 439 L777.125 335" fill="none" stroke="#ffc778" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#arrow-amber)"/></g>
<g data-node="I" aria-label="Same four&lt;br/&gt;geometric inputs"><rect x="17.5" y="225" width="195" height="110" rx="14" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<text x="115" y="262" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="500" text-anchor="middle">Same four</text>
