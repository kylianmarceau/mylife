<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 635" role="img" aria-labelledby="title desc">
<title id="title">Pass-or-shoot network: perception and outputs</title>
<desc id="desc">The depicted four-input network connects through two hidden nodes to pass and shoot scores. Nodes: Angle to B; Hidden unit 1; Distance to B; Angle to goalie; Distance to goalie; Hidden unit 2; Pass; Shoot.</desc>
