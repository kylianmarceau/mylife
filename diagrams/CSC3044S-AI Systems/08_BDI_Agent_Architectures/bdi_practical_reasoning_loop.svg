<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 930 820" role="img" aria-labelledby="title desc">
<title id="title">The Agent Paradigm And BDI Mental States</title>
<desc id="desc">The BDI agent senses, revises beliefs, deliberates about goals, selects a plan for its intentions, and acts. Its previous commitments influence later deliberation. Nodes: World and environment; Perceive; Revise beliefs; Generate options; Desires and goals; Filter and commit intentions; Select plan; Act through actuators.</desc>
