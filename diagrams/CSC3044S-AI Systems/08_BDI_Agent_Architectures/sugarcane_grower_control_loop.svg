<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 755" role="img" aria-labelledby="title desc">
<title id="title">Sugarcane Grower: Operational Decision-Making</title>
<desc id="desc">The grower architecture uses a dynamic decision network for uncertain beliefs and utility-based intention selection, while retaining explicit desires and action priorities. Nodes: Weather, grower, and mill; Discretised percepts; Bayesian belief revision; Previous beliefs; Intention selection; Set of desires; Dynamic decision network; Burning or other action.</desc>
