<svg width="100%" viewBox="0 0 900 485" role="img" xmlns="http://www.w3.org/2000/svg"><title>Maze navigation subsumption controller</title><desc>Sensor information feeds explore world, object avoidance and collision recovery in parallel; outputs are combined by subsumption and drive the actuators, with feedback to the sensors. Maze navigation sits above as an emergent behaviour.</desc><defs><marker id="ar-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="20" y="120" width="170" height="300" rx="6" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="105" y="204.89999999999998" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="bold" font-style="normal">Sensor</text><text x="105" y="226.99999999999997" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="bold" font-style="normal">Information</text><text x="105" y="316.1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal" font-style="normal">depends on the</text><text x="105" y="333.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal" font-style="normal">robot's position</text><rect x="700" y="120" width="170" height="300" rx="6" fill="#1b3835" stroke="#5ad4b5" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="785" y="275" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="bold" font-style="normal">Actuators</text><line x1="194" y1="170" x2="276" y2="170" stroke="#66b3ff" stroke-width="2" marker-end="url(#ar-b)" vector-effect="non-scaling-stroke"/><rect x="280" y="142" width="260" height="56" rx="6" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="410" y="176" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="bold" font-style="normal">Explore World</text><line x1="194" y1="270" x2="276" y2="270" stroke="#66b3ff" stroke-width="2" marker-end="url(#ar-b)" vector-effect="non-scaling-stroke"/><rect x="280" y="242" width="260" height="56" rx="6" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="410" y="276" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="bold" font-style="normal">Object Avoidance</text><line x1="194" y1="370" x2="276" y2="370" stroke="#66b3ff" stroke-width="2" marker-end="url(#ar-b)" vector-effect="non-scaling-stroke"/><rect x="280" y="342" width="260" height="56" rx="6" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="410" y="376" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="bold" font-style="normal">Collision Recovery</text><path d="M540 170 L600 170 L600 266" fill="none" stroke="#ffc778" stroke-width="2.2" marker-end="url(#ar-a)" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M540 270 L650 270 L650 366" fill="none" stroke="#ffc778" stroke-width="2.2" marker-end="url(#ar-a)" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="600" cy="270" r="5" fill="#ffc778"/><circle cx="650" cy="370" r="5" fill="#ffc778"/><line x1="540" y1="370" x2="696" y2="370" stroke="#5ad4b5" stroke-width="2.2" marker-end="url(#ar-t)" vector-effect="non-scaling-stroke"/><text x="612" y="210" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#ffc778" text-anchor="start" font-weight="normal" font-style="normal">subsumes</text><path d="M785 424 L785 465 L105 465 L105 426" fill="none" stroke="#ffc778" stroke-width="2.2" marker-end="url(#ar-a)" stroke-dasharray="8 6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><text x="445" y="455" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ffc778" text-anchor="middle" font-weight="normal" font-style="normal">movement changes the robot's position and so the next sensor readings</text><rect x="280" y="20" width="260" height="56" rx="6" fill="none" stroke="#5ad4b5" stroke-width="2" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/><text x="410" y="54" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#5ad4b5" text-anchor="middle" font-weight="bold" font-style="normal">Maze Navigation</text><text x="560" y="44" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="start" font-weight="normal" font-style="normal">emergent, not coded</text><path d="M540 48 L600 48 L600 166" fill="none" stroke="#5ad4b5" stroke-width="2" marker-end="url(#ar-t)" stroke-dasharray="6 5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
</svg>
