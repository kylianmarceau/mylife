rt" font-weight="bold" font-style="normal">Discomfort field g</text><rect x="530" y="80" width="26" height="26" rx="3" fill="#3f2a33" stroke="#ff939b" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="570" y="98" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="start" font-weight="normal" font-style="normal">Red: highest discomfort</text><rect x="530" y="120" width="26" height="26" rx="3" fill="#302b46" stroke="#b89aff" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="570" y="138" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="start" font-weight="normal" font-style="normal">Purple: high discomfort</text><rect x="530" y="160" width="26" height="26" rx="3" fill="#3d3326" stroke="#ffc778" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="570" y="178" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="start" font-weight="normal" font-style="normal">Orange: low discomfort</text><rect x="530" y="200" width="26" height="26" rx="3" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="570" y="218" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="start" font-weight="normal" font-style="normal">Green: lowest discomfort (goal G)</text><rect x="530" y="240" width="26" height="26" fill="#adb9cb" opacity="0.55"/><text x="570" y="258" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="start" font-weight="normal" font-style="normal">Obstacle</text><rect x="530" y="300" width="345" height="150" rx="8" fill="#272f3b" stroke="#