<svg width="100%" viewBox="0 0 900 360" role="img" xmlns="http://www.w3.org/2000/svg"><title>Subsumption architecture data flow</title><desc>The sensation stream feeds behaviours 1, 2 and 3 in parallel. Behaviour 3 output subsumes behaviour 2 output, which subsumes behaviour 1 output, producing the action stream.</desc><defs><marker id="ar-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="260" y="44" width="380" height="52" rx="6" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="450" y="76" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="bold" font-style="normal">Behaviour 3</text><rect x="260" y="149" width="380" height="52" rx="6" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="450" y="181" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="bold" font-style="normal">Behaviour 2</text><rect x="260" y="259" width="380" height="52" rx="6" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="450" y="291" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="bold" font-style="normal">Behaviour 1</text><line x1="20" y1="285" x2="256" y2="285" stroke="#66b3ff" stroke-width="2.4" marker-end="url(#ar-b)" vector-effect="non-scaling-stroke"/><text x="110" y="312" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#66b3ff" text-anchor="middle" font-weight="normal" font-style="normal">Sensation stream</text><path d="M190 285 L190 70 L256 70" fill="none" stroke="#66b3ff" stroke-width="2.4" marker-end="url(#ar-b)" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M190 175 L256 175" fill="none" stroke="#66b3ff" stroke-width="2.4" marker-end="url(#ar-b)" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="190" cy="285" r="4" fill="#66b3ff"/><circle cx="190" cy="175" r="4" fill="#66b3ff"/><path d="M640 70 L700 70 L700 171" fill="none" stroke="#ffc778" stroke-width="2.4" marker-end="url(#ar-a)" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><text x="712" y="130" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#ffc778" text-anchor="start" font-weight="normal" font-style="normal">Subsumption</text><path d="M640 175 L760 175 L760 281" fill="none" stroke="#ffc778" stroke-width="2.4" marker-end="url(#ar-a)" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><text x="772" y="236" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#ffc778" text-anchor="start" font-weight="normal" font-style="normal">Subsumption</text><circle cx="700" cy="175" r="5" fill="#ffc778"/><circle cx="760" cy="285" r="5" fill="#ffc778"/><line x1="640" y1="285" x2="880" y2="285" stroke="#5ad4b5" stroke-width="2.4" marker-end="url(#ar-t)" vector-effect="non-scaling-stroke"/><text x="800" y="312" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#5ad4b5" text-anchor="middle" font-weight="normal" font-style="normal">Action stream</text><text x="450" y="345" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal" font-style="normal">Higher layers can override (subsume) the output of the layers below them</text>
</svg>
