tem-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle" font-weight="normal" font-style="normal">o</text><text x="400" y="90" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="bold" font-style="normal">r</text><text x="408" y="95" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle" font-weight="normal" font-style="normal">a</text><path d="M316.6 306.6 A80 80 0 0 1 203.4 306.6" fill="none" stroke="#ffc778" stroke-width="1.8" marker-end="url(#ar-a)" stroke-dasharray="5 4" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><text x="260" y="385" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#ffc778" text-anchor="middle" font-weight="bold" font-style="normal">blind zone: 360° − α</text><text x="260" y="407" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal" font-style="normal">(view angle α)</text><rect x="520" y="90" width="30" height="30" rx="4" fill="#3f2a33" stroke="#ff939b" stroke-width="1.6" vector-effect="non-scaling-stroke"/><text x="565" y="103" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#f8fafc" text-anchor="start" font-weight="bold" font-style="normal">Zone of repulsion</text><text x="565" y="123" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="start" font-weight="normal" font-style="normal">radius r<tspan font-size="10" dy="4">c</tspan><tspan dy="-4">: move away from mates</tspan></text><rect x="520" y="170" width="30" height="30" rx="4" fill="#302b46" stroke="#b89aff" stroke-width="1.6" vector-effect="non-scaling-stroke"/><text x="565" y="183" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#f8fafc" text-anchor="start" font-weight="bold" font-style="normal">Zone of orientation</text><text x="565" y="203" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="start" font-weight="normal" font-style="normal">align with mates' average direction</text><rect x="520" y="250" width="30" height="30" rx="4" fill="#20344c" stroke="#66b3ff" stroke-width="1.6" vector-effect="non-scaling-stroke"/><text x="565" y="263" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#f8fafc" text-anchor="start" font-weight="bold" font-style="normal">Zone of attraction</text><text x="565" y="283" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="start" font-weight="normal" font-style="normal">move towards mates further out</text><text x="520" y="360" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#f8fafc" text-anchor="start" font-weight="bold" font-style="normal">Nested radii: r<tspan font-size="10" dy="4">c</tspan><tspan dy="-4"> ≤ r<tspan font-size="10" dy="4">o</tspan><tspan dy="-4"> ≤ r<tspan font-size="10" dy="4">a</tspan><tspan dy="-4"></tspan></tspan></tspan></text>
</svg>
