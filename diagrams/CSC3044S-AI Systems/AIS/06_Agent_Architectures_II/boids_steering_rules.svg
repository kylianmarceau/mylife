/><g transform="translate(740 235) rotate(-70)"><path d="M11 0 L-7.699999999999999 -6.6 L-7.699999999999999 6.6 Z" fill="#20344c" stroke="#66b3ff" stroke-width="1.6" vector-effect="non-scaling-stroke"/></g><line x1="717.0" y1="166.0" x2="705" y2="165" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/><g transform="translate(705 165) rotate(-70)"><path d="M11 0 L-7.699999999999999 -6.6 L-7.699999999999999 6.6 Z" fill="#20344c" stroke="#66b3ff" stroke-width="1.6" vector-effect="non-scaling-stroke"/></g><circle cx="717.0" cy="166.0" r="5" fill="#f8fafc"/><g transform="translate(805 175) rotate(-90)"><path d="M13 0 L-9.1 -7.8 L-9.1 7.8 Z" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.6" vector-effect="non-scaling-stroke"/></g><line x1="792" y1="174" x2="729.0" y2="167.0" stroke="#ffc778" stroke-width="2.6" marker-end="url(#ar-a)" vector-effect="non-scaling-stroke"/><text x="750" y="325.79999999999995" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb" text-anchor="middle" font-weight="normal" font-style="normal">steer towards the average</text><text x="750" y="343.99999999999994" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb" text-anchor="middle" font-weight="normal" font-style="normal">position of flock mates</text><g transform="translate(270 382) rotate(0)"><path d="M10 0 L-7.0 -6.0 L-7.0 6.0 Z" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.6" vector-effect="non-scaling-stroke"/></g><text x="288" y="387" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="start" font-weight="normal" font-style="normal">focal boid</text><g transform="translate(400 382) rotate(0)"><path d="M10 0 L-7.0 -6.0 L-7.0 6.0 Z" fill="#20344c" stroke="#66b3ff" stroke-width="1.6" vector-effect="non-scaling-stroke"/