<svg width="100%" viewBox="0 0 900 400" role="img" xmlns="http://www.w3.org/2000/svg"><title>Boids steering rules</title><desc>Three neighbourhood circles. Repulsion: the focal boid steers away from close flock mates. Orientation: it turns to match their average heading. Attraction: it steers towards their average position.</desc><defs><marker id="ar-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<circle cx="150" cy="170" r="115" fill="#272f3b" stroke="#adb9cb" stroke-width="1.6" vector-effect="non-scaling-stroke"/><text x="150" y="30" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#66b3ff" text-anchor="middle" font-weight="bold" font-style="normal">Repulsion</text><line x1="150" y1="170" x2="180" y2="120" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/><g transform="translate(180 120) rotate(-60)"><path d="M11 0 L-7.699999999999999 -6.6 L-7.699999999999999 6.6 Z" fill="#20344c" stroke="#66b3ff" stroke-width="1.6" vector-effect="non-scaling-stroke"/></g><line x1="150" y1="170" x2="90" y2="215" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/><g transform="translate(90 215) rotate(-60)"><path d="M11 0 L-7.699999999999999 -6.6 L-7.699999999999999 6.6 Z" fill="#20344c" stroke="#66b3ff" stroke-width="1.6" vector-effect="non-scaling-stroke"/></g><line x1="150" y1="170" x2="115" y2="155" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/><g transform="translate(115 155) rotate(-60)"><path d="M11 0 L-7.699999999999999 -6.6 L-7.699999999999999 6.6 Z" fill="#20344c" stroke="#66b3ff" stroke-width="1.6" vector-effect="non-scaling-stroke"/></g><g transform="translate(150 170) rotate(-40)"><path d="M13 0 L-9.1 -7.8 L-9.1 7.8 Z" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.6" vector-effect="non-scaling-stroke"/></g><line x1="158" y1="178" x2="205" y2="210" stroke="#ffc778" stroke-width="2.6" marker-end="url(#ar-a)" vector-effect="non-scaling-stroke"/><text x="150" y="325.79999999999995" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb" text-anchor="middle" font-weight="normal" font-style="normal">steer away from</text><text x="150" y="343.99999999999994" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, s