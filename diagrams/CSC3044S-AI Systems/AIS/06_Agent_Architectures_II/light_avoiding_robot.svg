<svg width="100%" viewBox="0 0 900 405" role="img" xmlns="http://www.w3.org/2000/svg"><title>Light avoiding robot controller</title><desc>Sensor information feeds light avoidance, object avoidance and collision recovery in parallel; higher outputs subsume lower ones before reaching the actuators, and movement feeds back to the sensors.</desc><defs><marker id="ar-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="20" y="40" width="170" height="300" rx="6" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="105" y="124.9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="bold" font-style="normal">Sensor</text><text x="105" y="147.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="bold" font-style="normal">Information</text><text x="105" y="236.10000000000002" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal" font-style="normal">depends on the</text><text x="105" y="253.00000000000003" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal" font-style="normal">robot's position</text><rect x="700" y="40" width="170" height="300" rx="6" fill="#1b3835" stroke="#5ad4b5" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="785" y="195" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="bold" font-style="normal">Actuators</text><line x1="194" y1="90" x2="276" y2="90" stroke="#66b3ff" stroke-width="2" marker-end="url(#ar-b)" vector-effect="non-scaling-stroke"/><rect x="280" y="62" width="260" height="56" rx="6" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="410" y="96" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="bold" font-style="normal">Light Avoidance</text><line x1="194" y1="190" x2="276" y2="190" stroke="#66b3ff" stroke-width="2" marker-end="url(#ar-b)" vector-effect="non-scaling-stroke"/><rect x="280" y="162" width="260" height="56" rx="6" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="410" y="196" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="bold" font-style="normal">Object Avoidance</text><line x1="194" y1="290" x2="276" y2="290" stroke="#66b3ff" stroke-width="2" marker-end="url(#ar-b)" vector-effect="non-scaling-stroke"/><rect x="280" y="262" width="260" height="56" rx="6" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="410" y="296" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="bold" font-style="normal">Collision Recovery</text><path d="M540 90 L600 90 L600 186" fill="none" stroke="#ffc778" stroke-width="2.2" marker-end="url(#ar-a)" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M540 190 L650 190 L650 286" fill="none" stroke="#ffc778" stroke-width="2.2" marker-end="url(#ar-a)" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="600" cy="190" r="5" fill="#ffc778"/><circle cx="650" cy="290" r="5" fill="#ffc778"/><line x1="540" y1="290" x2="696" y2="290" stroke="#5ad4b5" stroke-width="2.2" marker-end="url(#ar-t)" vector-effect="non-scaling-stroke"/><text x="612" y="130" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#ffc778" text-anchor="start" font-weight="normal" font-style="normal">subsumes</text><path d="M785 344 L785 385 L105 385 L105 346" fill="none" stroke="#ffc778" stroke-width="2.2" marker-end="url(#ar-a)" stroke-dasharray="8 6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><text x="445" y="375" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ffc778" text-anchor="middle" font-weight="normal" font-style="normal">movement changes the robot's position and so the next sensor readings</text>
</svg>
