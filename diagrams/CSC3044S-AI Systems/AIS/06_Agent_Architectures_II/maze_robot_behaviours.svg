<svg width="100%" viewBox="0 0 900 540" role="img" xmlns="http://www.w3.org/2000/svg"><title>Maze robot behaviours and emergent path</title><desc>Three coded behaviours: collision recovery backs up and turns, obstacle avoidance moves forward and veers before a wall, explore moves straight away from the start. Below, the robot's combined trajectory curves along walls, which looks like maze navigation.</desc><defs><marker id="ar-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="150" y="30" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#ff939b" text-anchor="middle" font-weight="bold" font-style="normal">Collision recovery</text><line x1="250" y1="60" x2="250" y2="230" stroke="#f8fafc" stroke-width="3" vector-effect="non-scaling-stroke"/><g transform="translate(180 150) rotate(-30)"><rect x="-28" y="-24" width="56" height="48" rx="4" fill="#272f3b" stroke="#ff939b" stroke-width="2" vector-effect="non-scaling-stroke"/><rect x="-12" y="-33" width="24" height="9" rx="2" fill="#ff939b"/><rect x="-12" y="24" width="24" height="9" rx="2" fill="#ff939b"/><path d="M28 -16 L40 -21 L40 -5 L28 -8 Z M28 8 L40 5 L40 21 L28 16 Z" fill="none" stroke="#66b3ff" stroke-width="1.6" vector-effect="non-scaling-stroke"/></g><circle cx="244" cy="128" r="9" fill="none" stroke="#ff939b" stroke-width="2"/><path d="M160 175 L120 205" fill="none" stroke="#ff939b" stroke-width="2.2" marker-end="url(#ar-c)" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M120 205 Q85 200 95 160" fill="none" stroke="#ff939b" stroke-width="2.2" marker-end="url(#ar-c)" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><text x="150" y="258.1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal" font-style="normal">hit: back up,</text><text x="150" y="275.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal" font-style="normal">turn ~90° (random)</text><text x="450" y="30" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#ffc778" text-anchor="middle" font-weight="bold" font-style="normal">Move (obstacle avoidance)</text><line x1="560" y1="70" x2="490" y2="235" stroke="#f8fafc" stroke-width="3" vector-effect="non-scaling-stroke"/><g transform="translate(400 150) rotate(0)"><rect x="-28" y="-24" width="56" height="48" rx="4" fill="#272f3b" stroke="#ffc778" stroke-width="2" vector-effect="non-scaling-stroke"/><rect x="-12" y="-33" width="24" height="9" rx="2" fill="#ffc778"/><rect x="-12" y="24" width="24" height="9" rx="2" fill="#ffc778"/><path d="M28 -16 L40 -21 L40 -5 L28 -8 Z M28 8 L40 5 L40 21 L28 16 Z" fill="none" stroke="#66b3ff" stroke-width="1.6" vector-effect="non-scaling-stroke"/></g><path d="M445 150 Q500 150 520 95" fill="none" stroke="#ffc778" stroke-width="2.2" marker-end="url(#ar-a)" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><text x="450" y="258.1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal" font-style="normal">move forward; within 5 cm,</text><text x="450" y="275.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal" font-style="normal">turn ~90° (random)</text><text x="750" y="30" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#5ad4b5" text-anchor="middle" font-weight="bold" font-style="normal">Explore</text><g transform="translate(700 150) rotate(0)"><rect x="-28" y="-24" width="56" height="48" rx="4" fill="#272f3b" stroke="#5ad4b5" stroke-width="2" vector-effect="non-scaling-stroke"/><rect x="-12" y="-33" width="24" height="9" rx="2" fill="#5ad4b5"/><rect x="-12" y="24" width="24" height="9" rx="2" fill="#5ad4b5"/><path d="M28 -16 L40 -21 L40 -5 L28 -8 Z M28 8 L40 5 L40 21 L28 16 Z" fill="none" stroke="#66b3ff" stroke-width="1.6" vector-effect="non-scaling-stroke"/></g><line x1="745" y1="150" x2="860" y2="150" stroke="#5ad4b5" stroke-width="2.4" marker-end="url(#ar-t)" vector-effect="non-scaling-stroke"/><text x="750" y="258.1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal" font-style="normal">move away from</text><text x="750" y="275.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal" font-style="normal">the starting point</text><line x1="20" y1="300" x2="880" y2="300" stroke="#adb9cb" stroke-width="1" stroke-dasharray="2 6" vector-effect="non-scaling-stroke"/><text x="450" y="330" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="bold" font-style="normal">Combined in parallel: maze navigation emerges</text><path d="M860 345 L860 520 L250 520" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M60 380 Q150 380 190 440 Q240 490 330 440" fill="none" stroke="#66b3ff" stroke-width="2" marker-end="url(#ar-b)" stroke-dasharray="7 5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><g transform="translate(395 420) rotate(-10)"><rect x="-28" y="-24" width="56" height="48" rx="4" fill="#272f3b" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/><rect x="-12" y="-33" width="24" height="9" rx="2" fill="#66b3ff"/><rect x="-12" y="24" width="24" height="9" rx="2" fill="#66b3ff"/><path d="M28 -16 L40 -21 L40 -5 L28 -8 Z M28 8 L40 5 L40 21 L28 16 Z" fill="none" stroke="#66b3ff" stroke-width="1.6" vector-effect="non-scaling-stroke"/></g><path d="M450 410 Q560 395 640 440 Q720 480 780 440" fill="none" stroke="#66b3ff" stroke-width="2" marker-end="url(#ar-b)" stroke-dasharray="7 5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M810 420 Q850 390 835 355" fill="none" stroke="#66b3ff" stroke-width="2" marker-end="url(#ar-b)" stroke-dasharray="7 5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><text x="560" y="486.1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal" font-style="normal">no 'wall' or 'navigation' concept is stored:</text><text x="560" y="503.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal" font-style="normal">the robot only reacts to distance readings</text>
</svg>
