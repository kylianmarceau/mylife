<svg width="100%" viewBox="0 0 900 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Legal clause finder: initial version vs fully LLM version</title>
<desc>Initial version: local OCR, fuzzy matching of common phrases, and a small local LLM only for difficult cases. Fully LLM version: OCR followed by LLM contextual analysis. Both end in candidate clauses checked by a human.</desc>
<defs><marker id="mw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="30" fill="#adb9cb" font-size="15" font-weight="600">Initial version  <tspan font-weight="400" font-size="13">(constraints on using LLMs at the time)</tspan></text>
<g stroke-width="1.8">
<rect x="30" y="50" width="140" height="56" rx="10" fill="#20344c" stroke="#66b3ff"/>
<rect x="205" y="50" width="170" height="56" rx="10" fill="#272f3b" stroke="#adb9cb"/>
<rect x="415" y="122" width="150" height="50" rx="10" fill="#302b46" stroke="#b89aff"/>
<rect x="600" y="50" width="130" height="56" rx="10" fill="#272f3b" stroke="#adb9cb"/>
<rect x="765" y="50" width="115" height="56" rx="10" fill="#1b3835" stroke="#5ad4b5"/>
</g>
<g font-size="14" fill="#f8fafc" text-anchor="middle">
<text x="100" y="74">Local OCR</text><text x="100" y="93" fill="#adb9cb" font-size="12">(Python)</text>
<text x="290" y="74">Fuzzy matching</text><text x="290" y="93" fill="#adb9cb" font-size="12">common phrases</text>
<text x="490" y="143">Small local LLM</text><text x="490" y="161" fill="#adb9cb" font-size="12">difficult cases only</text>
<text x="665" y="74">Candidate</text><text x="665" y="93">clauses</text>
<text x="822" y="74">Human</text><text x="822" y="93">check</text>
</g>
<g stroke="#f8fafc" stroke-width="1.8" fill="none">
<line x1="170" y1="78" x2="200" y2="78" marker-end="url(#mw)"/>
<line x1="375" y1="78" x2="595" y2="78" marker-end="url(#mw)"/>
<line x1="730" y1="78" x2="760" y2="78" marker-end="url(#mw)"/>
</g>
<g stroke="#ffc778" stroke-width="1.8" fill="none" stroke-dasharray="5 4">
<path d="M320 106 C320 140 360 147 410 147" marker-end="url(#ma)"/>
<path d="M565 147 C620 147 650 140 660 111" marker-end="url(#ma)"/>
</g>
<text x="30" y="200" fill="#ff939b" font-size="13">✗ misses some clauses completely <tspan dx="16">✗</tspan> picks up unrelated clauses from partial phrase matches</text>
<line x1="30" y1="222" x2="870" y2="222" stroke="#adb9cb" stroke-opacity="0.35" stroke-width="1"/>
<text x="30" y="252" fill="#b89aff" font-size="15" font-weight="600">Fully LLM version</text>
<g stroke-width="1.8">
<rect x="30" y="272" width="140" height="56" rx="10" fill="#20344c" stroke="#66b3ff"/>
<rect x="205" y="272" width="360" height="56" rx="10" fill="#302b46" stroke="#b89aff"/>
<rect x="600" y="272" width="130" height="56" rx="10" fill="#272f3b" stroke="#adb9cb"/>
<rect x="765" y="272" width="115" height="56" rx="10" fill="#1b3835" stroke="#5ad4b5"/>
</g>
<g font-size="14" fill="#f8fafc" text-anchor="middle">
<text x="100" y="305">OCR</text>
<text x="385" y="296">LLM contextual analysis</text><text x="385" y="315" fill="#adb9cb" font-size="12">context narrows the search</text>
<text x="665" y="296">Candidate</text><text x="665" y="315">clauses</text>
<text x="822" y="296">Human</text><text x="822" y="315">check</text>
</g>
<g stroke="#f8fafc" stroke-width="1.8">
<line x1="170" y1="300" x2="200" y2="300" marker-end="url(#mw)"/>
<line x1="565" y1="300" x2="595" y2="300" marker-end="url(#mw)"/>
<line x1="730" y1="300" x2="760" y2="300" marker-end="url(#mw)"/>
</g>
<text x="30" y="362" fill="#5ad4b5" font-size="13">✓ fewer clauses missed <tspan dx="16">✓</tspan> fewer, more accurate clauses to consider <tspan dx="16">✓</tspan> faster human checks</text>
</g>
</svg>
