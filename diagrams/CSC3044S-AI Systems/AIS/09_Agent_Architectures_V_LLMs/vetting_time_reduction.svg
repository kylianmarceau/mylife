<svg width="100%" viewBox="0 0 900 270" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Time to vet a legal document</title>
<desc>Manual vetting took 90 minutes per document; solution 1 took 15 minutes; solution 2 took 5 minutes.</desc>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="20" y="28" fill="#f8fafc" font-size="16" font-weight="600">Key metric: time taken to vet one document</text>
<g stroke="#adb9cb" stroke-width="1" stroke-opacity="0.3">
<line x1="240" y1="45" x2="240" y2="230"/><line x1="436.7" y1="45" x2="436.7" y2="230"/><line x1="633.3" y1="45" x2="633.3" y2="230"/><line x1="830" y1="45" x2="830" y2="230"/>
</g>
<g font-size="14" text-anchor="end">
<text x="225" y="83" fill="#f8fafc">Original (manual)</text>
<text x="225" y="143" fill="#f8fafc">Solution 1</text><text x="225" y="160" fill="#adb9cb" font-size="12">OCR + fuzzy matching</text>
<text x="225" y="203" fill="#f8fafc">Solution 2</text><text x="225" y="220" fill="#adb9cb" font-size="12">fully LLM</text>
</g>
<rect x="240" y="60" width="590" height="38" rx="4" fill="#3f2a33" stroke="#ff939b" stroke-width="1.8"/>
<rect x="240" y="125" width="98.3" height="38" rx="4" fill="#20344c" stroke="#66b3ff" stroke-width="1.8"/>
<rect x="240" y="185" width="32.8" height="38" rx="4" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8"/>
<g font-size="14">
<text x="815" y="84" fill="#f8fafc" text-anchor="end" font-weight="600">90 min (1.5 h)</text>
<text x="350" y="149" fill="#f8fafc" font-weight="600">15 min <tspan fill="#66b3ff" font-weight="400">· 6× faster, ≈83% less time</tspan></text>
<text x="285" y="209" fill="#f8fafc" font-weight="600">5 min <tspan fill="#5ad4b5" font-weight="400">· 18× faster, ≈94% less time</tspan></text>
</g>
<g fill="#adb9cb" font-size="12" text-anchor="middle">
<text x="240" y="250">0</text><text x="436.7" y="250">30</text><text x="633.3" y="250">60</text><text x="830" y="250">90 min</text>
</g>
</g>
</svg>
