<svg width="100%" viewBox="0 0 900 245" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Automated legal analysis pipeline</title>
<desc>Unstructured documents pass through OCR and layout extraction, then LLM contextual analysis, then automated reporting with expert human review.</desc>
<defs><marker id="mw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="20" y="28" fill="#f8fafc" font-size="16" font-weight="600">High-volume unstructured legal data → verified professional reports</text>
<rect x="20" y="55" width="190" height="140" rx="10" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8"/>
<rect x="245" y="55" width="190" height="140" rx="10" fill="#20344c" stroke="#66b3ff" stroke-width="1.8"/>
<rect x="470" y="55" width="190" height="140" rx="10" fill="#302b46" stroke="#b89aff" stroke-width="1.8"/>
<rect x="695" y="55" width="190" height="140" rx="10" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8"/>
<g font-size="14" text-anchor="middle">
<text x="115" y="84" fill="#adb9cb" font-weight="600">1 · Input</text>
<text x="115" y="112" fill="#f8fafc">Unstructured</text><text x="115" y="131" fill="#f8fafc">documents</text>
<text x="115" y="158" fill="#adb9cb" font-size="12">poor-quality scans, text</text><text x="115" y="175" fill="#adb9cb" font-size="12">files, diverse doc types</text>
<text x="340" y="84" fill="#66b3ff" font-weight="600">2 · Extract</text>
<text x="340" y="112" fill="#f8fafc">OCR and layout</text><text x="340" y="131" fill="#f8fafc">extraction</text>
<text x="340" y="158" fill="#adb9cb" font-size="12">character recognition,</text><text x="340" y="175" fill="#adb9cb" font-size="12">table recovery</text>
<text x="565" y="84" fill="#b89aff" font-weight="600">3 · Analyse</text>
<text x="565" y="112" fill="#f8fafc">LLM contextual</text><text x="565" y="131" fill="#f8fafc">analysis</text>
<text x="565" y="158" fill="#adb9cb" font-size="12">entity identification,</text><text x="565" y="175" fill="#adb9cb" font-size="12">Q&amp;A answering</text>
<text x="790" y="84" fill="#5ad4b5" font-weight="600">4 · Report</text>
<text x="790" y="112" fill="#f8fafc">Automated reporting</text><text x="790" y="131" fill="#f8fafc">+ human review</text>
<text x="790" y="158" fill="#adb9cb" font-size="12">structured report, then</text><text x="790" y="175" fill="#adb9cb" font-size="12">expert legal verification</text>
</g>
<g stroke="#f8fafc" stroke-width="1.8">
<line x1="210" y1="125" x2="240" y2="125" marker-end="url(#mw)"/><line x1="435" y1="125" x2="465" y2="125" marker-end="url(#mw)"/><line x1="660" y1="125" x2="690" y2="125" marker-end="url(#mw)"/>
</g>
<g font-size="13" text-anchor="middle">
<text x="115" y="230" fill="#adb9cb">raw pages</text>
<text x="340" y="230" fill="#adb9cb">structured text</text>
<text x="565" y="230" fill="#adb9cb">"Yes, see clause 4.1 (p. 5)"</text>
<text x="790" y="230" fill="#5ad4b5">lawyer checks cited clause</text>
</g>
</g>
</svg>
