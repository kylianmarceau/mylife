<svg width="100%" viewBox="0 0 900 392" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Iterating the slide-generation prompt</title>
<desc>Three iterations: each output is inspected and a more explicit style constraint is added to the prompt until the slides are plain and positive.</desc>
<defs><marker id="mw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<g fill="#adb9cb" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">
<text x="150" y="28">ITERATION 1</text><text x="450" y="28">ITERATION 2</text><text x="750" y="28">ITERATION 3</text>
</g>
<text x="20" y="100" fill="#ffc778" font-size="12" transform="rotate(-90 20 100)" text-anchor="middle">PROMPT</text>
<text x="20" y="255" fill="#adb9cb" font-size="12" transform="rotate(-90 20 255)" text-anchor="middle">OUTPUT</text>
<g fill="#3d3326" stroke="#ffc778" stroke-width="1.8">
<rect x="35" y="45" width="230" height="100" rx="10"/><rect x="335" y="45" width="230" height="100" rx="10"/><rect x="635" y="45" width="230" height="100" rx="10"/>
</g>
<g fill="#f8fafc" font-size="14" text-anchor="middle">
<text x="150" y="80" font-weight="600">Initial prompt</text><text x="150" y="102">"plain professional"</text><text x="150" y="122" fill="#adb9cb" font-size="13">deck for final-year students</text>
<text x="450" y="80" font-weight="600">+ image use to a bare minimum</text><text x="450" y="102">+ "no verbose or exaggerated</text><text x="450" y="122">images and wording"</text>
<text x="750" y="80" font-weight="600">+ "Keep a positive tone"</text><text x="750" y="104" fill="#adb9cb" font-size="13">(previous constraints kept)</text>
</g>
<g stroke="#f8fafc" stroke-width="1.8" fill="none">
<line x1="150" y1="145" x2="150" y2="193" marker-end="url(#mw)"/><line x1="450" y1="145" x2="450" y2="193" marker-end="url(#mw)"/><line x1="750" y1="145" x2="750" y2="193" marker-end="url(#mw)"/>
</g>
<rect x="35" y="200" width="230" height="110" rx="10" fill="#3f2a33" stroke="#ff939b" stroke-width="1.8"/>
<rect x="335" y="200" width="230" height="110" rx="10" fill="#3d3326" stroke="#ffc778" stroke-width="1.8"/>
<rect x="635" y="200" width="230" height="110" rx="10" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8"/>
<g fill="#f8fafc" font-size="14" text-anchor="middle">
<text x="150" y="232" font-weight="600">"Extreme Risks of</text><text x="150" y="252" font-weight="600">Unconstrained Agents"</text><text x="150" y="276" fill="#adb9cb" font-size="13">flaming incident panels</text><text x="150" y="297" fill="#ff939b" font-size="13">too dramatic</text>
<text x="450" y="232" font-weight="600">"Unconstrained AI is a</text><text x="450" y="252" font-weight="600">liability in production"</text><text x="450" y="276" fill="#adb9cb" font-size="13">plain two-column slide</text><text x="450" y="297" fill="#ffc778" font-size="13">tone still negative</text>
<text x="750" y="232" font-weight="600">"The Reality Check:</text><text x="750" y="252" font-weight="600">AI Without Guardrails"</text><text x="750" y="276" fill="#adb9cb" font-size="13">three plain cards</text><text x="750" y="297" fill="#5ad4b5" font-size="13">calmer framing</text>
</g>
<g stroke="#ffc778" stroke-width="1.8" fill="none" stroke-dasharray="5 4">
<path d="M265 255 C300 255 300 120 330 100" marker-end="url(#ma)"/>
<path d="M565 255 C600 255 600 120 630 100" marker-end="url(#ma)"/>
</g>
<g fill="#ffc778" font-size="12" text-anchor="middle"><text x="300" y="330">inspect, add</text><text x="300" y="346">constraint</text><text x="600" y="330">inspect, add</text><text x="600" y="346">constraint</text></g>
<text x="450" y="382" fill="#adb9cb" font-size="13" text-anchor="middle">Generative AI stays dramatic unless explicitly told to tone down</text>
</g>
</svg>
