<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 420" role="img">
<title>Reactive sense-act controller and a robot vacuum example</title>
<desc>Left: sensed input fans out to parallel sense-act transfer rules (Rule 1 to Rule n), whose outputs drive Act, which changes the environment, which is sensed again. Right: an example controller with behaviours identify objects, monitor changes, explore, wander and avoid objects.</desc>
<defs><marker id="mw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="mt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="mc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="220" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#66b3ff">Sense-act transfer rules (behaviours)</text>
<g fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8"><rect x="170" y="50" width="100" height="32" rx="6"/><rect x="170" y="95" width="100" height="32" rx="6"/><rect x="170" y="140" width="100" height="32" rx="6"/><rect x="170" y="185" width="100" height="32" rx="6"/></g>
<g font-size="14" fill="#f8fafc" text-anchor="middle"><text x="220" y="71">Rule 1</text><text x="220" y="116">Rule 2</text><text x="220" y="161">Rule 3</text><text x="220" y="206">Rule n</text></g>
<g stroke="#66b3ff" stroke-width="1.8" fill="none">
<path d="M70 270 L70 66 L166 66" marker-end="url(#mb)"/><path d="M70 111 L166 111" marker-end="url(#mb)"/><path d="M70 156 L166 156" marker-end="url(#mb)"/><path d="M70 201 L166 201" marker-end="url(#mb)"/>
</g>
<g stroke="#5ad4b5" stroke-width="1.8" fill="none">
<path d="M270 66 L370 66"/><path d="M270 111 L370 111"/><path d="M270 156 L370 156"/><path d="M270 201 L370 201"/><path d="M370 66 L370 266" marker-end="url(#mt)"/>
</g>
<rect x="30" y="272" width="80" height="40" rx="8" fill="#20344c" stroke="#66b3ff" stroke-width="1.8"/><text x="70" y="298" text-anchor="middle" font-size="15" fill="#f8fafc">Sense</text>
<rect x="330" y="272" width="80" height="40" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8"/><text x="370" y="298" text-anchor="middle" font-size="15" fill="#f8fafc">Act</text>
<ellipse cx="220" cy="355" rx="85" ry="28" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8"/><text x="220" y="360" text-anchor="middle" font-size="15" fill="#f8fafc">Environment</text>
<path d="M350 312 L292 340" stroke="#5ad4b5" stroke-width="1.8" fill="none" marker-end="url(#mt)"/>
<path d="M148 340 L92 314" stroke="#66b3ff" stroke-width="1.8" fill="none" marker-end="url(#mb)"/>
<text x="220" y="405" text-anchor="middle" font-size="13" fill="#ffc778">Rules can run in concurrent or sequential mode</text>
<line x1="460" y1="20" x2="460" y2="400" stroke="#adb9cb" stroke-width="1" stroke-dasharray="4 5"/>
<text x="680" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#5ad4b5">Example: robot vacuum behaviours</text>
<g fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8"><rect x="620" y="50" width="140" height="30" rx="6"/><rect x="620" y="92" width="140" height="30" rx="6"/><rect x="620" y="134" width="140" height="30" rx="6"/><rect x="620" y="176" width="140" height="30" rx="6"/><rect x="620" y="218" width="140" height="30" rx="6"/></g>
<g font-size="13" fill="#f8fafc" text-anchor="middle"><text x="690" y="70">Identify objects</text><text x="690" y="112">Monitor changes</text><text x="690" y="154">Explore</text><text x="690" y="196">Wander</text><text x="690" y="238">Avoid objects</text></g>
<g stroke="#66b3ff" stroke-width="1.6" fill="none"><path d="M530 280 L530 65 L616 65" marker-end="url(#mb)"/><path d="M530 107 L616 107" marker-end="url(#mb)"/><path d="M530 149 L616 149" marker-end="url(#mb)"/><path d="M530 191 L616 191" marker-end="url(#mb)"/><path d="M530 233 L616 233" marker-end="url(#mb)"/></g>
<g stroke="#5ad4b5" stroke-width="1.6" fill="none"><path d="M760 65 L840 65"/><path d="M760 107 L840 107"/><path d="M760 149 L840 149"/><path d="M760 191 L840 191"/><path d="M760 233 L840 233"/><path d="M840 65 L840 276" marker-end="url(#mt)"/></g>
<rect x="495" y="282" width="70" height="36" rx="8" fill="#20344c" stroke="#66b3ff" stroke-width="1.8"/><text x="530" y="305" text-anchor="middle" font-size="14" fill="#f8fafc">Sense</text>
<rect x="805" y="282" width="70" height="36" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8"/><text x="840" y="305" text-anchor="middle" font-size="14" fill="#f8fafc">Act</text>
<ellipse cx="685" cy="345" rx="80" ry="26" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8"/><text x="685" y="350" text-anchor="middle" font-size="14" fill="#f8fafc">Environment</text>
<path d="M820 318 L760 336" stroke="#5ad4b5" stroke-width="1.6" fill="none" marker-end="url(#mt)"/>
<path d="M610 336 L552 320" stroke="#66b3ff" stroke-width="1.6" fill="none" marker-end="url(#mb)"/>
</g>
</svg>
