<svg width="100%" viewBox="0 0 920 470" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Braitenberg vehicles 2a and 2b</title>
<desc>2a has uncrossed sensor-motor wiring and turns away from light; 2b has crossed wiring and turns toward light.</desc>
<defs>
