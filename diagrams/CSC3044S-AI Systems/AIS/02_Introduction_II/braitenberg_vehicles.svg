<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 460" role="img">
<title>Braitenberg vehicles 2a and 2b</title>
<desc>Vehicle 2a wires each light sensor to the wheel on the same side, so it turns away from light. Vehicle 2b crosses the wires, so it turns towards light.</desc>
<defs><marker id="mw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="mt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="mc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<circle cx="450" cy="70" r="22" fill="#3d3326" stroke="#ffc778" stroke-width="2"/>
<g stroke="#ffc778" stroke-width="2" stroke-linecap="round"><line x1="450" y1="30" x2="450" y2="40"/><line x1="450" y1="100" x2="450" y2="110"/><line x1="410" y1="70" x2="420" y2="70"/><line x1="480" y1="70" x2="490" y2="70"/><line x1="423" y1="43" x2="430" y2="50"/><line x1="470" y1="90" x2="477" y2="97"/><line x1="477" y1="43" x2="470" y2="50"/><line x1="430" y1="90" x2="423" y2="97"/></g>
<text x="450" y="135" text-anchor="middle" font-size="14" fill="#ffc778">light</text>
<g>
<rect x="160" y="190" width="120" height="150" rx="10" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8"/>
<circle cx="180" cy="190" r="10" fill="#20344c" stroke="#66b3ff" stroke-width="2"/><circle cx="260" cy="190" r="10" fill="#20344c" stroke="#66b3ff" stroke-width="2"/>
<rect x="142" y="290" width="18" height="44" rx="4" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8"/><rect x="280" y="290" width="18" height="44" rx="4" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8"/>
<line x1="180" y1="200" x2="160" y2="310" stroke="#f8fafc" stroke-width="1.8"/><line x1="260" y1="200" x2="280" y2="310" stroke="#f8fafc" stroke-width="1.8"/>
<text x="220" y="372" text-anchor="middle" font-size="18" font-weight="600" fill="#f8fafc">2a</text>
<path d="M300 205 Q380 150 425 90" fill="none" stroke="#ffc778" stroke-width="1.4" stroke-dasharray="4 5"/>
<path d="M220 180 Q200 120 140 100" fill="none" stroke="#5ad4b5" stroke-width="2" marker-end="url(#mt)"/>
<text x="30" y="405" font-size="14" font-weight="600" fill="#5ad4b5">Avoid light (2a): same-side wiring</text>
<text x="30" y="425" font-size="13" fill="#f8fafc">More light to the right → right wheel faster</text>
<text x="30" y="443" font-size="13" fill="#f8fafc">→ turns left, away from the light</text>
</g>
<g>
<rect x="620" y="190" width="120" height="150" rx="10" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8"/>
<circle cx="640" cy="190" r="10" fill="#20344c" stroke="#66b3ff" stroke-width="2"/><circle cx="720" cy="190" r="10" fill="#20344c" stroke="#66b3ff" stroke-width="2"/>
<rect x="602" y="290" width="18" height="44" rx="4" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8"/><rect x="740" y="290" width="18" height="44" rx="4" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8"/>
<line x1="640" y1="200" x2="740" y2="310" stroke="#f8fafc" stroke-width="1.8"/><line x1="720" y1="200" x2="620" y2="310" stroke="#f8fafc" stroke-width="1.8"/>
<text x="680" y="372" text-anchor="middle" font-size="18" font-weight="600" fill="#f8fafc">2b</text>
<path d="M600 205 Q520 150 475 90" fill="none" stroke="#ffc778" stroke-width="1.4" stroke-dasharray="4 5"/>
<path d="M680 180 Q660 130 500 100" fill="none" stroke="#5ad4b5" stroke-width="2" marker-end="url(#mt)"/>
<text x="490" y="405" font-size="14" font-weight="600" fill="#5ad4b5">Go to light (2b): crossed wiring</text>
<text x="490" y="425" font-size="13" fill="#f8fafc">More light to the left → right wheel faster</text>
<text x="490" y="443" font-size="13" fill="#f8fafc">→ turns left, closer to the light</text>
</g>
<g font-size="12" fill="#adb9cb"><text x="305" y="250">top dots: light sensors</text><text x="305" y="268">side bars: wheels</text></g>
</g>
</svg>
