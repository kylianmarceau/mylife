<path d="M 340 200 C 340 150, 320 110, 280 80" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" stroke-dasharray="6 5" marker-end="url(#ar-w)"/>
<path d="M 590 200 C 590 150, 560 110, 520 95" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" stroke-dasharray="6 5" marker-end="url(#ar-w)"/>
<rect x="20" y="150" width="230" height="160" rx="12" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="135.0" y="235.2" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="500" fill="#f8fafc" text-anchor="middle"></text>
<text x="36" y="180" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#66b3ff" text-anchor="start">Avoid Light (2a)</text>
<text x="36" y="210" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="start">IF more light to right:</text>
<text x="36" y="234" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#f8fafc" text-anchor="start">→ right wheel turns faster</text>
<text x="36" y="258" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#f8fafc" text-anchor="start">→ turns towards the left,</text>
<text x="36" y="282" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#f8fafc" text-anchor="start">   away from the light</text>
<rect x="670" y="150" width="230" height="160" rx="12" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="785.0" y="235.2" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="500" fill="#f8fafc" text-anchor="middle"></text>
<text x="686" y="180" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#5ad4b5" text-anchor="start">Goto Light (2b)</text>
<text x="686" y="210" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="start">IF more light to left:</text>
<text x="686" y="234" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#f8fafc" text-anchor="start">→ right wheel turns faster</text>
<text x="686" y="258" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#f8fafc" text-anchor="start">→ turns towards the left,</text>
<text x="686" y="282" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#f8fafc" text-anchor="start">   closer to the light</text>
<text x="460" y="455" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#adb9cb" text-anchor="middle">Sensors (blue) wired to wheels (teal); dashed amber = excitatory (+) connection</text>
</svg>
