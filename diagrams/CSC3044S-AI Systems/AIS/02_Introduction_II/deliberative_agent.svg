<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 440" role="img">
<title>Deliberative (goal-based) agent</title>
<desc>The agent keeps internal state and models of how the world evolves and what its actions do. These combine with percepts to estimate what the world is like now and what it will be like after action A. Goals then select what action to do now.</desc>
<defs><marker id="mw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="mt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="mc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect x="20" y="20" width="640" height="400" rx="14" fill="none" stroke="#b89aff" stroke-width="2" stroke-dasharray="6 5"/>
<text x="40" y="48" font-size="16" font-weight="600" fill="#b89aff">Agent</text>
<text x="480" y="56" text-anchor="middle" font-size="15" fill="#66b3ff">Sensors</text>
<g font-size="14" fill="#f8fafc" text-anchor="middle">
<rect x="40" y="80" width="200" height="40" rx="20" fill="#3d3326" stroke="#ffc778" stroke-width="1.8"/><text x="140" y="105">State</text>
<rect x="40" y="135" width="200" height="40" rx="20" fill="#3d3326" stroke="#ffc778" stroke-width="1.8"/><text x="140" y="160">How the world evolves</text>
<rect x="40" y="190" width="200" height="40" rx="20" fill="#3d3326" stroke="#ffc778" stroke-width="1.8"/><text x="140" y="215">What my actions do</text>
<rect x="40" y="320" width="200" height="40" rx="20" fill="#302b46" stroke="#b89aff" stroke-width="1.8"/><text x="140" y="345">Goals</text>
<rect x="360" y="105" width="240" height="40" rx="20" fill="#20344c" stroke="#66b3ff" stroke-width="1.8"/><text x="480" y="130">What the world is like now</text>
<rect x="360" y="215" width="240" height="40" rx="20" fill="#20344c" stroke="#66b3ff" stroke-width="1.8"/><text x="480" y="240">What it will be like if I do A</text>
<rect x="360" y="320" width="240" height="40" rx="20" fill="#302b46" stroke="#b89aff" stroke-width="1.8"/><text x="480" y="345">What action I should do now</text>
</g>
<line x1="480" y1="64" x2="480" y2="101" stroke="#66b3ff" stroke-width="1.8" marker-end="url(#mb)"/>
<line x1="480" y1="145" x2="480" y2="211" stroke="#f8fafc" stroke-width="1.8" marker-end="url(#mw)"/>
<line x1="480" y1="255" x2="480" y2="316" stroke="#f8fafc" stroke-width="1.8" marker-end="url(#mw)"/>
<path d="M240 100 L300 100 L300 118 L356 118" fill="none" stroke="#ffc778" stroke-width="1.8" marker-end="url(#ma)"/>
<path d="M240 155 L310 155 L310 132 L356 132" fill="none" stroke="#ffc778" stroke-width="1.8" marker-end="url(#ma)"/>
<path d="M240 160 L320 160 L320 228 L356 228" fill="none" stroke="#ffc778" stroke-width="1.8" marker-end="url(#ma)"/>
<path d="M240 210 L300 210 L300 242 L356 242" fill="none" stroke="#ffc778" stroke-width="1.8" marker-end="url(#ma)"/>
<line x1="240" y1="340" x2="356" y2="340" stroke="#b89aff" stroke-width="1.8" marker-end="url(#mv)"/>
<text x="480" y="402" text-anchor="middle" font-size="15" fill="#5ad4b5">Actuators</text>
<line x1="480" y1="360" x2="480" y2="384" stroke="#5ad4b5" stroke-width="1.8" marker-end="url(#mt)"/>
<rect x="730" y="20" width="150" height="400" rx="14" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8"/>
<text x="805" y="225" text-anchor="middle" font-size="16" font-weight="600" fill="#f8fafc">Environment</text>
<path d="M730 50 L530 50" stroke="#66b3ff" stroke-width="1.8" fill="none" marker-end="url(#mb)"/>
<text x="695" y="42" text-anchor="middle" font-size="14" fill="#66b3ff">percepts</text>
<path d="M525 398 L726 398" stroke="#5ad4b5" stroke-width="1.8" fill="none" marker-end="url(#mt)"/>
<text x="695" y="388" text-anchor="middle" font-size="14" fill="#5ad4b5">action</text>
</g>
</svg>
