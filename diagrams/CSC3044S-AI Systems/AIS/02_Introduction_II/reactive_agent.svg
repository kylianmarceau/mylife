<rect x="320" y="55" width="160" height="44" rx="12" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="400.0" y="82.2" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="500" fill="#f8fafc" text-anchor="middle">Sensors</text>
