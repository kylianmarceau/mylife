<marker id="ar-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#b89aff" stroke="#b89aff" stroke-width="1" stroke-linejoin="round"/></marker>
<marker id="ar-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#5ad4b5" stroke="#5ad4b5" stroke-width="1" stroke-linejoin="round"/></marker>
<marker id="ar-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#ffc778" stroke="#ffc778" stroke-width="1" stroke-linejoin="round"/></marker>
<marker id="ar-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#adb9cb" stroke="#adb9cb" stroke-width="1" stroke-linejoin="round"/></marker>
<marker id="ar-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#ff939b" stroke="#ff939b" stroke-width="1" stroke-linejoin="round"/></marker>
</defs>
<rect x="20" y="20" width="590" height="400" rx="16" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-dasharray="7 6" vector-effect="non-scaling-stroke"/><text x="40" y="50" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#b89aff" text-anchor="start">Agent</text>
