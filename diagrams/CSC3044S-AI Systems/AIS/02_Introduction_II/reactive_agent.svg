<text x="640" y="358" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#5ad4b5" text-anchor="middle">Action</text>
