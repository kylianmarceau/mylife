<svg width="100%" viewBox="0 0 900 440" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Simple reflex (reactive) agent</title>
<desc>Percepts enter via sensors, condition-action rules choose an action, actuators act on the environment.</desc>
