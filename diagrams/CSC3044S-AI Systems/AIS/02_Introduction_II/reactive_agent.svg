<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 360" role="img">
<title>Simple reactive (reflex) agent</title>
<desc>Percepts reach sensors, which form "what the world is like now"; condition-action rules map this to "what action I should do now", sent to actuators and out as an action on the environment.</desc>
<defs><marker id="mw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="mt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="mc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect x="30" y="30" width="590" height="300" rx="14" fill="none" stroke="#b89aff" stroke-width="2" stroke-dasharray="6 5"/>
<text x="50" y="58" font-size="16" font-weight="600" fill="#b89aff">Agent</text>
<text x="370" y="70" text-anchor="middle" font-size="15" fill="#66b3ff">Sensors</text>
<rect x="260" y="95" width="220" height="44" rx="22" fill="#20344c" stroke="#66b3ff" stroke-width="1.8"/>
<text x="370" y="122" text-anchor="middle" font-size="14" fill="#f8fafc">What the world is like now</text>
<rect x="50" y="180" width="170" height="44" rx="22" fill="#302b46" stroke="#b89aff" stroke-width="1.8"/>
<text x="135" y="207" text-anchor="middle" font-size="14" fill="#f8fafc">Condition-action rules</text>
<rect x="260" y="180" width="220" height="44" rx="22" fill="#302b46" stroke="#b89aff" stroke-width="1.8"/>
<text x="370" y="207" text-anchor="middle" font-size="14" fill="#f8fafc">What action I should do now</text>
<text x="370" y="296" text-anchor="middle" font-size="15" fill="#5ad4b5">Actuators</text>
<line x1="370" y1="78" x2="370" y2="91" stroke="#66b3ff" stroke-width="1.8" marker-end="url(#mb)"/>
<line x1="370" y1="139" x2="370" y2="176" stroke="#f8fafc" stroke-width="1.8" marker-end="url(#mw)"/>
<line x1="220" y1="202" x2="256" y2="202" stroke="#b89aff" stroke-width="1.8" marker-end="url(#mv)"/>
<line x1="370" y1="224" x2="370" y2="278" stroke="#5ad4b5" stroke-width="1.8" marker-end="url(#mt)"/>
<rect x="700" y="30" width="170" height="300" rx="14" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8"/>
<text x="785" y="185" text-anchor="middle" font-size="16" font-weight="600" fill="#f8fafc">Environment</text>
<path d="M700 70 L420 70" stroke="#66b3ff" stroke-width="1.8" fill="none" marker-end="url(#mb)"/>
<text x="660" y="60" text-anchor="middle" font-size="14" fill="#66b3ff">percepts</text>
<path d="M415 292 L696 292" stroke="#5ad4b5" stroke-width="1.8" fill="none" marker-end="url(#mt)"/>
<text x="660" y="282" text-anchor="middle" font-size="14" fill="#5ad4b5">action</text>
<text x="50" y="270" font-size="13" fill="#adb9cb">No memory, no internal state,</text>
<text x="50" y="288" font-size="13" fill="#adb9cb">no goals: only the current percept</text>
</g>
</svg>
