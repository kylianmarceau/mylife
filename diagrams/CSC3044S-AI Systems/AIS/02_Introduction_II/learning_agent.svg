<rect x="40" y="340" width="200" height="42" rx="21" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8"/><text x="140" y="366">Problem generator</text>
<rect x="390" y="225" width="220" height="42" rx="21" fill="#20344c" stroke="#66b3ff" stroke-width="1.8"/><text x="500" y="251">Performance element</text>
</g>
<line x1="140" y1="92" x2="140" y2="106" stroke="#ffc778" stroke-width="1.8" marker-end="url(#ma)"/>
<line x1="140" y1="152" x2="140" y2="221" stroke="#ffc778" stroke-width="1.8" marker-end="url(#ma)"/>
<text x="152" y="192" font-size="13" fill="#ffc778">feedback</text>
