<rect x="20" y="20" width="640" height="400" rx="14" fill="none" stroke="#b89aff" stroke-width="2" stroke-dasharray="6 5"/>
<text x="40" y="48" font-size="16" font-weight="600" fill="#b89aff">Agent</text>
<text x="140" y="84" text-anchor="middle" font-size="14" fill="#ffc778">Performance standard</text>
<g font-size="14" fill="#f8fafc" text-anchor="middle">
<rect x="40" y="110" width="200" height="42" rx="21" fill="#3d3326" stroke="#ffc778" stroke-width="1.8"/><text x="140" y="136">Critic</text>
