<svg width="100%" viewBox="0 0 900 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Reactive versus deliberative paradigms</title>
<desc>Deliberative: top-down, closed world, internal models, look ahead, functional pipeline. Reactive: bottom-up, open world, model free, react to inputs, concurrent modules.</desc>
