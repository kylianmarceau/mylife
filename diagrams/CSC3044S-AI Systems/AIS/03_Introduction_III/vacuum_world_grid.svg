<text x="395" y="388" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#adb9cb" text-anchor="middle" font-weight="bold" >2</text>
