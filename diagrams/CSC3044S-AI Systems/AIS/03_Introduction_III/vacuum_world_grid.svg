<svg width="100%" viewBox="0 0 800 400" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The vacuum world grid</title>
<desc>A 3 by 3 grid with the robot at (0,0) facing north and dirt at (0,2) and (1,2); the rule route goes north up column 0 then east along the top row.</desc>
<defs><marker id="arrow-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="120" y1="30" x2="450" y2="30" stroke="#adb9cb" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<line x1="120" y1="30" x2="120" y2="360" stroke="#adb9cb" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
