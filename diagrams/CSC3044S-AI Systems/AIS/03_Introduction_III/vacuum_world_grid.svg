<text x="490" y="70" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="start" font-weight="normal" >Start: In(0,0), Facing(north)</text>
<text x="490" y="96" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#ff939b" text-anchor="start" font-weight="normal" >Dirt(0,2), Dirt(1,2)</text>
<text x="490" y="122" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" text-anchor="start" font-weight="normal" >Ac = {turn, forward, suck}</text>
<text x="490" y="146" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="start" font-weight="normal" >"turn" = turn right</text>
<line x1="490" y1="182" x2="530" y2="182" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-dasharray="6 5"/>
<text x="540" y="187" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ffc778" text-anchor="start" font-weight="normal" >route the rules ρ produce:</text>
<text x="540" y="206" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ffc778" text-anchor="start" font-weight="normal" >north up column 0,</text>
<text x="540" y="225" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ffc778" text-anchor="start" font-weight="normal" >then east along the top row</text>
<text x="490" y="268" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#5ad4b5" text-anchor="start" font-weight="bold" >Goal: clear up all dirt</text>
