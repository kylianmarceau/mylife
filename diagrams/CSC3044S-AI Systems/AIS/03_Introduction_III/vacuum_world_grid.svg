<line x1="120" y1="360" x2="450" y2="360" stroke="#adb9cb" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<line x1="450" y1="30" x2="450" y2="360" stroke="#adb9cb" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
