<svg width="100%" viewBox="0 0 900 510" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Agent equals model plus harness</title>
<desc>Inputs pass through context assembly and tool access to the LLM; output validation and action routing govern actions (execute, review, escalate); observability spans every stage.</desc>
