<svg width="100%" viewBox="0 0 900 440" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The agent harness loop</title>
<desc>The harness runs the model; if a tool call is requested the harness executes it, appends the result to the context and runs the model again until the task is done. Memory and permissions span the loop.</desc>
<defs><marker id="arrow-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="60" width="210" height="75" rx="10" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="145.0" y="91.5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#b89aff" text-anchor="middle" font-weight="bold" >Run model</text>
<text x="145.0" y="113.5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle" font-weight="normal" >on current context</text>
<rect x="330" y="60" width="230" height="75" rx="10" fill="#3d3326" stroke="#ffc778" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="445.0" y="91.5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#ffc778" text-anchor="middle" font-weight="bold" >Tool call</text>
<text x="445.0" y="113.5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle" font-weight="normal" >requested by model?</text>
<rect x="640" y="60" width="220" height="75" rx="10" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="750.0" y="91.5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#66b3ff" text-anchor="middle" font-weight="bold" >Harness executes</text>
<text x="750.0" y="113.5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle" font-weight="normal" >the tool (not the model)</text>
<rect x="640" y="210" width="220" height="75" rx="10" fill="#1b3835" stroke="#5ad4b5" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="750.0" y="241.5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#5ad4b5" text-anchor="middle" font-weight="bold" >Append result</text>
<text x="750.0" y="263.5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle" font-weight="normal" >to the context</text>
<rect x="330" y="200" width="230" height="60" rx="10" fill="#272f3b" stroke="#adb9cb" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="445.0" y="224.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#adb9cb" text-anchor="middle" font-weight="bold" >Task done</text>
<text x="445.0" y="246.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle" font-weight="normal" >return result</text>
<line x1="250" y1="97" x2="328" y2="97" stroke="#f8fafc" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#arrow-white)"/>
<line x1="560" y1="97" x2="638" y2="97" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#arrow-blue)"/>
<text x="599" y="88" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#66b3ff" text-anchor="middle" font-weight="normal" >yes</text>
<line x1="445" y1="135" x2="445" y2="198" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#arrow-muted)"/>
<text x="458" y="172" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="start" font-weight="normal" >no</text>
<line x1="750" y1="135" x2="750" y2="208" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#arrow-teal)"/>
<path d="M750 285 V320 H145 V137" fill="none" stroke="#b89aff" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#arrow-violet)"/>
<text x="450" y="312" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#b89aff" text-anchor="middle" font-weight="normal" >run the model again (repeat until done)</text>
<rect x="40" y="350" width="390" height="70" rx="10" fill="#3d3326" stroke="#ffc778" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="235.0" y="379.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#ffc778" text-anchor="middle" font-weight="bold" >Memory</text>
<text x="235.0" y="401.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle" font-weight="normal" >carries state across many loop iterations</text>
<rect x="470" y="350" width="390" height="70" rx="10" fill="#3f2a33" stroke="#ff939b" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="665.0" y="379.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#ff939b" text-anchor="middle" font-weight="bold" >Permissions</text>
<text x="665.0" y="401.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" text-anchor="middle" font-weight="normal" >what the agent may do without asking</text>
<text x="450" y="30" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="bold" >The harness loop: the model decides, the harness executes</text>
</svg>
