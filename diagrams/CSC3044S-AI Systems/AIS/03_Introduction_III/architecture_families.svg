<text x="220" y="197" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="bold" >Agents</text>
<ellipse cx="682" cy="200" rx="105" ry="50" fill="#3d3326" stroke="#ffc778" stroke-width="2"/>
<text x="682" y="197" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="bold" >Hybrid</text>
