<svg width="100%" viewBox="0 0 900 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Families of agent architectures and rationality</title>
<desc>Agent architectures branch into reactive, deliberative, hybrid, multi-agent systems and neuro-agents. All lie inside a Rational boundary; hybrid and neuro-agents are also enclosed by an Irrational? boundary.</desc>
<defs><marker id="arrow-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="20" width="820" height="520" rx="30" fill="none" stroke="#5ad4b5" stroke-width="2" stroke-dasharray="7 6"/>
<text x="70" y="52" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" fill="#5ad4b5" text-anchor="start" font-weight="bold" >Rational</text>
<rect x="565" y="95" width="235" height="430" rx="60" fill="none" stroke="#ff939b" stroke-width="2" stroke-dasharray="7 6"/>
<text x="682" y="125" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#ff939b" text-anchor="middle" font-weight="bold" >Irrational?</text>
