<svg width="100%" viewBox="0 0 900 410" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Reactive agent architecture</title>
<desc>Sensors feed a set of stimulus-response behaviours, each mapping a state to an action; actions go to the effectors.</desc>
