<svg width="100%" viewBox="0 0 900 300" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Deliberative agent architecture</title>
<desc>Sensors update a world model, a planner builds a plan, and a plan executor drives the effectors: sense, plan, act.</desc>
<defs><marker id="arrow-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="110" y="20" width="680" height="260" rx="28" fill="none" stroke="#adb9cb" stroke-width="2"/>
<text x="140" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#adb9cb" text-anchor="start" font-weight="bold" >Agent</text>
<rect x="140" y="60" width="50" height="200" rx="6" fill="#20344c" stroke="#66b3ff" stroke-width="2"/>
<text x="165" y="160.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="bold" transform="rotate(-90 165 160.0)" dominant-baseline="middle">Sensors</text>
<rect x="710" y="60" width="50" height="200" rx="6" fill="#1b3835" stroke="#5ad4b5" stroke-width="2"/>
<text x="735" y="160.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="bold" transform="rotate(-90 735 160.0)" dominant-baseline="middle">Effectors</text>
<rect x="225" y="120" width="130" height="80" rx="8" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="290" y="156" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="bold" >World</text>
<text x="290" y="177" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="bold" >Model</text>
<rect x="385" y="120" width="130" height="80" rx="8" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="450" y="166" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="bold" >Planner</text>
<rect x="545" y="120" width="130" height="80" rx="8" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="610" y="156" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="bold" >Plan</text>
<text x="610" y="177" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="bold" >executor</text>
<line x1="190" y1="160" x2="223" y2="160" stroke="#f8fafc" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#arrow-white)"/>
<line x1="355" y1="160" x2="383" y2="160" stroke="#f8fafc" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#arrow-white)"/>
<line x1="515" y1="160" x2="543" y2="160" stroke="#f8fafc" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#arrow-white)"/>
<line x1="675" y1="160" x2="708" y2="160" stroke="#f8fafc" stroke-width="1.8" vector-effect="non-scaling-stroke" marker-end="url(#arrow-white)"/>
<line x1="20" y1="160" x2="138" y2="160" stroke="#66b3ff" stroke-width="2.4" vector-effect="non-scaling-stroke" marker-end="url(#arrow-blue)"/>
<text x="60" y="147" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#66b3ff" text-anchor="middle" font-weight="normal" >percepts</text>
<line x1="760" y1="160" x2="880" y2="160" stroke="#5ad4b5" stroke-width="2.4" vector-effect="non-scaling-stroke" marker-end="url(#arrow-teal)"/>
<text x="840" y="147" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5ad4b5" text-anchor="middle" font-weight="normal" >actions</text>
<text x="290" y="232" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#66b3ff" text-anchor="middle" font-weight="bold" >sense</text>
<text x="450" y="232" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#b89aff" text-anchor="middle" font-weight="bold" >plan</text>
<text x="610" y="232" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#b89aff" text-anchor="middle" font-weight="bold" >act</text>
</svg>
