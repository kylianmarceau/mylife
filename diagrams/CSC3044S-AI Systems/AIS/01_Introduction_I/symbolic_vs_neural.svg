<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 400" role="img">
<title>Symbolic (top-down) versus neural (bottom-up) AI</title>
<desc>Left: a game tree expanded top-down by explicit rules. Right: a layered neural network where behaviour emerges bottom-up from connections.</desc>
<defs>
<marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round"/></marker>
<marker id="mt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round"/></marker>
</defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="225" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#b89aff">Symbolic AI: top-down</text>
<text x="225" y="56" text-anchor="middle" font-size="13" fill="#adb9cb">logic, rules, search over explicit states</text>
<g stroke="#b89aff" stroke-width="1.6" fill="none">
<line x1="225" y1="95" x2="125" y2="175"/><line x1="225" y1="95" x2="325" y2="175"/>
<line x1="125" y1="175" x2="70" y2="260"/><line x1="125" y1="175" x2="125" y2="260"/><line x1="125" y1="175" x2="180" y2="260"/>
<line x1="325" y1="175" x2="270" y2="260"/><line x1="325" y1="175" x2="325" y2="260"/><line x1="325" y1="175" x2="380" y2="260"/>
</g>
<g fill="#302b46" stroke="#b89aff" stroke-width="1.6">
<rect x="210" y="80" width="30" height="30" rx="4"/><rect x="110" y="160" width="30" height="30" rx="4"/><rect x="310" y="160" width="30" height="30" rx="4"/>
<rect x="58" y="250" width="24" height="24" rx="4"/><rect x="113" y="250" width="24" height="24" rx="4"/><rect x="168" y="250" width="24" height="24" rx="4"/>
<rect x="258" y="250" width="24" height="24" rx="4"/><rect x="313" y="250" width="24" height="24" rx="4"/><rect x="368" y="250" width="24" height="24" rx="4"/>
</g>
<line x1="30" y1="90" x2="30" y2="270" stroke="#b89aff" stroke-width="1.6" marker-end="url(#mv)"/>
<text x="225" y="320" text-anchor="middle" font-size="13" fill="#f8fafc">Designer writes the rules;</text>
<text x="225" y="340" text-anchor="middle" font-size="13" fill="#f8fafc">the agent reasons down the tree</text>
<line x1="450" y1="30" x2="450" y2="370" stroke="#adb9cb" stroke-width="1" stroke-dasharray="4 5"/>
<text x="675" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#5ad4b5">Neural AI: bottom-up</text>
<text x="675" y="56" text-anchor="middle" font-size="13" fill="#adb9cb">connectionist, neuro-inspired</text>
<g stroke="#5ad4b5" stroke-width="1" stroke-opacity="0.6">
<line x1="560" y1="110" x2="675" y2="95"/><line x1="560" y1="110" x2="675" y2="165"/><line x1="560" y1="110" x2="675" y2="235"/>
<line x1="560" y1="180" x2="675" y2="95"/><line x1="560" y1="180" x2="675" y2="165"/><line x1="560" y1="180" x2="675" y2="235"/>
<line x1="560" y1="250" x2="675" y2="95"/><line x1="560" y1="250" x2="675" y2="165"/><line x1="560" y1="250" x2="675" y2="235"/>
<line x1="675" y1="95" x2="790" y2="140"/><line x1="675" y1="165" x2="790" y2="140"/><line x1="675" y1="235" x2="790" y2="140"/>
<line x1="675" y1="95" x2="790" y2="210"/><line x1="675" y1="165" x2="790" y2="210"/><line x1="675" y1="235" x2="790" y2="210"/>
</g>
<g fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8">
<circle cx="560" cy="110" r="14"/><circle cx="560" cy="180" r="14"/><circle cx="560" cy="250" r="14"/>
<circle cx="675" cy="95" r="14"/><circle cx="675" cy="165" r="14"/><circle cx="675" cy="235" r="14"/>
<circle cx="790" cy="140" r="14"/><circle cx="790" cy="210" r="14"/>
</g>
<line x1="870" y1="270" x2="870" y2="90" stroke="#5ad4b5" stroke-width="1.6" marker-end="url(#mt)"/>
<text x="675" y="320" text-anchor="middle" font-size="13" fill="#f8fafc">Simple units + learned weights;</text>
<text x="675" y="340" text-anchor="middle" font-size="13" fill="#f8fafc">behaviour emerges from data</text>
</g>
</svg>
