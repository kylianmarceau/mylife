<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 430" role="img">
<title>Dynamic vehicle routing</title>
<desc>A depot serves static customers known at t=0 (C1, C2, C3, C4, C5, C6) and dynamic customers that appear at t>0 (C7, C8). Solid arrows are the initial route plan; dashed arrows are new route segments inserted for dynamic customers.</desc>
<defs>
<marker id="mw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round"/></marker>
<marker id="mc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round"/></marker>
</defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<g stroke="#f8fafc" stroke-width="1.8" fill="none">
<line x1="407" y1="188" x2="200" y2="94" marker-end="url(#mw)"/>
<line x1="186" y1="98" x2="122" y2="236" marker-end="url(#mw)"/>
<line x1="125" y1="256" x2="268" y2="302" marker-end="url(#mw)"/>
<line x1="296" y1="292" x2="402" y2="214" marker-end="url(#mw)"/>
<line x1="448" y1="190" x2="497" y2="102" marker-end="url(#mw)"/>
<line x1="515" y1="85" x2="680" y2="58" marker-end="url(#mw)"/>
<line x1="680" y1="68" x2="530" y2="255" marker-end="url(#mw)"/>
<line x1="510" y1="255" x2="446" y2="215" marker-end="url(#mw)"/>
</g>
<g stroke="#ff939b" stroke-width="1.8" stroke-dasharray="6 5" fill="none">
<line x1="196" y1="96" x2="232" y2="160" marker-end="url(#mc)"/>
<line x1="230" y1="182" x2="140" y2="243" marker-end="url(#mc)"/>
<line x1="533" y1="262" x2="636" y2="252" marker-end="url(#mc)"/>
<line x1="636" y1="242" x2="682" y2="78" marker-end="url(#mc)"/>
</g>
<rect x="400" y="185" width="56" height="34" rx="6" fill="#3d3326" stroke="#ffc778" stroke-width="1.8"/>
<text x="428" y="207" text-anchor="middle" font-size="13" font-weight="600" fill="#f8fafc">Depot</text>
<g fill="#20344c" stroke="#66b3ff" stroke-width="2">
<circle cx="190" cy="88" r="9"/><circle cx="117" cy="248" r="9"/><circle cx="282" cy="302" r="9"/><circle cx="505" cy="88" r="9"/><circle cx="690" cy="58" r="9"/><circle cx="520" cy="260" r="9"/>
</g>
<g fill="#3f2a33" stroke="#ff939b" stroke-width="2"><circle cx="240" cy="172" r="9"/><circle cx="645" cy="248" r="9"/></g>
<g font-size="14" fill="#f8fafc">
<text x="168" y="78">C3</text><text x="88" y="276">C2</text><text x="276" y="330">C1</text><text x="490" y="74">C4</text><text x="704" y="54">C5</text><text x="510" y="290">C6</text><text x="254" y="178">C8</text><text x="660" y="262">C7</text>
</g>
<g font-size="13" fill="#adb9cb">
<circle cx="90" cy="372" r="7" fill="#20344c" stroke="#66b3ff" stroke-width="2"/><text x="105" y="377">Static customer (known at t = 0)</text>
<circle cx="90" cy="400" r="7" fill="#3f2a33" stroke="#ff939b" stroke-width="2"/><text x="105" y="405">Dynamic customer (appears at t &gt; 0)</text>
<line x1="470" y1="372" x2="520" y2="372" stroke="#f8fafc" stroke-width="1.8" marker-end="url(#mw)"/><text x="532" y="377">Initial route plan</text>
<line x1="470" y1="400" x2="520" y2="400" stroke="#ff939b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#mc)"/><text x="532" y="405">New route segment</text>
</g>
</g>
</svg>
