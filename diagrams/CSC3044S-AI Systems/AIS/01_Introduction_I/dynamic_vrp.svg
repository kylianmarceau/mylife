<circle cx="610" cy="330" r="14" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="610" y="368" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="600">C6</text>
<circle cx="790" cy="300" r="14" fill="#3d3326" stroke="#ffc778" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="826" y="305" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="600">C7</text>
<circle cx="60" cy="420" r="9" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="78" y="425" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb" text-anchor="start" font-weight="normal">Static customer (known at t = 0)</text>
<circle cx="60" cy="452" r="9" fill="#3d3326" stroke="#ffc778" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="78" y="457" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb" text-anchor="start" font-weight="normal">Dynamic customer (appears at t > 0)</text>
<line x1="500.0" y1="420.0" x2="560.0" y2="420.0" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-white)"/>
<text x="575" y="425" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb" text-anchor="start" font-weight="normal">Initial route plan</text>
<line x1="500.0" y1="452.0" x2="560.0" y2="452.0" stroke="#ffc778" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-amber)" stroke-dasharray="8 5"/>
<text x="575" y="457" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb" text-anchor="start" font-weight="normal">New route segment</text>
</svg>
