<svg width="100%" viewBox="0 0 880 470" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Dynamic vehicle routing problem</title>
<desc>Two vehicle routes leave and return to a depot serving static customers C1 to C6; dynamic customers C7 and C8 appear later and are inserted with new route segments.</desc>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<line x1="429.0" y1="246.7" x2="349.9" y2="347.4" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-white)"/>
<line x1="324.4" y1="356.3" x2="105.6" y2="303.7" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-white)"/>
<line x1="97.4" y1="285.8" x2="192.6" y2="104.2" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-white)"/>
<line x1="214.2" y1="97.4" x2="419.8" y2="204.3" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-white)"/>
<line x1="474.0" y1="196.0" x2="548.7" y2="121.3" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-white)"/>
<line x1="575.6" y1="106.6" x2="774.4" y2="63.4" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-white)"/>
<line x1="781.1" y1="73.3" x2="618.9" y2="316.7" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-white)"/>
<line x1="596.8" y1="320.9" x2="478.0" y2="239.3" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-white)"/>
<line x1="104.5" y1="293.2" x2="225.5" y2="236.8" stroke="#ffc778" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-amber)" stroke-dasharray="8 5"/>
<line x1="235.6" y1="214.6" x2="204.4" y2="105.4" stroke="#ffc778" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-amber)" stroke-dasharray="8 5"/>
<line x1="790.0" y1="76.0" x2="790.0" y2="284.0" stroke="#ffc778" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-amber)" stroke-dasharray="8 5"/>
<line x1="774.2" y1="302.6" x2="625.8" y2="327.4" stroke="#ffc778" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-amber)" stroke-dasharray="8 5"/>
