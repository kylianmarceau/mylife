<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 520" role="img">
<title>AI draws on many disciplines</title>
<desc>Overlapping fields: computer science, statistics, psychology, neuroscience, philosophy, machine learning, with AI at their overlap, and the method each field contributed.</desc>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="450" y="34" text-anchor="middle" font-size="21" font-weight="600" fill="#66b3ff">AI sits at the overlap of many fields</text>
<circle cx="370" cy="245" r="105" fill="#20344c" fill-opacity="0.55" stroke="#66b3ff" stroke-width="1.8"/>
<circle cx="530" cy="245" r="105" fill="#3d3326" fill-opacity="0.55" stroke="#ffc778" stroke-width="1.8"/>
<circle cx="450" cy="170" r="105" fill="#3f2a33" fill-opacity="0.55" stroke="#ff939b" stroke-width="1.8"/>
<circle cx="400" cy="345" r="105" fill="#1b3835" fill-opacity="0.55" stroke="#5ad4b5" stroke-width="1.8"/>
<circle cx="500" cy="345" r="105" fill="#302b46" fill-opacity="0.55" stroke="#b89aff" stroke-width="1.8"/>
<text x="300" y="215" text-anchor="middle" font-size="14" fill="#f8fafc">Computer</text>
<text x="300" y="232" text-anchor="middle" font-size="14" fill="#f8fafc">Science</text>
<text x="600" y="223" text-anchor="middle" font-size="14" fill="#f8fafc">Statistics</text>
<text x="450" y="115" text-anchor="middle" font-size="14" fill="#f8fafc">Psychology</text>
<text x="345" y="400" text-anchor="middle" font-size="14" fill="#f8fafc">Philosophy</text>
<text x="555" y="400" text-anchor="middle" font-size="14" fill="#f8fafc">Neuroscience</text>
<rect x="390" y="253" width="120" height="50" rx="10" fill="#272f3b" stroke="#f8fafc" stroke-width="1.6"/>
<text x="450" y="274" text-anchor="middle" font-size="14" font-weight="600" fill="#f8fafc">AI + Machine</text>
<text x="450" y="292" text-anchor="middle" font-size="14" font-weight="600" fill="#f8fafc">Learning</text>
<g font-size="13" fill="#adb9cb">
<text x="20" y="470">Bayes rule ← probability</text>
<text x="20" y="494">Game theory ← maths, economics</text>
<text x="330" y="470">SGD ← statistics</text>
<text x="330" y="494">Value iteration ← control theory</text>
<text x="620" y="470">TD learning ← psychology</text>
<text x="620" y="494">Neural networks ← neuroscience</text>
</g>
</g>
</svg>
