<text x="260" y="271" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="600">Actuators</text>
<line x1="260.0" y1="122.0" x2="260.0" y2="153.0" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-white)"/>
<line x1="260.0" y1="207.0" x2="260.0" y2="238.0" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-white)"/>
