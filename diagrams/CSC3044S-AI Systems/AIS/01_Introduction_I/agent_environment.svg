<svg width="100%" viewBox="0 0 860 360" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Agent-environment loop</title>
<desc>The environment sends percepts to the agent's sensors; an unknown decision component maps them to actuators, which send actions back to the environment.</desc>
<defs>
