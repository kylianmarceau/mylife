<line x1="598.0" y1="95.0" x2="353.0" y2="95.0" stroke="#66b3ff" stroke-width="2.2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-blue)"/>
<text x="475" y="84" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#66b3ff" text-anchor="middle" font-weight="600">Percepts</text>
<line x1="353.0" y1="265.0" x2="598.0" y2="265.0" stroke="#5ad4b5" stroke-width="2.2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-teal)"/>
<text x="475" y="254" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#5ad4b5" text-anchor="middle" font-weight="600">Actions</text>
</svg>
