<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 340" role="img">
<title>Agent perceiving and acting in an environment</title>
<desc>Environment sends percepts to the agent's sensors; an unknown decision process maps to actuators, which send actions back to the environment.</desc>
<defs>
<marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round"/></marker>
<marker id="mt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round"/></marker>
<marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round"/></marker>
</defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect x="60" y="40" width="360" height="260" rx="14" fill="none" stroke="#b89aff" stroke-width="2" stroke-dasharray="6 5"/>
<text x="80" y="66" font-size="16" font-weight="600" fill="#b89aff">Agent</text>
<rect x="170" y="70" width="160" height="50" rx="10" fill="#20344c" stroke="#66b3ff" stroke-width="1.8"/>
<text x="250" y="101" text-anchor="middle" font-size="15" fill="#f8fafc">Sensors</text>
<rect x="190" y="145" width="120" height="50" rx="10" fill="#302b46" stroke="#b89aff" stroke-width="1.8"/>
<text x="250" y="177" text-anchor="middle" font-size="22" font-weight="600" fill="#f8fafc">?</text>
<rect x="170" y="220" width="160" height="50" rx="10" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8"/>
<text x="250" y="251" text-anchor="middle" font-size="15" fill="#f8fafc">Actuators</text>
<line x1="250" y1="120" x2="250" y2="141" stroke="#b89aff" stroke-width="1.8" marker-end="url(#mv)"/>
<line x1="250" y1="195" x2="250" y2="216" stroke="#b89aff" stroke-width="1.8" marker-end="url(#mv)"/>
<rect x="640" y="40" width="200" height="260" rx="14" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8"/>
<text x="740" y="176" text-anchor="middle" font-size="18" font-weight="600" fill="#f8fafc">Environment</text>
<path d="M640 95 L334 95" stroke="#66b3ff" stroke-width="2" fill="none" marker-end="url(#mb)"/>
<text x="490" y="85" text-anchor="middle" font-size="14" fill="#66b3ff">percepts</text>
<path d="M330 245 L636 245" stroke="#5ad4b5" stroke-width="2" fill="none" marker-end="url(#mt)"/>
<text x="490" y="235" text-anchor="middle" font-size="14" fill="#5ad4b5">actions</text>
<text x="490" y="168" text-anchor="middle" font-size="13" fill="#adb9cb">The “?” is the agent</text>
<text x="490" y="186" text-anchor="middle" font-size="13" fill="#adb9cb">program: how percepts</text>
<text x="490" y="204" text-anchor="middle" font-size="13" fill="#adb9cb">become actions</text>
</g>
</svg>
