<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 290" role="img">
<title>One-dimensional bin packing</title>
<desc>Items of different sizes are packed into fixed-capacity bins; the goal is the minimum number of bins.</desc>
<defs><marker id="mw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="200" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#66b3ff">n items of different sizes</text>
<g stroke-width="1.6">
<rect x="70" y="70" width="40" height="40" fill="#20344c" stroke="#66b3ff"/><rect x="120" y="70" width="40" height="80" fill="#3d3326" stroke="#ffc778"/><rect x="170" y="70" width="40" height="60" fill="#3f2a33" stroke="#ff939b"/>
<rect x="220" y="70" width="40" height="30" fill="#1b3835" stroke="#5ad4b5"/><rect x="270" y="70" width="40" height="100" fill="#302b46" stroke="#b89aff"/>
<rect x="70" y="160" width="40" height="50" fill="#1b3835" stroke="#5ad4b5"/><rect x="120" y="170" width="40" height="40" fill="#20344c" stroke="#66b3ff"/><rect x="170" y="150" width="40" height="70" fill="#3d3326" stroke="#ffc778"/>
<rect x="220" y="120" width="40" height="40" fill="#3f2a33" stroke="#ff939b"/><rect x="270" y="190" width="40" height="30" fill="#20344c" stroke="#66b3ff"/>
</g>
<rect x="350" y="70" width="44" height="150" fill="none" stroke="#adb9cb" stroke-width="1.8"/>
<text x="372" y="245" text-anchor="middle" font-size="13" fill="#adb9cb">bin capacity</text>
<line x1="420" y1="145" x2="500" y2="145" stroke="#f8fafc" stroke-width="2" marker-end="url(#mw)"/>
<text x="690" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#5ad4b5">Packed into as few bins as possible</text>
<g stroke-width="1.6">
<rect x="540" y="70" width="44" height="150" fill="none" stroke="#adb9cb"/><rect x="542" y="120" width="40" height="100" fill="#302b46" stroke="#b89aff"/><rect x="542" y="80" width="40" height="40" fill="#20344c" stroke="#66b3ff"/>
<rect x="600" y="70" width="44" height="150" fill="none" stroke="#adb9cb"/><rect x="602" y="140" width="40" height="80" fill="#3d3326" stroke="#ffc778"/><rect x="602" y="80" width="40" height="60" fill="#3f2a33" stroke="#ff939b"/>
<rect x="660" y="70" width="44" height="150" fill="none" stroke="#adb9cb"/><rect x="662" y="150" width="40" height="70" fill="#3d3326" stroke="#ffc778"/><rect x="662" y="100" width="40" height="50" fill="#1b3835" stroke="#5ad4b5"/><rect x="662" y="70" width="40" height="30" fill="#1b3835" stroke="#5ad4b5"/>
<rect x="720" y="70" width="44" height="150" fill="none" stroke="#adb9cb"/><rect x="722" y="180" width="40" height="40" fill="#20344c" stroke="#66b3ff"/><rect x="722" y="140" width="40" height="40" fill="#3f2a33" stroke="#ff939b"/><rect x="722" y="110" width="40" height="30" fill="#20344c" stroke="#66b3ff"/>
</g>
<text x="690" y="250" text-anchor="middle" font-size="14" fill="#ffc778">Is this the minimum number of bins?</text>
<text x="690" y="270" text-anchor="middle" font-size="13" fill="#adb9cb">easy to check a packing, hard to prove it is optimal</text>
</g>
</svg>
