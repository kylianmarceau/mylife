<svg width="100%" viewBox="0 0 900 390" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Bin packing</title>
<desc>Thirteen items of different sizes are packed into six fixed-capacity bins, raising the question of whether six is the minimum.</desc>
