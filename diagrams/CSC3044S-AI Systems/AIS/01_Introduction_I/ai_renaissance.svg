<svg width="100%" viewBox="0 0 900 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The AI renaissance</title>
<desc>Symbolic AI, neural AI and tools from other fields (optimization, algorithms, probabilistic inference, statistics, game theory) combine to produce agents.</desc>
