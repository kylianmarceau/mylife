<svg width="100%" viewBox="0 0 900 320" role="img" xmlns="http://www.w3.org/2000/svg">
<title>A brief history of agents</title>
<desc>Timeline: symbolic reasoning agents from the 1950s, reactive agents from the 1980s, hybrid agents from the 1990s and neuro (cognitive) agents from the 2000s, all continuing to the present.</desc>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<line x1="90.0" y1="280.0" x2="880.0" y2="280.0" stroke="#f8fafc" stroke-width="1.8" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-white)"/>
<line x1="120.0" y1="274.0" x2="120.0" y2="286.0" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<text x="120" y="306" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal">1950s</text>
<line x1="210.0" y1="274.0" x2="210.0" y2="286.0" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<text x="210" y="306" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal">1960s</text>
<line x1="300.0" y1="274.0" x2="300.0" y2="286.0" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<text x="300" y="306" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal">1970s</text>
<line x1="390.0" y1="274.0" x2="390.0" y2="286.0" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<text x="390" y="306" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal">1980s</text>
<line x1="480.0" y1="274.0" x2="480.0" y2="286.0" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<text x="480" y="306" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal">1990s</text>
<line x1="570.0" y1="274.0" x2="570.0" y2="286.0" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<text x="570" y="306" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal">2000s</text>
<line x1="660.0" y1="274.0" x2="660.0" y2="286.0" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<text x="660" y="306" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal">2010s</text>
<line x1="750.0" y1="274.0" x2="750.0" y2="286.0" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<text x="750" y="306" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal">2020s</text>
<text x="855" y="306" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="normal">present</text>
<rect x="120" y="30" width="720" height="40" rx="8" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<line x1="840.0" y1="50.0" x2="872.0" y2="50.0" stroke="#b89aff" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-violet)"/>
<text x="134" y="56" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="start" font-weight="600">Symbolic reasoning agents</text>
<text x="825" y="56" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#b89aff" text-anchor="end" font-weight="normal">explicit logical reasoning via symbols</text>
<rect x="390" y="90" width="450" height="40" rx="8" fill="#3f2a33" stroke="#ff939b" stroke-width="2" vector-effect="non-scaling-stroke"/>
<line x1="840.0" y1="110.0" x2="872.0" y2="110.0" stroke="#ff939b" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-coral)"/>
<text x="404" y="116" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="start" font-weight="600">Reactive agents</text>
<text x="825" y="116" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ff939b" text-anchor="end" font-weight="normal">answer to symbolic-reasoning problems</text>
<rect x="480" y="150" width="360" height="40" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="2" vector-effect="non-scaling-stroke"/>
<line x1="840.0" y1="170.0" x2="872.0" y2="170.0" stroke="#5ad4b5" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-teal)"/>
<text x="494" y="176" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="start" font-weight="600">Hybrid agents</text>
<text x="825" y="176" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5ad4b5" text-anchor="end" font-weight="normal">reasoning + reactive combined</text>
<rect x="570" y="210" width="270" height="40" rx="8" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<line x1="840.0" y1="230.0" x2="872.0" y2="230.0" stroke="#66b3ff" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#a-blue)"/>
<text x="584" y="236" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="start" font-weight="600">Neuro (cognitive) agents ?</text>
</svg>
