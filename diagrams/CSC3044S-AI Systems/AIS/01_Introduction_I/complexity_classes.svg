<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 480" role="img">
<title>Relationship between P, NP, NP-complete and NP-hard (assuming P ≠ NP)</title>
<desc>P sits inside NP. NP-hard is the upper region; where it overlaps NP is NP-complete. Part of NP-hard lies outside NP. Complexity increases upward.</desc>
<defs><marker id="mw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<ellipse cx="380" cy="320" rx="200" ry="120" fill="#20344c" stroke="#66b3ff" stroke-width="2"/>
<path d="M150 262 Q380 242 610 262 L610 52 Q610 32 590 32 L170 32 Q150 32 150 52 Z" fill="#3f2a33" fill-opacity="0.7" stroke="#ff939b" stroke-width="2"/>
<text x="380" y="110" text-anchor="middle" font-size="18" font-weight="600" fill="#ff939b">NP-hard</text>
<text x="380" y="134" text-anchor="middle" font-size="13" fill="#adb9cb">(the part outside NP is not even verifiable quickly)</text>
<text x="380" y="232" text-anchor="middle" font-size="15" font-weight="600" fill="#ffc778">NP-complete</text>
<text x="230" y="320" font-size="18" font-weight="600" fill="#66b3ff">NP</text>
<ellipse cx="400" cy="350" rx="70" ry="45" fill="#1b3835" stroke="#5ad4b5" stroke-width="2"/>
<text x="400" y="356" text-anchor="middle" font-size="18" font-weight="600" fill="#5ad4b5">P</text>
<line x1="80" y1="420" x2="80" y2="50" stroke="#f8fafc" stroke-width="1.6" marker-end="url(#mw)"/>
<text x="62" y="235" text-anchor="middle" font-size="14" fill="#adb9cb" transform="rotate(-90 62 235)">complexity</text>
<g font-size="13" fill="#f8fafc">
<text x="640" y="100">NP-hard: at least as hard as</text><text x="640" y="118">NP-complete; may not be in NP</text><text x="640" y="136" fill="#adb9cb">e.g. Vehicle Routing Problem</text>
<text x="640" y="220">NP-complete = NP ∩ NP-hard</text><text x="640" y="238" fill="#adb9cb">e.g. Boolean satisfiability</text>
<text x="640" y="300">NP: solutions verifiable</text><text x="640" y="318">in polynomial time</text>
<text x="640" y="360">P: solvable in</text><text x="640" y="378">polynomial time</text>
</g>
<text x="380" y="472" text-anchor="middle" font-size="13" fill="#adb9cb">Drawn assuming P ≠ NP (still unproven)</text>
</g>
</svg>
