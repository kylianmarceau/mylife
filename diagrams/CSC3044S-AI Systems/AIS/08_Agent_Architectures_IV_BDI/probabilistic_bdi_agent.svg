<svg width="100%" viewBox="0 0 900 470" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Probabilistic BDI grower agent</title>
<desc>The environment is sensed to give percepts, which drive belief revision. Revised beliefs and the set of desires feed intention selection, and the selected intention is output as an action in the environment. Belief revision and intention selection are implemented by a dynamic decision network.</desc>
