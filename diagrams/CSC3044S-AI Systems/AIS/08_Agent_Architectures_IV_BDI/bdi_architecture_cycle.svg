<svg width="100%" viewBox="0 0 900 500" role="img" xmlns="http://www.w3.org/2000/svg">
<title>BDI agent architecture: sense, revise beliefs, plan, act</title>
<desc>Observations enter the sense stage, are used to revise the beliefs and goals store, the planner uses beliefs and goals to produce a plan, actuators execute it as actions, and the results feed back into sensing.</desc>
<defs>
<marker id="bc-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="bc-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="bc-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="bc-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<circle cx="450" cy="290" r="190" fill="none" stroke="#adb9cb" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<circle cx="450" cy="130" r="75" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="450" y="104" fill="#ffc778" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1. Sense</text>
<circle cx="450" cy="148" r="14" fill="#272f3b" stroke="#adb9cb" stroke-width="1.6"/>
<line x1="170" y1="110" x2="374" y2="110" stroke="#66b3ff" stroke-width="2.4" marker-end="url(#bc-blue)" vector-effect="non-scaling-stroke"/>
<text x="270" y="96" fill="#66b3ff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600" letter-spacing="1" text-anchor="middle">OBSERVATIONS</text>
<path d="M 436 152 C 390 170, 352 200, 362 246" fill="none" stroke="#66b3ff" stroke-width="1.8" marker-end="url(#bc-blue)" vector-effect="non-scaling-stroke"/>
<text x="268" y="196" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="end">2. Revise beliefs</text>
<path d="M 330 262 L 330 330 A 40 10 0 0 0 410 330 L 410 262" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<ellipse cx="370" cy="262" rx="40" ry="10" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="370" y="295" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Beliefs</text>
<text x="370" y="315" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Goals</text>
<path d="M 370 344 C 370 380, 385 392, 416 392" fill="none" stroke="#b89aff" stroke-width="1.8" marker-end="url(#bc-violet)" vector-effect="non-scaling-stroke"/>
<text x="285" y="400" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="end">3. Plan</text>
<rect x="420" y="372" width="104" height="40" rx="6" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="472" y="397" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Planner</text>
<path d="M 524 392 C 560 392, 568 360, 566 320" fill="none" stroke="#b89aff" stroke-width="1.8" marker-end="url(#bc-violet)" vector-effect="non-scaling-stroke"/>
<polygon points="490,290 512,264 610,264 632,290 610,316 512,316" fill="#1b3835" stroke="#5ad4b5" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="561" y="295" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Actuators</text>
<path d="M 598 262 C 610 200, 540 150, 470 148" fill="none" stroke="#ffc778" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#bc-amber)" vector-effect="non-scaling-stroke"/>
<text x="618" y="200" fill="#ffc778" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">feedback</text>
<line x1="634" y1="290" x2="790" y2="290" stroke="#5ad4b5" stroke-width="2.4" marker-end="url(#bc-teal)" vector-effect="non-scaling-stroke"/>
<text x="712" y="276" fill="#5ad4b5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600" letter-spacing="1" text-anchor="middle">ACTIONS</text>
<text x="712" y="318" fill="#ffc778" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle">4. Act</text>
</svg>
