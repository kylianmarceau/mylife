<rect x="700" y="322" width="28" height="28" rx="4" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8"/>
<text x="790" y="256" fill="#5ad4b5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle">act</text>
<text x="790" y="276" fill="#adb9cb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" text-anchor="middle">on environment</text>
