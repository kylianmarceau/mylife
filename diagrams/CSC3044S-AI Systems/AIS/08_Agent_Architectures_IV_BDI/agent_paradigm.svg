<svg width="100%" viewBox="0 0 900 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The agent paradigm</title>
<desc>An agent inside its world/environment observes the environment, perceives and reasons, then acts back on the environment through several outputs.</desc>
<defs>
<marker id="ap-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ap-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="20" y="20" width="860" height="380" rx="28" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-dasharray="8 6" vector-effect="non-scaling-stroke"/>
<text x="48" y="56" fill="#adb9cb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" letter-spacing="1">WORLD / ENVIRONMENT</text>
<path d="M 150 330 C 190 230, 280 190, 352 200" fill="none" stroke="#66b3ff" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ap-blue)" vector-effect="non-scaling-stroke"/>
<path d="M 175 345 C 215 260, 290 225, 352 228" fill="none" stroke="#66b3ff" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ap-blue)" vector-effect="non-scaling-stroke"/>
<path d="M 200 360 C 240 290, 300 258, 356 256" fill="none" stroke="#66b3ff" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ap-blue)" vector-effect="non-scaling-stroke"/>
<text x="130" y="230" fill="#66b3ff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle">observe</text>
<ellipse cx="450" cy="250" rx="95" ry="110" fill="#302b46" stroke="#b89aff" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
<ellipse cx="450" cy="160" rx="52" ry="48" fill="#20344c" stroke="#66b3ff" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
