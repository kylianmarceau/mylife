<text x="450" y="262" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Agent</text>
<text x="450" y="290" fill="#b89aff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" text-anchor="middle">reason</text>
<line x1="540" y1="215" x2="696" y2="165" stroke="#5ad4b5" stroke-width="1.8" marker-end="url(#ap-teal)" vector-effect="non-scaling-stroke"/>
<line x1="544" y1="250" x2="696" y2="250" stroke="#5ad4b5" stroke-width="1.8" marker-end="url(#ap-teal)" vector-effect="non-scaling-stroke"/>
