<svg width="100%" viewBox="0 0 900 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Review agent and generation agent share failure rules</title>
<desc>Failure situations are written into both prompts; review agent flags errors in existing checks, generation agent avoids them.</desc>
<defs><marker id="a5ad4b5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a66b3ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="aadb9cb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ab89aff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="af8fafc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="aff939b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="affc778" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="300" y="20" width="300" height="90" rx="10" fill="#3f2a33" stroke="#ff939b" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<text x="450.0" y="51.699999999999996" fill="#f8fafc" font-size="14" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" font-weight="400">Failure situations</text>
<text x="450.0" y="69.89999999999999" fill="#f8fafc" font-size="14" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" font-weight="400">duplicate sibling checks</text>
<text x="450.0" y="88.1" fill="#f8fafc" font-size="14" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" font-weight="400">parent/child mismatch</text>
<rect x="60" y="190" width="300" height="80" rx="10" fill="#3d3326" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<text x="210.0" y="225.8" fill="#f8fafc" font-size="14" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" font-weight="400">1. Review agent (built first)</text>
<text x="210.0" y="244.0" fill="#f8fafc" font-size="14" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" font-weight="400">flags errors + warnings</text>
<rect x="540" y="190" width="300" height="80" rx="10" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<text x="690.0" y="225.8" fill="#f8fafc" font-size="14" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" font-weight="400">2. Generation agent</text>
<text x="690.0" y="244.0" fill="#f8fafc" font-size="14" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" font-weight="400">creates new checks</text>
<path d="M400 112 L230 188" fill="none" stroke="#ff939b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#aff939b)"/>
<path d="M500 112 L670 188" fill="none" stroke="#ff939b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#aff939b)"/>
<text x="270" y="145" fill="#ff939b" font-size="13" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="end" font-weight="400">what to flag</text>
<text x="630" y="145" fill="#ff939b" font-size="13" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="start" font-weight="400">what to avoid</text>
<rect x="330" y="300" width="240" height="56" rx="10" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<text x="450.0" y="323.79999999999995" fill="#f8fafc" font-size="14" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" font-weight="400">Compliance tree</text>
<text x="450.0" y="341.99999999999994" fill="#f8fafc" font-size="14" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" font-weight="400">(checks)</text>
<path d="M690 272 L540 312" fill="none" stroke="#5ad4b5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#a5ad4b5)"/>
<text x="660" y="310" fill="#5ad4b5" font-size="13" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="start" font-weight="400">adds checks</text>
<path d="M330 312 L210 272" fill="none" stroke="#ffc778" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#affc778)"/>
<text x="240" y="310" fill="#ffc778" font-size="13" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="end" font-weight="400">reviews</text>
</svg>
