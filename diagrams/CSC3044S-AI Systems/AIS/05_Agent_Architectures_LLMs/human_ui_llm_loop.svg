<text x="605" y="100" fill="#ffc778" font-size="14" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" font-weight="400">Prompt</text>
<path d="M658 150 L552 150" fill="none" stroke="#b89aff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#ab89aff)"/>
