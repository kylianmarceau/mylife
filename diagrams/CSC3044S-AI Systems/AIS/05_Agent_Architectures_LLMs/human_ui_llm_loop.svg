<text x="140.0" y="147.0" fill="#f8fafc" font-size="17" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" font-weight="400">business user</text>
<rect x="350" y="80" width="200" height="100" rx="10" fill="#3d3326" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<text x="450.0" y="124.9" fill="#f8fafc" font-size="17" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" font-weight="400">UI</text>
<text x="450.0" y="147.0" fill="#f8fafc" font-size="17" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" font-weight="400">AI-friendly controls</text>
