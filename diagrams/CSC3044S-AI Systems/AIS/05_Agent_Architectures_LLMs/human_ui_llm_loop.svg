<text x="450" y="230" fill="#adb9cb" font-size="14" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" font-weight="400">The human never prompts the LLM directly; the UI mediates both ways.</text>
</svg>
