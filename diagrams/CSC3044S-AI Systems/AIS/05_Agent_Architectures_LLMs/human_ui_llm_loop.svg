<text x="760.0" y="147.0" fill="#f8fafc" font-size="17" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" font-weight="400">generates checks</text>
<path d="M242 110 L348 110" fill="none" stroke="#66b3ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#a66b3ff)"/>
