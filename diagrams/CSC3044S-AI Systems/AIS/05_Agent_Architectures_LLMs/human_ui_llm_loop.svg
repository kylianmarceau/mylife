<svg width="100%" viewBox="0 0 900 260" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Human, UI and LLM interaction loop</title>
<desc>Human sends rules to UI, UI sends prompt to LLM, LLM returns JSON to UI, UI returns rules to human.</desc>
