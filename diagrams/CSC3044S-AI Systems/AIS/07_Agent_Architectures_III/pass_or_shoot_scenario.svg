<svg width="100%" viewBox="0 0 700 490" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Pass-or-shoot scenario</title>
<desc>Agent A has the ball near goal and must choose between shooting past goalie C or passing to teammate B, who then shoots.</desc>
<defs><marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="40" width="620" height="380" rx="4" fill="#272f3b" stroke="#adb9cb" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<rect x="40" y="90" width="150" height="280" fill="none" stroke="#adb9cb" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<rect x="22" y="170" width="22" height="120" fill="#adb9cb" stroke="none"/>
<text x="70" y="160" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb" text-anchor="middle" font-weight="400" font-style="normal" transform="rotate(-90 70 160)">Goal</text>
<path d="M455 150 L52 225" fill="none" stroke="#ff939b" stroke-width="2.2" marker-end="url(#ac)" vector-effect="non-scaling-stroke"/>
<text x="260" y="170" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#ff939b" text-anchor="middle" font-weight="700" font-style="normal">Shoot?</text>
<path d="M455 160 L400 305" fill="none" stroke="#5ad4b5" stroke-width="2.2" marker-end="url(#at)" vector-effect="non-scaling-stroke"/>
<text x="450" y="260" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#5ad4b5" text-anchor="start" font-weight="700" font-style="normal">Pass?</text>
<path d="M392 330 L60 245" fill="none" stroke="#5ad4b5" stroke-width="1.6" marker-end="url(#at)" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>
<text x="230" y="315" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#5ad4b5" text-anchor="middle" font-weight="400" font-style="normal">B shoots</text>
<circle cx="445" cy="152" r="9" fill="#f8fafc" stroke="#adb9cb" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
<circle cx="475" cy="150" r="20" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="475" y="156" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="700" font-style="normal">A</text>
<circle cx="388" cy="330" r="20" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="388" y="336" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="700" font-style="normal">B</text>
<circle cx="285" cy="200" r="20" fill="#3f2a33" stroke="#ff939b" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="285" y="206" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="700" font-style="normal">C</text>
<text x="285" y="240" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ff939b" text-anchor="middle" font-weight="400" font-style="normal">goalie</text>
<text x="520" y="130" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#66b3ff" text-anchor="start" font-weight="400" font-style="normal">has ball</text>
<circle cx="120" cy="460" r="10" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="140" y="465" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb" text-anchor="start" font-weight="400" font-style="normal">Teammates A, B</text>
<circle cx="330" cy="460" r="10" fill="#3f2a33" stroke="#ff939b" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="350" y="465" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb" text-anchor="start" font-weight="400" font-style="normal">Goalie C (intercepts)</text>
</svg>
