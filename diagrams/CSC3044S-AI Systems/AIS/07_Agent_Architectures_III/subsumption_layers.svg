<svg width="100%" viewBox="0 0 900 440" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Multi-agent subsumption architecture</title>
<desc>Three behaviour layers receive the sensation stream in parallel; behaviour 3 subsumes behaviour 2, which subsumes behaviour 1 before the action stream. Each layer can be a different agent.</desc>
<defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="20" y1="380" x2="300" y2="380" stroke="#66b3ff" stroke-width="2" marker-end="url(#ab)" vector-effect="non-scaling-stroke"/>
<text x="30" y="410" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#66b3ff" text-anchor="start" font-weight="600" font-style="normal">Sensation stream</text>
<line x1="240" y1="380" x2="240" y2="140" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<rect x="300" y="110" width="340" height="60" rx="10" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="470" y="147" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600" font-style="normal">Behaviour 3</text>
<text x="150" y="122" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#b89aff" text-anchor="middle" font-weight="700" font-style="normal">Agent 3</text>
<line x1="240" y1="140" x2="296" y2="140" stroke="#66b3ff" stroke-width="2" marker-end="url(#ab)" vector-effect="non-scaling-stroke"/>
<rect x="300" y="230" width="340" height="60" rx="10" fill="#3d3326" stroke="#ffc778" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="470" y="267" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600" font-style="normal">Behaviour 2</text>
<text x="150" y="242" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#ffc778" text-anchor="middle" font-weight="700" font-style="normal">Agent 2</text>
<line x1="240" y1="260" x2="296" y2="260" stroke="#66b3ff" stroke-width="2" marker-end="url(#ab)" vector-effect="non-scaling-stroke"/>
<rect x="300" y="350" width="340" height="60" rx="10" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="470" y="387" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600" font-style="normal">Behaviour 1</text>
<text x="150" y="362" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#66b3ff" text-anchor="middle" font-weight="700" font-style="normal">Agent 1</text>
<line x1="640" y1="380" x2="880" y2="380" stroke="#5ad4b5" stroke-width="2.2" marker-end="url(#at)" vector-effect="non-scaling-stroke"/>
<text x="870" y="410" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#5ad4b5" text-anchor="end" font-weight="600" font-style="normal">Action stream</text>
<path d="M640 140 H730 V255" fill="none" stroke="#b89aff" stroke-width="2" marker-end="url(#av)" vector-effect="non-scaling-stroke"/>
<text x="742" y="205" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#b89aff" text-anchor="start" font-weight="400" font-style="normal">Subsumption</text>
<path d="M640 260 H780 V372" fill="none" stroke="#ffc778" stroke-width="2" marker-end="url(#aa)" vector-effect="non-scaling-stroke"/>
<text x="792" y="325" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#ffc778" text-anchor="start" font-weight="400" font-style="normal">Subsumption</text>
<circle cx="730" cy="260" r="5" fill="#b89aff" stroke="#b89aff" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
<circle cx="780" cy="380" r="5" fill="#ffc778" stroke="#ffc778" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
<text x="450" y="50" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#adb9cb" text-anchor="middle" font-weight="400" font-style="normal">Higher layers override (subsume) the output of the layer below</text>
<text x="150" y="85" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="400" font-style="italic">multi-agent mapping</text>
</svg>
