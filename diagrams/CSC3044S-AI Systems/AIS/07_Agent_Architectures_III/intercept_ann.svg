<svg width="100%" viewBox="0 0 800 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Intercept ANN</title>
<desc>A 3-4-1 network mapping distance to ball at t and t-1 and angle to ball at t to a turn angle at t.</desc>
<defs></defs>
<line x1="260" y1="70" x2="410" y2="70" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<line x1="260" y1="70" x2="410" y2="150" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<line x1="260" y1="70" x2="410" y2="230" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<line x1="260" y1="70" x2="410" y2="310" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<line x1="260" y1="190" x2="410" y2="70" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<line x1="260" y1="190" x2="410" y2="150" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<line x1="260" y1="190" x2="410" y2="230" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<line x1="260" y1="190" x2="410" y2="310" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<line x1="260" y1="310" x2="410" y2="70" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<line x1="260" y1="310" x2="410" y2="150" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<line x1="260" y1="310" x2="410" y2="230" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<line x1="260" y1="310" x2="410" y2="310" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<line x1="410" y1="70" x2="560" y2="190" stroke="#b89aff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<line x1="410" y1="150" x2="560" y2="190" stroke="#b89aff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<line x1="410" y1="230" x2="560" y2="190" stroke="#b89aff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<line x1="410" y1="310" x2="560" y2="190" stroke="#b89aff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<circle cx="260" cy="70" r="9" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="240" y="75" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="end" font-weight="400" font-style="normal">Distance to ball (t)</text>
<circle cx="260" cy="190" r="9" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="240" y="195" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="end" font-weight="400" font-style="normal">Distance to ball (t-1)</text>
<circle cx="260" cy="310" r="9" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="240" y="315" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="end" font-weight="400" font-style="normal">Angle to ball (t)</text>
<circle cx="410" cy="70" r="9" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<circle cx="410" cy="150" r="9" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<circle cx="410" cy="230" r="9" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<circle cx="410" cy="310" r="9" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<circle cx="560" cy="190" r="9" fill="#3d3326" stroke="#ffc778" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="580" y="195" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#ffc778" text-anchor="start" font-weight="600" font-style="normal">Turn angle (t)</text>
<text x="580" y="240" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="start" font-weight="400" font-style="italic">range 0 to 90 degrees</text>
<text x="580" y="260" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="start" font-weight="400" font-style="italic">then move at fixed speed</text>
<text x="260" y="360" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="400" font-style="italic">input (3)</text>
<text x="410" y="360" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="400" font-style="italic">hidden (4)</text>
<text x="560" y="360" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="400" font-style="italic">output (1)</text>
</svg>
