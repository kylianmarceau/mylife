<svg width="100%" viewBox="0 0 720 430" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Pass-or-shoot ANN</title>
<desc>A 4-2-2 network: four geometric inputs, two hidden nodes, and Pass and Shoot output nodes.</desc>
<defs></defs>
<line x1="260" y1="60" x2="430" y2="60" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<line x1="260" y1="60" x2="430" y2="330" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
