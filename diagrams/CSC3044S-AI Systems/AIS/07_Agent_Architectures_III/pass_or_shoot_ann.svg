<circle cx="260" cy="240" r="9" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="240" y="245" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="end" font-weight="400" font-style="normal">Angle to goalie</text>
<circle cx="260" cy="330" r="9" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="240" y="335" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="end" font-weight="400" font-style="normal">Distance to goalie</text>
<circle cx="430" cy="60" r="9" fill="#302b46" stroke="#b89aff" stroke-width="2" vector-effect="non-scaling-stroke"/>
