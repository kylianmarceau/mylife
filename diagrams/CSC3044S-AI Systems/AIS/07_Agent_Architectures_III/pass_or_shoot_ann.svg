<line x1="430" y1="330" x2="600" y2="330" stroke="#b89aff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<circle cx="260" cy="60" r="9" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="240" y="65" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="end" font-weight="400" font-style="normal">Angle to agent B</text>
