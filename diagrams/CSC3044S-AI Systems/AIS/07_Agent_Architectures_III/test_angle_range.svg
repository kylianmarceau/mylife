<svg width="100%" viewBox="0 0 800 490" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Test angle range</title>
<desc>During testing, the goalie and agent B are placed randomly within -60 to +30 degrees of agent A.</desc>
<defs></defs>
<line x1="60" y1="440" x2="60" y2="40" stroke="#adb9cb" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<line x1="60" y1="440" x2="760" y2="440" stroke="#adb9cb" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
<rect x="54" y="200" width="12" height="90" fill="#adb9cb"/>
<path d="M620 200 L352 45 L70 45 L70 430 L487 430 Z" fill="#3d3326" fill-opacity="0.55" stroke="none"/>
<line x1="620" y1="200" x2="352" y2="45" stroke="#ffc778" stroke-width="1.8" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>
<line x1="620" y1="200" x2="487" y2="430" stroke="#ffc778" stroke-width="1.8" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>
<line x1="620" y1="200" x2="90" y2="200" stroke="#adb9cb" stroke-width="1.2" stroke-dasharray="3 5" vector-effect="non-scaling-stroke"/>
<text x="342" y="70" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#ffc778" text-anchor="end" font-weight="700" font-style="normal">+30°</text>
<text x="499" y="420" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#ffc778" text-anchor="start" font-weight="700" font-style="normal">-60°</text>
<text x="330" y="192" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" text-anchor="middle" font-weight="400" font-style="italic">A's facing direction (0°)</text>
<circle cx="620" cy="200" r="16" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="646" y="206" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#f8fafc" text-anchor="start" font-weight="600" font-style="normal">Agent A</text>
<circle cx="592" cy="200" r="7" fill="#f8fafc" stroke="#adb9cb" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<circle cx="130" cy="250" r="15" fill="#3f2a33" stroke="#ff939b" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="130" y="285" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="600" font-style="normal">Goalie</text>
<circle cx="230" cy="390" r="15" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text x="260" y="396" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" text-anchor="start" font-weight="600" font-style="normal">Agent B</text>
<text x="400" y="475" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb" text-anchor="middle" font-weight="400" font-style="normal">Goalie and B placed randomly inside the shaded range; 2000 test runs</text>
</svg>
