<svg width="100%" viewBox="0 0 900 520" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<title>Agent = Model + Harness</title>
<desc>An LLM sits inside a harness made of context assembly, tool access, output validation, action routing and observability.</desc>
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff939b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#adb9cb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="150" y="30" width="620" height="440" rx="18" fill="none" stroke="#5ad4b5" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <text x="460" y="60" text-anchor="middle" fill="#5ad4b5" font-size="17" font-weight="700" letter-spacing="2">HARNESS</text>
  <ellipse cx="75" cy="120" rx="60" ry="44" fill="#272f3b" stroke="#adb9cb" stroke-width="1.6"/>
  <text x="75" y="106" text-anchor="middle" fill="#f8fafc" font-size="13">data,</text>
  <text x="75" y="124" text-anchor="middle" fill="#f8fafc" font-size="13">queries,</text>
  <text x="75" y="142" text-anchor="middle" fill="#f8fafc" font-size="13">events</text>
  <line x1="136" y1="120" x2="178" y2="120" stroke="#f8fafc" stroke-width="1.8" marker-end="url(#aw)"/>
  <rect x="180" y="80" width="190" height="80" rx="10" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <text x="275" y="112" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Context assembly</text>
  <text x="275" y="136" text-anchor="middle" fill="#adb9cb" font-size="13">Curate what the model sees</text>
  <rect x="180" y="210" width="190" height="80" rx="10" fill="#20344c" stroke="#66b3ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <text x="275" y="242" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Tool access</text>
  <text x="275" y="266" text-anchor="middle" fill="#adb9cb" font-size="13">Credentials + connections</text>
  <line x1="275" y1="162" x2="275" y2="208" stroke="#adb9cb" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="410" y="120" width="140" height="130" rx="12" fill="#302b46" stroke="#b89aff" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
