  <rect x="590" y="210" width="160" height="80" rx="10" fill="#3f2a33" stroke="#ff939b" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <text x="670" y="238" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Action routing</text>
  <text x="670" y="258" text-anchor="middle" fill="#adb9cb" font-size="12">Confidence, rules,</text>
  <text x="670" y="274" text-anchor="middle" fill="#adb9cb" font-size="12">escalation</text>
  <path d="M750 230 L800 215" fill="none" stroke="#ff939b" stroke-width="1.8" marker-end="url(#ac)"/>
  <path d="M750 250 L800 250" fill="none" stroke="#ff939b" stroke-width="1.8" marker-end="url(#ac)"/>
  <path d="M750 270 L800 285" fill="none" stroke="#ff939b" stroke-width="1.8" marker-end="url(#ac)"/>
  <text x="808" y="220" fill="#f8fafc" font-size="14">Execute</text>
  <text x="808" y="255" fill="#f8fafc" font-size="14">Review</text>
  <text x="808" y="290" fill="#f8fafc" font-size="14">Escalate</text>
  <rect x="180" y="370" width="570" height="70" rx="10" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
  <text x="465" y="400" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Observability</text>
  <text x="465" y="424" text-anchor="middle" fill="#adb9cb" font-size="13">Every stage inspectable and auditable</text>
  <g stroke="#adb9cb" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <line x1="230" y1="368" x2="230" y2="294" marker-end="url(#am)"/>
    <line x1="320" y1="368" x2="320" y2="294" marker-end="url(#am)"/>
    <line x1="480" y1="368" x2="480" y2="254" marker-end="url(#am)"/>
    <line x1="630" y1="368" x2="630" y2="294" marker-end="url(#am)"/>
    <line x1="710" y1="368" x2="710" y2="294" marker-end="url(#am)"/>
  </g>
  <text x="460" y="502" text-anchor="middle" fill="#ffc778" font-size="15" font-style="italic">The model reasons. The harness governs everything else.</text>
