  <path d="M370 250 L408 220" fill="none" stroke="#66b3ff" stroke-width="1.8" marker-end="url(#ab)"/>
  <path d="M550 170 L588 125" fill="none" stroke="#b89aff" stroke-width="1.8" marker-end="url(#av)"/>
  <rect x="590" y="80" width="160" height="80" rx="10" fill="#3f2a33" stroke="#ff939b" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <text x="670" y="112" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Output validation</text>
