<svg width="100%" viewBox="0 0 900 460" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<title>Roomba cleaning pattern</title>
<desc>A room with a sofa and table. The Roomba spirals out from the start point, then follows walls and furniture edges, and also bounces across the room in straight lines, changing direction on contact.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ffc778" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="30" y="20" width="600" height="420" fill="none" stroke="#adb9cb" stroke-width="2.4"/>
  <rect x="140" y="30" width="170" height="60" rx="8" fill="#272f3b" stroke="#adb9cb" stroke-width="1.6"/>
  <text x="225" y="66" text-anchor="middle" fill="#adb9cb" font-size="14">sofa</text>
  <circle cx="545" cy="170" r="45" fill="#272f3b" stroke="#adb9cb" stroke-width="1.6"/>
  <text x="545" y="175" text-anchor="middle" fill="#adb9cb" font-size="14">table</text>
  <g stroke="#ffc778" stroke-width="1.2" opacity="0.6" fill="none">
    <polyline points="31,385 225,91 629,300 380,439 31,250 140,91"/>
  </g>
  <path d="M330 235 m8 0 a8 8 0 1 0 -16 0 a16 16 0 1 0 32 0 a28 28 0 1 0 -56 0 a42 42 0 1 0 84 0 a56 56 0 1 0 -112 0" fill="none" stroke="#66b3ff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ab)"/>
  <text x="330" y="240" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">×</text>
  <text x="330" y="318" text-anchor="middle" fill="#66b3ff" font-size="13">start</text>
  <path d="M274 235 L45 235 L45 425 L615 425 L615 35 L325 35 L325 105 L125 105 L125 35 L45 35 L45 200" fill="none" stroke="#5ad4b5" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="545" cy="170" r="58" fill="none" stroke="#5ad4b5" stroke-width="2" stroke-dasharray="6 4"/>
  <g font-size="14">
        <line x1="660" y1="110" x2="700" y2="110" stroke="#66b3ff" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="712" y="115" fill="#f8fafc">1. Spiral out from start</text>
    <line x1="660" y1="160" x2="700" y2="160" stroke="#5ad4b5" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="712" y="157" fill="#f8fafc">2. Follow walls and</text>
    <text x="712" y="175" fill="#f8fafc">furniture edges</text>
    <line x1="660" y1="215" x2="700" y2="215" stroke="#ffc778" stroke-width="1.4" opacity="0.8"/>
    <text x="712" y="212" fill="#f8fafc">3. Bounce in straight</text>
    <text x="712" y="230" fill="#f8fafc">lines on contact</text>
  </g>
  <g font-size="13" fill="#adb9cb">
    <text x="660" y="290">Sensors used:</text>
    <text x="660" y="310">• smart bumper (contact)</text>
    <text x="660" y="328">• cliff sensor (drops)</text>
    <text x="660" y="346">• infrared sensor</text>
  </g>
</svg>
