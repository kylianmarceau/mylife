<svg width="100%" viewBox="0 0 900 430" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<title>TouringMachines architecture</title>
<desc>Sensory input enters a perception subsystem, which connects to the modelling, planning and reactive layers inside a control framework. All three layers connect to an action subsystem that produces action output.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <ellipse cx="450" cy="215" rx="205" ry="200" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8"/>
  <text x="450" y="365" text-anchor="middle" fill="#adb9cb" font-size="15" font-weight="700">Control</text>
  <text x="450" y="384" text-anchor="middle" fill="#adb9cb" font-size="15" font-weight="700">Framework</text>
  <g font-size="16" text-anchor="middle" fill="#f8fafc">
    <rect x="330" y="80" width="240" height="56" rx="6" fill="#302b46" stroke="#b89aff" stroke-width="2"/>
    <text x="450" y="114">Modelling Layer (M)</text>
    <rect x="330" y="172" width="240" height="56" rx="6" fill="#302b46" stroke="#b89aff" stroke-width="2"/>
    <text x="450" y="206">Planning Layer (P)</text>
    <rect x="330" y="264" width="240" height="56" rx="6" fill="#3d3326" stroke="#ffc778" stroke-width="2"/>
    <text x="450" y="298">Reactive Layer (R)</text>
  </g>
  <rect x="25" y="170" width="170" height="70" rx="6" fill="#20344c" stroke="#66b3ff" stroke-width="2"/>
  <text x="110" y="200" text-anchor="middle" fill="#f8fafc" font-size="15">Perception</text>
  <text x="110" y="220" text-anchor="middle" fill="#f8fafc" font-size="15">Subsystem</text>
  <line x1="110" y1="100" x2="110" y2="167" stroke="#66b3ff" stroke-width="3" marker-end="url(#ab)"/>
  <text x="110" y="70" text-anchor="middle" fill="#66b3ff" font-size="14">Sensory</text>
  <text x="110" y="88" text-anchor="middle" fill="#66b3ff" font-size="14">Input</text>
  <rect x="705" y="170" width="170" height="70" rx="6" fill="#1b3835" stroke="#5ad4b5" stroke-width="2"/>
  <text x="790" y="200" text-anchor="middle" fill="#f8fafc" font-size="15">Action</text>
  <text x="790" y="220" text-anchor="middle" fill="#f8fafc" font-size="15">Subsystem</text>
  <line x1="790" y1="167" x2="790" y2="100" stroke="#5ad4b5" stroke-width="3" marker-end="url(#at)"/>
  <text x="790" y="70" text-anchor="middle" fill="#5ad4b5" font-size="14">Action</text>
  <text x="790" y="88" text-anchor="middle" fill="#5ad4b5" font-size="14">Output</text>
  <g stroke="#66b3ff" stroke-width="1.6" stroke-dasharray="4 4" fill="none">
    <line x1="195" y1="205" x2="328" y2="108"/>
    <line x1="195" y1="205" x2="328" y2="200"/>
    <line x1="195" y1="205" x2="328" y2="292"/>
  </g>
  <g stroke="#5ad4b5" stroke-width="1.6" stroke-dasharray="4 4" fill="none">
    <line x1="572" y1="108" x2="705" y2="205"/>
    <line x1="572" y1="200" x2="705" y2="205"/>
    <line x1="572" y1="292" x2="705" y2="205"/>
  </g>
</svg>
