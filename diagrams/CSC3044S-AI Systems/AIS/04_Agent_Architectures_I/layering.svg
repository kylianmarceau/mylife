<svg width="100%" viewBox="0 0 900 480" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<title>Horizontal versus vertical layering</title>
<desc>Horizontal layering: sensor input goes to every layer and every layer contributes to action output. Vertical one-pass: input enters layer 1 and flows up to layer n, which produces action output. Vertical two-pass: information flows up then control flows back down, with action output leaving at the bottom.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <text x="175" y="34" fill="#66b3ff">Horizontal layering</text>
    <text x="480" y="34" fill="#b89aff">Vertical: one-pass</text>
    <text x="755" y="34" fill="#b89aff">Vertical: two-pass</text>
  </g>
  <line x1="355" y1="55" x2="355" y2="460" stroke="#adb9cb" stroke-width="1" stroke-dasharray="3 5"/>
  <line x1="625" y1="55" x2="625" y2="460" stroke="#adb9cb" stroke-width="1" stroke-dasharray="3 5"/>
  <g font-size="14" text-anchor="middle" fill="#f8fafc">
    <rect x="130" y="110" width="100" height="50" fill="#302b46" stroke="#b89aff" stroke-width="1.6"/><text x="180" y="140">Layerₙ</text>
    <rect x="130" y="160" width="100" height="50" fill="#302b46" stroke="#b89aff" stroke-width="1.6"/><text x="180" y="190">Layerₙ₋₁</text>
    <text x="180" y="243" font-size="18">⋮</text>
    <rect x="130" y="260" width="100" height="50" fill="#302b46" stroke="#b89aff" stroke-width="1.6"/><text x="180" y="290">Layer₂</text>
    <rect x="130" y="310" width="100" height="50" fill="#302b46" stroke="#b89aff" stroke-width="1.6"/><text x="180" y="340">Layer₁</text>
  </g>
  <text x="95" y="230" text-anchor="end" fill="#66b3ff" font-size="13">Sensor</text>
  <text x="95" y="246" text-anchor="end" fill="#66b3ff" font-size="13">input</text>
  <g stroke="#66b3ff" stroke-width="1.5" fill="none">
    <line x1="100" y1="235" x2="128" y2="135" marker-end="url(#ab)"/>
    <line x1="100" y1="235" x2="128" y2="185" marker-end="url(#ab)"/>
    <line x1="100" y1="235" x2="128" y2="285" marker-end="url(#ab)"/>
    <line x1="100" y1="235" x2="128" y2="335" marker-end="url(#ab)"/>
  </g>
  <g stroke="#5ad4b5" stroke-width="1.5" fill="none">
    <line x1="230" y1="135" x2="263" y2="233" marker-end="url(#at)"/>
    <line x1="230" y1="185" x2="263" y2="233" marker-end="url(#at)"/>
    <line x1="230" y1="285" x2="263" y2="237" marker-end="url(#at)"/>
    <line x1="230" y1="335" x2="263" y2="237" marker-end="url(#at)"/>
  </g>
  <text x="270" y="230" fill="#5ad4b5" font-size="13">Action</text>
  <text x="270" y="246" fill="#5ad4b5" font-size="13">output</text>
  <g font-size="14" text-anchor="middle" fill="#f8fafc">
    <rect x="420" y="110" width="120" height="50" fill="#302b46" stroke="#b89aff" stroke-width="1.6"/><text x="492" y="140">Layerₙ</text>
    <rect x="420" y="160" width="120" height="50" fill="#302b46" stroke="#b89aff" stroke-width="1.6"/><text x="492" y="190">Layerₙ₋₁</text>
    <text x="480" y="243" font-size="18">⋮</text>
    <rect x="420" y="260" width="120" height="50" fill="#302b46" stroke="#b89aff" stroke-width="1.6"/><text x="492" y="290">Layer₂</text>
    <rect x="420" y="310" width="120" height="50" fill="#302b46" stroke="#b89aff" stroke-width="1.6"/><text x="492" y="340">Layer₁</text>
  </g>
  <g stroke="#66b3ff" stroke-width="1.6" fill="none">
    <line x1="480" y1="420" x2="480" y2="363" marker-end="url(#ab)"/>
    <line x1="434" y1="325" x2="434" y2="298" marker-end="url(#ab)"/>
    <line x1="434" y1="255" x2="434" y2="222" marker-end="url(#ab)"/>
    <line x1="434" y1="175" x2="434" y2="148" marker-end="url(#ab)"/>
  </g>
  <line x1="480" y1="108" x2="480" y2="72" stroke="#5ad4b5" stroke-width="1.6" marker-end="url(#at)"/>
  <text x="490" y="84" fill="#5ad4b5" font-size="13">Action output</text>
  <text x="480" y="440" text-anchor="middle" fill="#66b3ff" font-size="13">Sensor input</text>
  <g font-size="14" text-anchor="middle" fill="#f8fafc">
    <rect x="695" y="110" width="120" height="50" fill="#302b46" stroke="#b89aff" stroke-width="1.6"/><text x="755" y="140">Layerₙ</text>
    <rect x="695" y="160" width="120" height="50" fill="#302b46" stroke="#b89aff" stroke-width="1.6"/><text x="755" y="190">Layerₙ₋₁</text>
    <text x="755" y="243" font-size="18">⋮</text>
    <rect x="695" y="260" width="120" height="50" fill="#302b46" stroke="#b89aff" stroke-width="1.6"/><text x="755" y="290">Layer₂</text>
    <rect x="695" y="310" width="120" height="50" fill="#302b46" stroke="#b89aff" stroke-width="1.6"/><text x="755" y="340">Layer₁</text>
  </g>
  <g stroke="#66b3ff" stroke-width="1.6" fill="none">
    <line x1="712" y1="420" x2="712" y2="363" marker-end="url(#ab)"/>
    <line x1="712" y1="325" x2="712" y2="298" marker-end="url(#ab)"/>
    <line x1="712" y1="255" x2="712" y2="222" marker-end="url(#ab)"/>
    <line x1="712" y1="175" x2="712" y2="148" marker-end="url(#ab)"/>
  </g>
  <g stroke="#5ad4b5" stroke-width="1.6" fill="none" stroke-dasharray="4 3">
    <line x1="798" y1="125" x2="798" y2="150" marker-end="url(#at)"/>
    <line x1="798" y1="200" x2="798" y2="252" marker-end="url(#at)"/>
    <line x1="798" y1="275" x2="798" y2="300" marker-end="url(#at)"/>
    <line x1="798" y1="345" x2="798" y2="420" marker-end="url(#at)"/>
  </g>
  <text x="724" y="440" text-anchor="end" fill="#66b3ff" font-size="13">Sensor input</text>
  <text x="786" y="440" fill="#5ad4b5" font-size="13">Action output</text>
</svg>
