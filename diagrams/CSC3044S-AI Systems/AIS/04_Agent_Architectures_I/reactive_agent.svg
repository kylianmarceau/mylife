<svg width="100%" viewBox="0 0 900 420" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<title>Reactive agent architecture</title>
<desc>Sensors feed a bank of stimulus-response behaviours, each mapping a state directly to an action, which drive the effectors.</desc>
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#66b3ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="110" y="20" width="680" height="380" rx="30" fill="none" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
  <text x="140" y="50" fill="#adb9cb" font-size="16" font-weight="700">Agent</text>
  <line x1="20" y1="220" x2="148" y2="220" stroke="#f8fafc" stroke-width="3" marker-end="url(#aw)"/>
  <text x="30" y="205" fill="#adb9cb" font-size="13">environment</text>
  <rect x="150" y="70" width="50" height="310" rx="6" fill="#20344c" stroke="#66b3ff" stroke-width="2"/>
  <text x="175" y="225" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700" transform="rotate(-90 175 225)">Sensors</text>
  <rect x="700" y="70" width="50" height="310" rx="6" fill="#1b3835" stroke="#5ad4b5" stroke-width="2"/>
  <text x="725" y="225" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700" transform="rotate(-90 725 225)">Effectors</text>
  <line x1="750" y1="220" x2="880" y2="220" stroke="#f8fafc" stroke-width="3" marker-end="url(#aw)"/>
  <text x="870" y="205" text-anchor="end" fill="#adb9cb" font-size="13">environment</text>
  <rect x="240" y="65" width="420" height="320" rx="8" fill="none" stroke="#ffc778" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <text x="450" y="92" text-anchor="middle" fill="#ffc778" font-size="15" font-weight="700">Stimulus-response behaviours</text>
  <g font-size="15" fill="#f8fafc" text-anchor="middle">
    <rect x="275" y="115" width="120" height="44" rx="6" fill="#20344c" stroke="#66b3ff" stroke-width="1.6"/>
    <text x="335" y="142">State₁</text>
    <rect x="505" y="115" width="120" height="44" rx="6" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.6"/>
    <text x="565" y="142">Action₁</text>
    <rect x="275" y="190" width="120" height="44" rx="6" fill="#20344c" stroke="#66b3ff" stroke-width="1.6"/>
    <text x="335" y="217">State₂</text>
    <rect x="505" y="190" width="120" height="44" rx="6" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.6"/>
    <text x="565" y="217">Action₂</text>
    <text x="335" y="270" font-size="20">⋮</text>
    <text x="565" y="270" font-size="20">⋮</text>
    <rect x="275" y="310" width="120" height="44" rx="6" fill="#20344c" stroke="#66b3ff" stroke-width="1.6"/>
    <text x="335" y="337">Stateₙ</text>
    <rect x="505" y="310" width="120" height="44" rx="6" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.6"/>
    <text x="565" y="337">Actionₙ</text>
  </g>
  <g stroke="#66b3ff" stroke-width="1.6" fill="none">
    <line x1="200" y1="220" x2="273" y2="137" marker-end="url(#ab)"/>
    <line x1="200" y1="220" x2="273" y2="212" marker-end="url(#ab)"/>
    <line x1="200" y1="220" x2="273" y2="332" marker-end="url(#ab)"/>
  </g>
  <g stroke="#f8fafc" stroke-width="1.6" fill="none">
    <line x1="395" y1="137" x2="503" y2="137" marker-end="url(#aw)"/>
    <line x1="395" y1="212" x2="503" y2="212" marker-end="url(#aw)"/>
    <line x1="395" y1="332" x2="503" y2="332" marker-end="url(#aw)"/>
  </g>
  <g stroke="#5ad4b5" stroke-width="1.6" fill="none">
    <line x1="625" y1="137" x2="698" y2="220" marker-end="url(#at)"/>
    <line x1="625" y1="212" x2="698" y2="220" marker-end="url(#at)"/>
    <line x1="625" y1="332" x2="698" y2="220" marker-end="url(#at)"/>
  </g>
</svg>
