<svg width="100%" viewBox="0 0 900 520" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<title>Agent architecture families and rationality</title>
<desc>Five families branch from agent architectures. A broad Rational region covers all of them; an Irrational? region circles hybrid agents and neuro-agents.</desc>
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="20" y="20" width="860" height="480" rx="40" fill="none" stroke="#5ad4b5" stroke-width="2" stroke-dasharray="7 6" vector-effect="non-scaling-stroke"/>
  <text x="50" y="58" fill="#5ad4b5" font-size="22" font-weight="700">Rational</text>
  <ellipse cx="710" cy="290" rx="152" ry="200" fill="none" stroke="#ff939b" stroke-width="2" stroke-dasharray="7 6" vector-effect="non-scaling-stroke"/>
  <text x="710" y="297" text-anchor="middle" fill="#ff939b" font-size="20" font-weight="700">Irrational?</text>
  <ellipse cx="450" cy="290" rx="105" ry="52" fill="#272f3b" stroke="#adb9cb" stroke-width="2"/>
  <text x="450" y="286" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Agent</text>
  <text x="450" y="306" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Architectures</text>
  <g stroke="#f8fafc" stroke-width="1.8" fill="none">
    <line x1="370" y1="258" x2="282" y2="208" marker-end="url(#aw)"/>
    <line x1="450" y1="238" x2="450" y2="164" marker-end="url(#aw)"/>
    <line x1="530" y1="258" x2="616" y2="210" marker-end="url(#aw)"/>
    <line x1="370" y1="322" x2="282" y2="372" marker-end="url(#aw)"/>
    <line x1="530" y1="322" x2="616" y2="370" marker-end="url(#aw)"/>
  </g>
  <ellipse cx="190" cy="170" rx="105" ry="50" fill="#1b3835" stroke="#5ad4b5" stroke-width="2"/>
  <text x="190" y="166" text-anchor="middle" fill="#f8fafc" font-size="16">Reactive</text>
  <text x="190" y="186" text-anchor="middle" fill="#f8fafc" font-size="16">Agents</text>
  <ellipse cx="450" cy="112" rx="105" ry="50" fill="#302b46" stroke="#b89aff" stroke-width="2"/>
  <text x="450" y="108" text-anchor="middle" fill="#f8fafc" font-size="16">Deliberative</text>
  <text x="450" y="128" text-anchor="middle" fill="#f8fafc" font-size="16">Agents</text>
  <ellipse cx="710" cy="170" rx="105" ry="50" fill="#3d3326" stroke="#ffc778" stroke-width="2"/>
  <text x="710" y="166" text-anchor="middle" fill="#f8fafc" font-size="16">Hybrid</text>
  <text x="710" y="186" text-anchor="middle" fill="#f8fafc" font-size="16">Agents</text>
  <ellipse cx="190" cy="410" rx="105" ry="50" fill="#20344c" stroke="#66b3ff" stroke-width="2"/>
  <text x="190" y="406" text-anchor="middle" fill="#f8fafc" font-size="16">Multi-Agent</text>
  <text x="190" y="426" text-anchor="middle" fill="#f8fafc" font-size="16">Systems</text>
  <ellipse cx="710" cy="410" rx="105" ry="50" fill="#3f2a33" stroke="#ff939b" stroke-width="2"/>
  <text x="710" y="406" text-anchor="middle" fill="#f8fafc" font-size="16">Neuro-</text>
  <text x="710" y="426" text-anchor="middle" fill="#f8fafc" font-size="16">Agents</text>
</svg>
