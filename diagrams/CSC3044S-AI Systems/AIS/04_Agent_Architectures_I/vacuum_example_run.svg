<svg width="100%" viewBox="0 0 900 510" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<title>Vacuum world example run</title>
<desc>State-transition graph from the initial state In(0,0), Facing(north). Forward, forward, suck removes Dirt(0,2). Turning first leads east along row 0, where suck changes nothing.</desc>
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5ad4b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <g font-size="13" text-anchor="middle" fill="#f8fafc">
    <rect x="20" y="200" width="170" height="100" rx="40" fill="#20344c" stroke="#66b3ff" stroke-width="2"/>
    <text x="105" y="228">In(0, 0)</text><text x="105" y="246">Facing(north)</text><text x="105" y="264">Dirt(0,2)</text><text x="105" y="282">Dirt(1,2)</text>
    <rect x="250" y="40" width="170" height="100" rx="40" fill="#1b3835" stroke="#5ad4b5" stroke-width="2"/>
    <text x="335" y="68">In(0, 1)</text><text x="335" y="86">Facing(north)</text><text x="335" y="104">Dirt(0,2)</text><text x="335" y="122">Dirt(1,2)</text>
    <rect x="480" y="40" width="170" height="100" rx="40" fill="#1b3835" stroke="#5ad4b5" stroke-width="2"/>
    <text x="565" y="68">In(0, 2)</text><text x="565" y="86">Facing(north)</text><text x="565" y="104">Dirt(0,2)</text><text x="565" y="122">Dirt(1,2)</text>
    <rect x="710" y="45" width="170" height="90" rx="38" fill="#1b3835" stroke="#5ad4b5" stroke-width="2.4"/>
    <text x="795" y="76">In(0, 2)</text><text x="795" y="94">Facing(north)</text><text x="795" y="112">Dirt(1,2)</text>
    <rect x="250" y="260" width="170" height="100" rx="40" fill="#272f3b" stroke="#adb9cb" stroke-width="2"/>
    <text x="335" y="288">In(0, 0)</text><text x="335" y="306">Facing(east)</text><text x="335" y="324">Dirt(0,2)</text><text x="335" y="342">Dirt(1,2)</text>
    <rect x="480" y="260" width="170" height="100" rx="40" fill="#272f3b" stroke="#adb9cb" stroke-width="2"/>
    <text x="565" y="288">In(1, 0)</text><text x="565" y="306">Facing(east)</text><text x="565" y="324">Dirt(0,2)</text><text x="565" y="342">Dirt(1,2)</text>
    <rect x="710" y="220" width="170" height="100" rx="40" fill="#272f3b" stroke="#adb9cb" stroke-width="2"/>
    <text x="795" y="248">In(2, 0)</text><text x="795" y="266">Facing(east)</text><text x="795" y="284">Dirt(0,2)</text><text x="795" y="302">Dirt(1,2)</text>
    <rect x="710" y="390" width="170" height="100" rx="40" fill="#272f3b" stroke="#adb9cb" stroke-width="2"/>
    <text x="795" y="418">In(1, 0)</text><text x="795" y="436">Facing(south)</text><text x="795" y="454">Dirt(0,2)</text><text x="795" y="472">Dirt(1,2)</text>
  </g>
  <g stroke="#5ad4b5" stroke-width="1.8" fill="none">
    <line x1="190" y1="230" x2="248" y2="115" marker-end="url(#at)"/>
    <line x1="420" y1="90" x2="478" y2="90" marker-end="url(#at)"/>
    <line x1="650" y1="90" x2="708" y2="90" marker-end="url(#at)"/>
  </g>
  <g stroke="#f8fafc" stroke-width="1.6" fill="none">
    <line x1="190" y1="275" x2="248" y2="305" marker-end="url(#aw)"/>
    <line x1="420" y1="310" x2="478" y2="310" marker-end="url(#aw)"/>
    <path d="M540 260 C540 215 590 215 590 258" marker-end="url(#aw)"/>
    <line x1="650" y1="295" x2="708" y2="275" marker-end="url(#aw)"/>
    <line x1="650" y1="330" x2="708" y2="425" marker-end="url(#aw)"/>
  </g>
  <g font-size="13" font-style="italic">
    <text x="196" y="160" fill="#5ad4b5">forward</text>
    <text x="449" y="82" text-anchor="middle" fill="#5ad4b5">forward</text>
    <text x="679" y="82" text-anchor="middle" fill="#5ad4b5">suck</text>
    <text x="205" y="306" fill="#f8fafc">turn</text>
    <text x="449" y="302" text-anchor="middle" fill="#f8fafc">forward</text>
    <text x="565" y="208" text-anchor="middle" fill="#f8fafc">suck</text>
    <text x="679" y="278" text-anchor="middle" fill="#f8fafc">forward</text>
    <text x="700" y="375" text-anchor="end" fill="#f8fafc">turn</text>
  </g>
</svg>
