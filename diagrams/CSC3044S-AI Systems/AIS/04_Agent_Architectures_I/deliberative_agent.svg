<svg width="100%" viewBox="0 0 900 320" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<title>Deliberative agent architecture</title>
<desc>Sensors feed a world model, a planner and a plan executor in sequence, which drives the effectors (sense-plan-act).</desc>
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b89aff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="110" y="20" width="680" height="280" rx="30" fill="none" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
  <text x="140" y="50" fill="#adb9cb" font-size="16" font-weight="700">Agent</text>
  <line x1="20" y1="170" x2="148" y2="170" stroke="#f8fafc" stroke-width="3" marker-end="url(#aw)"/>
  <rect x="150" y="65" width="50" height="210" rx="6" fill="#20344c" stroke="#66b3ff" stroke-width="2"/>
  <text x="175" y="175" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700" transform="rotate(-90 175 175)">Sensors</text>
  <rect x="700" y="65" width="50" height="210" rx="6" fill="#1b3835" stroke="#5ad4b5" stroke-width="2"/>
  <text x="725" y="175" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700" transform="rotate(-90 725 175)">Effectors</text>
  <line x1="750" y1="170" x2="880" y2="170" stroke="#f8fafc" stroke-width="3" marker-end="url(#aw)"/>
  <g text-anchor="middle" fill="#f8fafc" font-size="15">
    <rect x="240" y="135" width="120" height="70" rx="8" fill="#302b46" stroke="#b89aff" stroke-width="2"/>
    <text x="300" y="166">World</text>
    <text x="300" y="186">Model</text>
    <rect x="390" y="135" width="120" height="70" rx="8" fill="#302b46" stroke="#b89aff" stroke-width="2"/>
    <text x="450" y="176">Planner</text>
    <rect x="540" y="135" width="120" height="70" rx="8" fill="#302b46" stroke="#b89aff" stroke-width="2"/>
    <text x="600" y="166">Plan</text>
    <text x="600" y="186">executor</text>
  </g>
  <g stroke="#b89aff" stroke-width="1.8" fill="none">
    <line x1="200" y1="170" x2="238" y2="170" marker-end="url(#av)"/>
    <line x1="360" y1="170" x2="388" y2="170" marker-end="url(#av)"/>
    <line x1="510" y1="170" x2="538" y2="170" marker-end="url(#av)"/>
    <line x1="660" y1="170" x2="698" y2="170" marker-end="url(#av)"/>
  </g>
  <g text-anchor="middle" fill="#adb9cb" font-size="13">
    <text x="175" y="292">sense</text>
    <text x="450" y="112">plan</text>
    <text x="725" y="292">act</text>
  </g>
</svg>
