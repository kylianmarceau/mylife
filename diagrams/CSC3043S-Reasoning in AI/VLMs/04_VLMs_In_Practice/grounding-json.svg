<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 400" role="img"><title>Grounding as text tokens</title><desc>Asked to find every coffee cup, the model outputs JSON with bounding-box coordinates as ordinary number tokens.</desc><defs></defs><text x="500.0" y="41.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">Grounding: boxes are just number tokens in the output</text><rect x="40.0" y="70.0" width="440.0" height="290.0" rx="6" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="260.0" y="344.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">image (schematic)</text><rect x="80.0" y="250.0" width="360.0" height="14.0" rx="2" fill="#3d3326" stroke="#ffc778" stroke-width="1" vector-effect="non-scaling-stroke"/><text x="260.0" y="283.9" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#adb9cb">table</text><rect x="150.0" y="180.0" width="70.0" height="70.0" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.6" vector-effect="non-scaling-stroke"/><rect x="144.0" y="174.0" width="82.0" height="82.0" rx="2" fill="none" stroke="#ff939b" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="185.0" y="168.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#ff939b">cup 1</text><rect x="300.0" y="170.0" width="75.0" height="80.0" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.6" vector-effect="non-scaling-stroke"/><rect x="294.0" y="164.0" width="87.0" height="92.0" rx="2" fill="none" stroke="#ff939b" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="337.5" y="158.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#ff939b">cup 2</text><rect x="520.0" y="95.0" width="440.0" height="50.0" rx="8" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="740.0" y="124.5" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" font-weight="500">USER: Find every coffee cup. Report boxes as JSON.</text><rect x="520.0" y="175.0" width="440.0" height="110.0" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="740.0" y="219.2" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#f8fafc" font-weight="500">MODEL:</text><text x="740.0" y="234.2" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#f8fafc" font-weight="500">[{"label":"coffee cup","bbox":[712,418,864,590]},</text><text x="740.0" y="249.2" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#f8fafc" font-weight="500"> {"label":"coffee cup","bbox":[1024,388,1189,566]}]</text><text x="500.0" y="389.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb">No detection head: M-RoPE ties patches to absolute pixel positions, so coordinates are checkable</text></svg>
