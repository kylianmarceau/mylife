<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 420" role="img"><title>Caption prediction versus contrastive efficiency</title><desc>Zero-shot ImageNet accuracy against images processed: the bag-of-words contrastive objective is 4x more efficient than bag-of-words prediction, which is 3x more efficient than a transformer language model.</desc><defs><marker id="mf8fafc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="470.0" y="41.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">Contrastive matching learns ≈ 12× faster than generating captions</text><path d="M120.0 340.0 L640.0 340.0" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#mf8fafc)"/><path d="M120.0 340.0 L120.0 80.0" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#mf8fafc)"/><text x="380.0" y="378.9" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb">Images processed</text><text x="58.0" y="210.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb" transform="rotate(-90 58.0 210.0)">Zero-shot ImageNet accuracy (%)</text><text x="110.0" y="344.2" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">0</text><text x="110.0" y="282.3" text-anchor="end" font-family="Inter