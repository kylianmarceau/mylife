<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 980 340" role="img"><title>Uniform frame sampling</title><desc>A clip of many frames is uniformly sampled every sixth frame; a fast event between samples is missed.</desc><defs><marker id="m5ad4b5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="490.0" y="41.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">Uniform sampling: cheap, but a fast event between samples is lost</text><rect x="40.0" y="100.0" width="26.0" height="40.0" rx="2" fill="#272f3b" stroke="#adb9cb" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="37.0" y="97.0" width="32.0" height="46.0" rx="3" fill="none" stroke="#5ad4b5" stroke-width="2.2" vector-effect="non-scaling-stroke"/><path d="M53.0 150.0 L53.0 200.0" fill="none" stroke="#5ad4b5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#m5ad4b5)"/><rect x="23.0" y="203.0" width="60.0" height="44.0" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="53.0" y="229.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#f8fafc" font-weight="600">kept</text><rect x="70.0" y="100.0" width="26.0" height="40.0" rx="2" fill="#272f3b" stroke="#adb9cb" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="100.0" y="100.0" width="26.0" height="40.0" rx="2" fill="#272f3b" stroke="#adb9cb" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="130.0" y="100.0" width="26.0" height="40.0" rx="2" fill="#272f3b" stroke="#adb9cb" stroke