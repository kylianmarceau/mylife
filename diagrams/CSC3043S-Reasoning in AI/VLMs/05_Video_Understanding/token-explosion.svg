t><text x="800.0" y="159.8" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" fill="#ff939b" font-weight="700">≈ 830,000</text><text x="800.0" y="189.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ff939b">tokens per minute</text><text x="470.0" y="304.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb">Impossible with quadratic attention. Time also adds motion, causality, and before/after</text></svg>
