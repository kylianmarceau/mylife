<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 330" role="img"><title>Token explosion for video</title><desc>One minute at 24 fps is 1,440 frames; at 576 tokens per frame that is about 830,000 tokens.</desc><defs></defs><text x="470.0" y="41.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">Video is "just images", but the token count explodes</text><rect x="60.0" y="120.0" width="80.0" height="60.0" rx="4" fill="#20344c" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/><rect x="92.0" y="120.0" width="80.0" height="60.0" rx="4" fill="#20344c" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/><rect x="124.0" y="120.0" width="80.0" height="60.0" rx="4" fill="#20344c" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/><rect x="156.0" y="120.0" width="80.0" height="60.0" rx="4" fill="#20344c" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/><rect x="188.0" y="120.0" width="80.0" height="60.0" rx="4" fill="#20344c" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/><rect x="220.0" y="120.0" width="80.0" height="60.0" rx="4" fill="#20344c" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/><rect x="252.0" y="120.0" width="80.0" height="60.0" rx="4" fill="#20344c" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/><rect x="284.0" y="120.0" width="80.0" height="60.0" rx="4" fill="#20344c" stroke="#66b3ff" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="230.0" y="214.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#66b3ff">1 minute at 24 fps = 1,440 frames</text><text x="470.0" y="159.1" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system,