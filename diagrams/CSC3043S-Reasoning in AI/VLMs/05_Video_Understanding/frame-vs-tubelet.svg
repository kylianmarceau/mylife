<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 980 360" role="img"><title>Frame tokens versus tubelet tokens</title><desc>Frame tokens patchify each frame separately; a tubelet token spans the same P by P patch across tau consecutive frames.</desc><defs><marker id="m5ad4b5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="490.0" y="41.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">Frame tokens versus tubelet tokens</text><rect x="20.0" y="60.0" width="460.0" height="260.0" rx="12" fill="none" stroke="#66b3ff" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="34.0" y="82.5" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#66b3ff" font-weight="600">FRAME TOKENS</text><rect x="60.0" y="120.0" width="30.0" height="30.0" rx="2" fill="#20344c" stroke="#66b3ff" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="94.0" y="120.0" width="30.0" height="30.0" rx="2" fill="#20344c" stroke="#66b3ff" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="128.0" y="120.0" width="30.0" height="30.0" rx="2" fill="#20344c" stroke="#66b3ff" stroke-width="1" vector-effect="non-scaling-stroke"/><text x="110.0" y="174.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">frame 1</text><rect x="200.0" y="120.0" width="30.0" height="30.0" rx="2" fill="#20344c" stroke="#66b3ff" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="234.0" y="120.0" width="30.0" height="30.0" rx="2" fill="#20344c" stroke="#66b3ff" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="268.0" y="120.0" width="30.0" height="30.0" rx="2" fill="#20344c" stroke="#66b3ff" stroke-width="1" vector-effect="non-scaling-stroke"/><text x="250.0" y="174.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">frame 2</text><rect x="340.0" y="120.0" width="30.0" height="30.0" rx="2" fill="#20344c" stroke="#66b3ff" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="374.0" y="120.0" width="30.0" height="30.0" rx="2" fill="#20344c" stroke="#66b3ff" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="408.0" y="120.0" width="30.0" height="30.0" rx="2" fill="#20344c" stroke="#66b3ff" stroke-width="1" vector-effect="non-scaling-stroke"/><text x="390.0" y="174.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">frame 3</text><text x="250.0" y="234.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#66b3ff">patchify each frame, concatenate in order</text><text x="250.0" y="259.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb">time lives only in order + position</text><rect x="500.0" y="60.0" width="460.0" height="260.0" rx="12" fill="none" stroke="#5ad4b5" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="514.0" y="82.5" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5ad4b5" font-weight="600">TUBELET TOKENS</text><rect x="560.0" y="110.0" width="70.0" height="70.0" rx="3" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/><rect x="576.0" y="124.0" width="70.0" height="70.0" rx="3" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/><rect x="592.0" y="138.0" width="70.0" height="70.0" rx="3" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/><path d="M680.0 160.0 L770.0 160.0" fill="none" stroke="#5ad4b5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#m5ad4b5)"/><text x="725.0" y="152.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5ad4b5">project</text><rect x="790.0" y="135.0" width="140.0" height="50.0" rx="8" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="860.0" y="156.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" font-weight="600">one token</text><text x="860.0" y="175.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">P × P × τ</text><text x="730.0" y="244.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5ad4b5">one token spans space AND time (ViViT, VideoMAE)</text><text x="730.0" y="269.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb">motion inside each token, fewer tokens</text></svg>
