<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 440" role="img"><title>ViT versus CNN as pretraining data grows</title><desc>On ImageNet the BiT ResNets beat ViTs; on ImageNet-21k they are similar; on JFT-300M large ViTs (ViT-H/14, ViT-L/16) overtake.</desc><defs><marker id="mf8fafc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="470.0" y="41.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">ViT needs scale: CNNs win on small data, ViTs win at JFT-300M</text><path d="M120.0 360.0 L760.0 360.0" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#mf8fafc)"/><path d="M120.0 360.0 L120.0 80.0" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#mf8fafc)"/><text x="440.0" y="398.9" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb">Pretraining dataset</text><text x="58.0" y="220.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#adb9cb" transform="rotate(-90 58.0 220.0)">ImageNet top-1 (%)</text><text x="200.0" y="382.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">ImageNet (1.3M)</text><text x="440.0" y="382.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">ImageNet-21k (14M)</text><text x="680.0" y="382.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">JFT-300M (303M)</text><text x="110.0" y="364.2" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">70</text><text x="110.0" y="294.2" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">75</text><text x="110.0" y="224.2" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">80</text><text x="110.0" y="154.2" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">85</text><text x="110.0" y="84.2" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">90</text><polygon points="200.0,199.0 440.0,150.0 680.0,122.0 680.0,234.0 440.0,220.0 200.0,262.0" fill="#272f3b" stroke="#adb9cb" stroke-width="1.2"/><text x="230.0" y="234.0" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">BiT (ResNet) range</text><path d="M200.0 318.0 L440.0 220.0 L680.0 206.0" fill="none" stroke="#b89aff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="200.0" cy="318.0" r="5" fill="#b89aff" stroke="#b89aff" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="440.0" cy="220.0" r="5" fill="#b89aff" stroke="#b89aff" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="680.0" cy="206.0" r="5" fill