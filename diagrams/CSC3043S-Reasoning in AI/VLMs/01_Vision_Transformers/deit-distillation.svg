<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 380" role="img"><title>DeiT distillation token</title><desc>DeiT adds a [DIST] token next to [CLS]; the [CLS] output is trained against ground-truth labels and the [DIST] output against a CNN teacher's predictions.</desc><defs><marker id="m66b3ff" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="madb9cb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mffc778" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="470.0" y="41.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">DeiT: a distillation token learns from a CNN teacher</text><rect x="40.0" y="175.0" width="140.0" height="50.0" rx="8" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="110.0" y="204.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" font-weight="600">Training image</text><rect x="300.0" y="155.0" width="260.0" height="90.0" rx="8" fill="#302b46" stroke="#b89aff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="430.0" y="196.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sa