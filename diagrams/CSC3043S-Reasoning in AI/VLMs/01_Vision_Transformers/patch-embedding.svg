<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 980 330" role="img"><title>Patch embedding</title><desc>One 16 by 16 by 3 patch is flattened to a 768-vector and mapped by a single shared learned matrix E to a D-dimensional patch embedding.</desc><defs><marker id="mb89aff" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mf8fafc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="490.0" y="41.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">Flatten, then one shared linear projection E</text><rect x="60.0" y="120.0" width="100.0" height="100.0" rx="8" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="110.0" y="174.9" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f8fafc" font-weight="600">patch</text><text x="110.0" y="244.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb">16 × 16 × 3</text><path d="M175.0 170.0 L240.0 170.0" fill="none" stroke="#f8fafc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#mf8fafc)"/><text x="207.5" y="162.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">flatten</text><rect x="255.0" y="95.0" width="26.0" height="13.0" rx="2" fill="#1b3835" stroke="#5ad4b5" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="255.0" y="110.0" width="26.0" height="13.0" rx="2" fill="#1b3835" stroke="#5ad4b5" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="255.0" y="125.0" width="26.0" height="13.0" rx="2" fill="#1b3835" stroke="#5ad4b5" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="255.0" y="140.0" width="26.0" height="13.0" rx="2" fill="#1b3835" stroke="#5ad4b5" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="255.0" y="155.0" width="26.0" height="13.0" rx="2" fill="#1b3835" stroke="#5ad4b5" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="255.0" y="170.0" width="26.0" height="13.0" rx="2" fill="#1b3835" stroke="#5ad4b5" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="255.0" y="185.0" width="26.0" height="13.0" rx="2" fill="#1b3835" stroke="#5ad4b5" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="255.0" y="200.0" width="26.0" height="13.0" rx="2" fill="#1b3835" stroke="#5ad4b5" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="255.0" y="215.0" width="26.0" height="13.0" rx="2" fill="#1b3835" stroke="#5ad4b5" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="255.0" y="230.0" width="26.0" height="13.0" rx="2" fill="#1b3835" stroke="#5ad4b5" stroke-width="1" vector-effect="non-scaling-stroke"/><text x="268.0" y="269.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5ad4b5">768 values</text><path d="M300.0 170.0 L420.0 170.0" fill="none" stroke="#b89aff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#mb89aff)"/><text x="360.0" y="160.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#b89aff">E  (768 × D)</text><text x="360.0" y="196.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">learned</text><rect x="435.0" y="95.0" width="26.0" height="13.0" rx="2" fill="#302b46" stroke="#b89aff" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="435.0" y="110.0" width="26.0" height="13.0" rx="2" fill="#302b46" stroke="#b89aff" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="435.0" y="125.0" width="26.0" height="13.0" rx="2" fill="#302b46" stroke="#b89aff" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="435.0" y="140.0" width="26.0" height="13.0" rx="2" fill="#302b46" stroke="#b89aff" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="435.0" y="155.0" width="26.0" height="13.0" rx="2" fill="#302b46" stroke="#b89aff" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="435.0" y="170.0" width="26.0" height="13.0" rx="2" fill="#302b46" stroke="#b89aff" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="435.0" y="185.0" width="26.0" height="13.0" rx="2" fill="#302b46" stroke="#b89aff" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="435.0" y="200.0" width="26.0" height="13.0" rx="2" fill="#302b46" stroke="#b89aff" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="435.0" y="215.0" width="26.0" height="13.0" rx="2" fill="#302b46" stroke="#b89aff" stroke-width="1" vector-effect="non-scaling-stroke"/><rect x="435.0" y="230.0" width="26.0" height="13.0" rx="2" fill="#302b46" stroke="#b89aff" stroke-width="1" vector-effect="non-scaling-stroke"/><text x="448.0" y="269.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#b89aff">D-dim token</text><rect x="540.0" y="90.0" width="410.0" height="160.0" rx="12" fill="none" stroke="#adb9cb" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="554.0" y="112.5" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" font-weight="600">THE TEXT ANALOGY</text><text x="560.0" y="144.9" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f8fafc">word  →  token id  →  embedding lookup</text><text x="560.0" y="179.9" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f8fafc">patch →  pixel vec →  linear projection</text><text x="560.0" y="224.6" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb">pixels are continuous: no vocabulary</text><text x="490.0" y="314.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb">Projection by E equals a Conv2d with kernel size and stride P</text></svg>
