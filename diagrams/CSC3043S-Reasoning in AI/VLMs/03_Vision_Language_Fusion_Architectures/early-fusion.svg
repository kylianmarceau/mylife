<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 980 320" role="img"><title>Early fusion</title><desc>Text and image tokens are interleaved into one stream for a single transformer trained from the start on mixed tokens, with no frozen parts or adapter.</desc><defs><marker id="madb9cb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="490.0" y="41.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">Native multimodality: one transformer over one interleaved stream</text><rect x="64.0" y="100.0" width="92.0" height="40.0" rx="8" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="110.0" y="124.5" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" font-weight="600">txt</text><path d="M110.0 141.0 L110.0 192.0" fill="none" stroke="#adb9cb" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#madb9cb)"/><rect x="172.0" y="100.0" width="92.0" height="40.0" rx="8" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="218.0" y="124.5" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" font-weight="600">txt</text><path d="M218.0 141.0 L218.0 192.0" fill="none" stroke="#adb9cb" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#madb9cb)"/><rect x="280.0" y="100.0" width="92.0" height="40.0" rx="8" fill="#1b3835" stroke=