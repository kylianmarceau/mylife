<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 420" role="img"><title>Two topologies, same joint distribution</title><desc>R → T with P(R) and P(T|R), and T → R with P(T) and P(R|T), both give the joint 3/16, 1/16, 6/16, 6/16.</desc><defs><marker id="m66b3ff" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mb89aff" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="470.0" y="41.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">Different arc direction, identical joint distribution</text><rect x="30.0" y="70.0" width="300.0" height="300.0" rx="12" fill="none" stroke="#66b3ff" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="44.0" y="92.5" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#66b3ff" font-weight="600">R → T</text><ellipse cx="110.0" cy="150.0" rx="28.0" ry="28.0" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="110.0" y="155.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" font-weight="600">R</text><ellipse cx="110.0" cy="290.0" rx="28.0" ry="28.0" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="110.0" y="295.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" font-weight="600">T</text><path d="M110.0 181.0 L110.0 257.0" fill="none" stroke="#66b3ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#m66b3ff)"/><text x="240.0" y="144.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#66b3ff">P(+r) = 1/4</text><text x="240.0" y="234.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#66b3ff">P(+t | +r) = 3/4</text><text x="240.0" y="259.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#66b3ff">P(+t | −r) = 1/2</text><rect x="610.0" y="70.0" width="300.0" height="300.0" rx="12" fill="none" stroke="#b89aff" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="624.0" y="92.5" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#b89aff" font-weight="600">T → R</text><ellipse cx="690.0" cy="150.0" rx="28.0" ry="28.0" fill="#302b46" stroke="#b89aff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="690.0" y="155.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" font-weight="600">T</text><ellipse cx="690.0" cy="290.0" rx="28.0" ry="28.0" fill="#302b46" stroke="#b89aff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="690.0" y="295.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" font-weight="600">R</text><path d="M690.0 181.0 L690.0 257.0" fill="none" stroke="#b89aff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#mb89aff)"/><text x="820.0" y="144.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#b89aff">P(+t) = 9/16</text><text x="820.0" y="234.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#b89aff">P(+r | +t) = 1/3</text><text x="820.0" y="259.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#b89aff">P(+r | −t) = 1/7</text><text x="470.0" y="124.9" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#5ad4b5" font-weight="600">Joint P(R, T)</text><rect x="380.0" y="140.0" width="60.0" height="36.0" rx="3" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="410.0" y="162.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">+r</text><rect x="440.0" y="140.0" width="60.0" height="36.0" rx="3" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="470.0" y="162.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">+t</text><rect x="500.0" y="140.0" width="60.0" height="36.0" rx="3" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="530.0" y="162.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">3/16</text><rect x="380.0" y="176.0" width="60.0" height="36.0" rx="3" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="410.0" y="198.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">+r</text><rect x="440.0" y="176.0" width="60.0" height="36.0" rx="3" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="470.0" y="198.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">−t</text><rect x="500.0" y="176.0" width="60.0" height="36.0" rx="3" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="530.0" y="198.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">1/16</text><rect x="380.0" y="212.0" width="60.0" height="36.0" rx="3" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="410.0" y="234.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">−r</text><rect x="440.0" y="212.0" width="60.0" height="36.0" rx="3" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="470.0" y="234.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">+t</text><rect x="500.0" y="212.0" width="60.0" height="36.0" rx="3" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="530.0" y="234.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">6/16</text><rect x="380.0" y="248.0" width="60.0" height="36.0" rx="3" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="410.0" y="270.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">−r</text><rect x="440.0" y="248.0" width="60.0" height="36.0" rx="3" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="470.0" y="270.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">−t</text><rect x="500.0" y="248.0" width="60.0" height="36.0" rx="3" fill="#1b3835" stroke="#5ad4b5" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="530.0" y="270.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">6/16</text><path d="M335.0 210.0 L375.0 210.0" fill="none" stroke="#66b3ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#m66b3ff)"/><path d="M605.0 210.0 L565.0 210.0" fill="none" stroke="#b89aff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#mb89aff)"/><text x="470.0" y="404.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb">Arc direction is not causality: both networks encode the same distribution</text></svg>
