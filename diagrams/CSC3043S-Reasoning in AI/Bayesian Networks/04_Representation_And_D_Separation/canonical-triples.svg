<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 420" role="img"><title>The three canonical triples</title><desc>Causal chain: low pressure → rain → traffic. Common cause: project due → forums busy and lab full. Common effect: raining and sports match → traffic.</desc><defs><marker id="m66b3ff" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mb89aff" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mffc778" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="480.0" y="41.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">Three canonical triples</text><rect x="20.0" y="60.0" width="300.0" height="300.0" rx="12" fill="none" stroke="#66b3ff" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="34.0" y="82.5" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#66b3ff" font-weight="600">1. CAUSAL CHAIN</text><ellipse cx="170.0" cy="115.0" rx="85.0" ry="22.0" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="170.0" y="119.5" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" font-weight="600">X: Low pressure</text><ellipse cx="170.0" cy="205.0" rx="85.0" ry="22.0" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="170.0" y="209.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" font-weight="600">Y: Rain</text><ellipse cx="170.0" cy="295.0" rx="85.0" ry="22.0" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="170.0" y="299.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" font-weight="600">Z: Traffic</text><path d="M170.0 140.0 L170.0 178.0" fill="none" stroke="#66b3ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#m66b3ff)"/><path d="M170.0 230.0 L170.0 268.0" fill="none" stroke="#66b3ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#m66b3ff)"/><rect x="330.0" y="60.0" width="300.0" height="300.0" rx="12" fill="none" stroke="#b89aff" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="344.0" y="82.5" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#b89aff" font-weight="600">2. COMMON CAUSE</text><ellipse cx="480.0" cy="125.0" rx="85.0" ry="22.0" fill="#302b46" stroke="#b89aff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="480.0" y="129.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" font-weight="600">Y: Project due</text><ellipse cx="400.0" cy="270.0" rx="70.0" ry="22.0" fill="#302b46" stroke="#b89aff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="400.0" y="274.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#f8fafc" font-weight="600">X: Forums busy</text><ellipse cx="560.0" cy="270.0" rx="65.0" ry="22.0" fill="#302b46" stroke="#b89aff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="560.0" y="274.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#f8fafc" font-weight="600">Z: Lab full</text><path d="M466.4 149.7 L414.6 243.5" fill="none" stroke="#b89aff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#mb89aff)"/><path d="M493.6 149.7 L545.4 243.6" fill="none" stroke="#b89aff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#mb89aff)"/><rect x="640.0" y="60.0" width="300.0" height="300.0" rx="12" fill="none" stroke="#ffc778" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="654.0" y="82.5" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ffc778" font-weight="600">3. COMMON EFFECT (V-STRUCTURE)</text><ellipse cx="715.0" cy="130.0" rx="65.0" ry="22.0" fill="#3d3326" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="715.0" y="134.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#f8fafc" font-weight="600">X: Raining</text><ellipse cx="870.0" cy="130.0" rx="65.0" ry="22.0" fill="#3d3326" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="870.0" y="134.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#f8fafc" font-weight="600">Y: Sports</text><ellipse cx="790.0" cy="275.0" rx="75.0" ry="22.0" fill="#3d3326" stroke="#ffc778" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="790.0" y="279.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" font-weight="600">Z: Traffic</text><path d="M727.7 154.6 L776.2 248.4" fill="none" stroke="#ffc778" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#mffc778)"/><path d="M856.5 154.5 L804.6 248.5" fill="none" stroke="#ffc778" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#mffc778)"/><text x="170.0" y="390.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#66b3ff" font-weight="600">X ⫫ Z | Y</text><text x="480.0" y="390.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#b89aff" font-weight="600">X ⫫ Z | Y</text><text x="790.0" y="390.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#ffc778" font-weight="600">X ⫫ Y, but not given Z</text></svg>
