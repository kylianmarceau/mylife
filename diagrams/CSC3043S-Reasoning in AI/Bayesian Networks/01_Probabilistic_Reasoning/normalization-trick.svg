<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 370" role="img"><title>Normalization trick for P(W | T = cold)</title><desc>Select the joint rows with T = cold (0.2 and 0.3), sum them to get Z = 0.5 = P(cold), divide each by Z to get 0.4 and 0.6.</desc><defs><marker id="m5ad4b5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mffc778" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#ffc778" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="470.0" y="41.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">The normalization trick: select, then normalize</text><text x="150.0" y="82.9" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#66b3ff" font-weight="600">Joint P(T, W)</text><rect x="60.0" y="95.0" width="60.0" height="38.0" rx="3" fill="#272f3b" stroke="#adb9cb" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="90.0" y="118.5" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">T</text><rect x="120.0" y="95.0" width="60.0" height="38.0" rx="3" fill="#272f3b" stroke="#adb9cb" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="150.0" y="118.5" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">W</text><rect x="180.0" y="95.0" width="60.0" height="38.0" rx="3" fill="#272f3b" stroke="#adb9cb" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="210.0" y="118.5" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">P</text><rect x="60.0" y="133.0" width="60.0" height="38.0" rx="3" fill="#272f3b" stroke="#adb9cb" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="90.0" y="156.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">hot</text><rect x="120.0" y="133.0" width="60.0" height="38.0" rx="3" fill="#272f3b" stroke="#adb9cb" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="150.0" y="156.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">sun</text><rect x="180.0" y="133.0" width="60.0" height="38.0" rx="3" fill="#272f3b" stroke="#adb9cb" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="210.0" y="156.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">0.4</text><rect x="60.0" y="171.0" width="60.0" height="38.0" rx="3" fill="#272f3b" stroke="#adb9cb" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="90.0" y="194.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">hot</text><rect x="120.0" y="171.0" width="60.0" height="38.0" rx="3" fill="#272f3b" stroke="#adb9cb" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="150.0" y="194.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">rain</text><rect x="180.0" y="171.0" width="60.0"