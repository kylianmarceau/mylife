<title>Modern decoder-only transformer and its block</title><desc>Left: embedding, N blocks, final RMSNorm, linear, softmax. Right: one block with pre-RMSNorm, causal grouped-query attention with RoPE, and a SwiGLU feed-forward network, each with a residual add.</desc>
