<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 440" role="img"><title>PPO clipped objective</title><desc>For positive advantage, the objective stops increasing once the ratio exceeds 1 + epsilon; for negative advantage, it stops decreasing below 1 - epsilon.</desc><defs><marker id="mf8fafc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="470.0" y="41.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">PPO clipping limits how far one update can move the policy</text><path d="M60.0 215.0 L420.0 215.0" fill="none" stroke="#f8fafc" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#mf8fafc)"/><path d="M80.0 330.0 L80.0 100.0" fill="none" stroke="#f8fafc" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#mf8fafc)"/><text x="260.0" y="85.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#5ad4b5" font-weight="600">A &gt; 0</text><path d="M80.0 215.0 L278.0 113.0 L410.0 113.0" fill="none" stroke="#5ad4b5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M278.0 110.0 L278.0 320.0" fill="none" stroke="#ffc778" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/><text x="278.0" y="336.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ffc778">1 + ε</text><circle cx="245.0" cy="130.0" r="5" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.6" vector-effect="non-scaling-stroke"/><text x="239.0" y="116.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">r = 1</text><text x="420.0" y="239.2" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">ratio r = π_θ / π_θk</text><path d="M510.0 215.0 L870.0 215.0" fill="none" stroke="#f8fafc" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#mf8fafc)"/><path d="M530.0 330.0 L530.0 100.0" fill="none" stroke="#f8fafc" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#mf8fafc)"/><text x="710.0" y="85.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#ff939b" font-weight="600">A &lt; 0</text><path d="M530.0 283.0 L662.0 283.0 L860.0 385.0" fill="none" stroke="#ff939b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M662.0 110.0 L662.0 320.0" fill="none" stroke="#ffc778" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/><text x="662.0" y="336.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#ffc778">1 − ε</text><circle cx="695.0" cy="300.0" r="5" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.6" vector-effect="non-scaling-stroke"/><text x="689.0" y="322.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">r = 1</text><text x="870.0" y="239.2" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#adb9cb">ratio r = π_θ / π_θk</text><text x="470.0" y="429.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb">L = min(r·A, clip(r, 1 − ε, 1 + ε)·A): no extra reward for moving the ratio beyond the clip range</text></svg>
