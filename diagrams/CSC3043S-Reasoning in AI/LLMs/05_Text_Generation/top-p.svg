<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 380" role="img"><title>Top-p (nucleus) sampling</title><desc>Three next-token distributions of different shape: the smallest set reaching cumulative probability p contains many tokens when flat and few when peaked.</desc><defs></defs><text x="480.0" y="41.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">Top-p keeps the smallest set with cumulative probability ≥ p</text><text x="170.0" y="84.9" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#b89aff" font-weight="600">P¹ₜ: medium</text><rect x="43.0" y="256.0" width="20.0" height="44.0" rx="2" fill="#302b46" stroke="#b89aff" stroke-width="1.4" vector-effect="non-scaling-stroke"/><rect x="69.0" y="264.0" width="20.0" height="36.0" rx="2" fill="#302b46" stroke="#b89aff" stroke-width="1.4" vector-effect="non-scaling-stroke"/><rect x="95.0" y="272.0" width="20.0" height="28.0" rx="2" fill="#302b46" stroke="#b89aff" stroke-width="1.4" vector-effect="non-scaling-stroke"/><rect x="121.0" y="278.0" width="20.0" height="22.0" rx="2" fill="#302b46" stroke="#b89aff" stroke-width="1.4" vector-effect="non-scaling-stroke"/><rect x="147.0" y="282.0" width="20.0" height="18.0" rx="2" fill="#302b46" stroke="#b89aff" stroke-width="1.4" vector-effect="non-scaling-stroke"/><rect x="173.0" y="286.0" width="20.0" height="14.0" rx="2" fill="#272f3b" stroke="#adb9cb" stroke-width="1.4" vector-effect="non-scaling-stroke"/><rect x="199.0" y="288.0" width="20.0" height="12.0" rx="2" fill="#272f3b" stroke="#adb9cb" stroke-width="1.4" vector-effect="non-scaling-stroke"/><rect x="225.0" y="290.0" width="20.0" height="10.0" rx="2" fill="#272f3b" stroke="#adb9cb" stroke-width="1.4" vector-effect="non-scaling-stroke"/><rect x="251.0" y="292.0" width="20.0" heigh