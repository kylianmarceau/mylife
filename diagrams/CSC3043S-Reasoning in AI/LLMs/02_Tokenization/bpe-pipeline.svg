<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 330" role="img"><title>BPE applied to a sentence</title><desc>Raw text is pre-tokenized with start-of-word markers, then learned merges split words into subword tokens.</desc><defs><marker id="m5ad4b5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m66b3ff" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#66b3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="470.0" y="41.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">Applying a BPE tokenizer</text><text x="40.0" y="99.5" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#adb9cb" font-weight="600">Raw text</text><rect x="210.0" y="78.0" width="336.0" height="34.0" rx="8" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="378.0" y="99.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#f8fafc" font-weight="500">This is a newly spoken sentence.</text><text x="40.0" y="184.6" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#66b3ff" font-weight="600">Pre-tokenize + _</text><rect x="210.0" y="163.0" width="66.0" height="34.0" rx="8" fill="#20344c" stroke="#66b3ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="243.0" y="184.6" text-anchor="middle" font-family="ui-