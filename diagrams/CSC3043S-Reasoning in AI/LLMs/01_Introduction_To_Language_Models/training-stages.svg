<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 360" role="img"><title>Three stages of LLM training</title><desc>Pretraining on text gives a pretrained LLM; instruction tuning on instruction data gives an instruction-tuned LLM; preference alignment on preference data gives an aligned LLM.</desc><defs><marker id="m5ad4b5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#5ad4b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="madb9cb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#adb9cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mb89aff" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#b89aff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mf8fafc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mff939b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#ff939b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="480.0" y="41.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#66b3ff" font-weight="600">Three stages of LLM training</text><rect x="45.0" y="80.0" width="250.0" height="60.0" rx="8" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="170.0" y="114.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#f8fafc" font-weight="500">Large text corpora</text><rect x="60.0" y="180.0" width="220.0" height="50.0" rx="8" fill="#3f2a33" stroke="#ff939b" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="170.0" y="210.2" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f8fafc" font-weight="600">1. Pretraining</text><rect x="70.0" y="273.0" width="200.0" height="44.0" rx="8" fill="#3f2a33" stroke="#ff939b" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="170.0" y="299.6" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#f8fafc" font-weight="500">Pretrained LLM</text><path d="M170.0 143.0 L170.0 175.0" fill="none" stroke="#adb9cb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#madb9cb)"/><path d="M170.0 233.0 L170.0 268.0" fill="none" stroke="#ff939b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" marker-end="url(#mff939b)"/><rect x="355.0" y="80.0" width="250.0" height="60.0" rx="8" fill="#272f3b" stroke="#adb9cb" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="480.0" y="106.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#f8fafc" font-weight="500">Instruction → response pairs</text><text x="480.0" y="121.7" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#f8fafc" font-weight="500">(sentiment, summarize, translate)</text><rect x="370.0" y="1